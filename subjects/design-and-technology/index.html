PAGES.components = {t:'Components & fixings',html:()=>`
${head('Paper 3 · Components','Pre-manufactured components','Screws, nails, nuts, bolts, washers, hinges and catches – and how their sizes are specified.')}
${toc([['sb','Screw builder'],['spot','Name that screw'],['nb','Nuts, bolts & washers'],['nails','Nails'],['hinge','Hinges & catches']])}
<h2 id="sb" class="sec">Screw & bolt builder</h2>
<div class="card">${lab('Build a fastener','change any option – the name & spec update live')}
<div class="grid g2"><div><div class="pdiag"><svg id="fbSvg" viewBox="0 0 420 200"></svg></div><div class="spec" style="margin-top:10px"><p id="fbName" style="font-weight:700;font-size:1.02rem"></p><p class="small" id="fbSub"></p></div><div class="flex"><button class="btn ghost sm" id="fbCopy">Copy spec</button><button class="btn ghost sm" id="fbRand">Random</button></div></div>
<div><div class="ctrl" style="flex-direction:column;align-items:stretch;gap:10px" id="fbCtrl"></div></div></div>
<div class="grid g2" style="margin-top:10px"><div class="card" style="box-shadow:none"><h4>Holes needed</h4><div id="fbHoles" class="small"></div></div><div class="card" style="box-shadow:none"><h4>Why this choice?</h4><div id="fbWhy" class="small"></div></div></div></div>
<div class="tip"><p><b>Specifying a wood screw:</b> length × gauge, head type, drive, material and finish – e.g. "<b>30 mm × No. 8 countersunk Pozidriv steel wood screw, zinc plated</b>". <b>Bolts/machine screws:</b> "M6 × 30" = ISO metric thread, 6 mm diameter, 30 mm long (under the head; overall for countersunk).</p></div>
<h2 id="spot" class="sec">Name that screw</h2>
<div class="card">${lab('Spot the fastener','pick the correct name')}<div class="grid g2"><div class="pdiag"><svg id="nsSvg" viewBox="0 0 420 200"></svg></div><div><div id="nsOpts"></div><div id="nsRes" class="res"></div><div class="flex" style="margin-top:6px"><button class="btn sm" id="nsNext">Next ▶</button><span class="pill" id="nsScore">0 / 0</span></div></div></div></div>
<h2 id="nb" class="sec">Nuts, bolts &amp; washers</h2>
<div class="grid g4">${[['Hexagon nut','Standard nut tightened with a spanner.'],['Wing nut','Tightened by hand – for parts removed often.'],['Nyloc (lock) nut','Nylon insert grips the thread – resists vibration.'],['Dome (cap) nut','Decorative; covers the sharp thread end.'],['Castle nut','Slotted – a split pin locks it (axles).'],['Plain washer','Spreads the load and protects the surface.'],['Spring washer','Split ring – stops the nut loosening.'],['Coach bolt','Domed head + square neck that grips wood – can\'t turn.'],['Hex head bolt','Plain shank + thread; spanner on head.'],['Socket cap screw','Allen key head – neat, can be counterbored.'],['Set screw','Fully threaded bolt.'],['Threaded rod (studding)','Cut to any length; nuts on both ends.']].map(([a,b])=>`<div class="card" style="padding:12px"><b>${a}</b><p class="small muted" style="margin:3px 0 0">${b}</p></div>`).join('')}</div>
<h2 id="nails" class="sec">Nails</h2>
<div class="tw"><table class="t"><tr><th>Nail</th><th>Description & use</th></tr><tr><td>Round wire nail</td><td>Round head and shank; strong, general carpentry where appearance doesn't matter – can split wood.</td></tr><tr><td>Oval wire nail</td><td>Oval shank (place long axis along the grain) – less likely to split; head can be punched below the surface.</td></tr><tr><td>Panel pin</td><td>Thin, small head – fixing thin panels, mouldings and backs of cabinets.</td></tr><tr><td>Lost head nail</td><td>Small head punched below the surface, hole filled – floorboards, joinery.</td></tr><tr><td>Clout nail</td><td>Large flat head, often galvanised – roofing felt, plasterboard.</td></tr><tr><td>Masonry nail</td><td>Hardened steel – fixing into brick or concrete.</td></tr><tr><td>Tacks</td><td>Short, sharp, large head – upholstery and carpets.</td></tr></table></div>
<p class="small">Nails are specified by type, length (mm) and material/finish and sold by weight. Dovetail nailing (driving nails at opposing angles) gives a stronger joint. Use a nail punch to sink heads below the surface.</p>
<h2 id="hinge" class="sec">Hinges &amp; catches</h2>
${workshopHTML('cw','3D hinges, catches & KD fittings','open, close & turn them')}
<div class="grid g4" id="hgGrid"></div>`,
init(){initFastener();initSpotScrew();
  const CI={butt:'Recessed into both the door and the frame so it closes neatly. Steel or brass. Screws are countersunk into the leaves.',piano:'Runs the full length of the joint – spreads the load. Piano lids, box lids, fold-down flaps.',tee:'Long strap spreads the load on ledged doors – gates and sheds. Usually black japanned steel.',flush:'One leaf folds inside the other, so no recess needs cutting. Quick to fit on light cabinet doors.',conc:'Hidden when the door is closed and adjustable. Cup fits a 35 mm Forstner-drilled hole. Kitchen units.',bolt:'Sliding bolt locks a door or gate into a keeper on the frame.',hasp:'Hasp swings over the staple; a padlock goes through the staple. Sheds, boxes.',toggle:'Over-centre lever pulls the lid down tightly – tool boxes, cases.',mag:'A magnet in the catch holds a steel plate on the back of the door.',wingnut:'Wing nut is tightened by hand – for parts that are adjusted or removed often. Washer spreads the load.',cam:'KD fitting: turning the cam grips the head of the steel dowel and pulls the panels tightly together. Flat-pack furniture.'};
  const CT={butt:['Mark round the leaf with a knife.','Chop a recess (housing) the depth of the leaf in door and frame.','Drill pilot holes and fit countersunk screws.'],piano:['Cut to length with a hacksaw.','Hold in place and mark every hole.','Drill pilots and screw – no recess needed.'],tee:['Fix the short leaf to the post.','Fix the long strap across the ledges of the door.','Use coach screws or bolts on heavy gates.'],flush:['Screw the outer leaf to the frame.','Screw the inner leaf to the door edge.','No recess needed – quick to fit.'],conc:['Drill a 35 mm hole with a Forstner bit in the door.','Screw the cup in and the plate on the cabinet side.','Clip together and adjust with the screws.'],bolt:['Screw the barrel to the door.','Line up and screw the keeper to the frame.','Slide to check it runs freely.'],hasp:['Screw the hasp to the door so the screws are hidden when closed.','Fit the staple on the frame through the slot.','Use coach bolts on sheds for security.'],toggle:['Fit the catch body on the box.','Fit the strike plate on the lid so the loop just reaches.','Flip the lever over-centre to clamp.'],mag:['Screw the catch inside the cabinet.','Close the door onto it to mark the plate position.','Screw the steel plate to the door.'],wingnut:['Drill a clearance hole through both parts.','Push the bolt through and add a washer.','Tighten the wing nut by hand.'],cam:['Screw the steel dowel into one panel.','Drill the cam hole (Forstner) in the other panel.','Push panels together and turn the cam a half turn to lock.']};
  const CTIP={butt:'Butt hinges are recessed – say so in "how to fit" answers.',cam:'KD fittings: quick assembly, flat-pack transport, can be taken apart – but less strong than glued joints.',wingnut:'Wing nut = frequent adjustment by hand.',conc:'Concealed hinges are adjustable and hidden – kitchen units.'};
  mountWorkshop('cw',C3D,Object.keys(C3D).map(k=>({id:k,name:C3D[k].name})),'butt',id=>({name:C3D[id].name,cat:id==='cam'||id==='wingnut'?'Fixings & KD':'Hinges & catches',html:`<p style="margin-top:0">${CI[id]||''}</p>`,how:CT[id],safety:'Use the correct size screwdriver and drill pilot holes so screws don\'t split the wood.',tip:CTIP[id]||'Name the hinge type AND what it is fixed with (e.g. countersunk steel screws).'}));
  const H=[['Butt hinge','Recessed into both door and frame; doors and quality cabinets. Steel or brass.','butt'],['Flush hinge','No recess needed – one leaf folds inside the other. Light cabinet doors.','flush'],['Back flap hinge','Wide leaves for a strong fixing – table flaps, bureaus.','back'],['Tee hinge','Long strap – gates and shed doors.','tee'],['Piano (continuous) hinge','Full-length – piano lids, box lids, fold-down flaps.','piano'],['Concealed (kitchen) hinge','Hidden when closed, adjustable; needs a 35 mm Forstner hole.','conc'],['Magnetic catch','Magnet holds a steel plate on the door.','mag'],['Ball catch','Spring-loaded ball clicks into a recess.','ball'],['Hasp & staple','Secures with a padlock – sheds, boxes.','hasp'],['Toggle catch','Over-centre lever clamps lids tightly – toolboxes, cases.','toggle'],['Barrel / tower bolt','Sliding bolt – locks doors and gates.','bolt']];
  hgGrid.innerHTML=H.map(([a,b,k])=>`<div class="card" style="padding:12px"><svg viewBox="0 0 120 70" style="width:100%;height:70px">${hingeSVG(k)}</svg><b>${a}</b><p class="small muted" style="margin:3px 0 0">${b}</p></div>`).join('');}};
function hingeSVG(k){const M='#c8d0da',K='#2b3644',B='#d4b047';const scr=(x,y)=>`<circle cx="${x}" cy="${y}" r="3.2" fill="#fff" stroke="${K}"/><line x1="${x-2}" y1="${y}" x2="${x+2}" y2="${y}" stroke="${K}"/>`;
 switch(k){

 case'flush':return `<rect x="30" y="12" width="30" height="46" fill="${M}" stroke="${K}"/><rect x="60" y="12" width="20" height="46" fill="#aeb8c4" stroke="${K}"/><rect x="56" y="10" width="8" height="50" rx="3" fill="${M}" stroke="${K}"/>${scr(42,22)+scr(42,46)+scr(70,34)}`;
 case'back':return `<rect x="10" y="20" width="48" height="30" fill="${B}" stroke="${K}"/><rect x="62" y="20" width="48" height="30" fill="${B}" stroke="${K}"/><rect x="56" y="18" width="8" height="34" rx="3" fill="#b8962f" stroke="${K}"/>${scr(24,35)+scr(44,35)+scr(78,35)+scr(98,35)}`;
 case'tee':return `<rect x="12" y="14" width="22" height="42" fill="#3b4048" stroke="${K}"/><path d="M38 28 L110 32 L110 38 L38 42 Z" fill="#3b4048" stroke="${K}"/><rect x="33" y="12" width="7" height="46" rx="3" fill="#555" stroke="${K}"/>`;
 case'piano':return `<rect x="6" y="22" width="108" height="12" fill="${M}" stroke="${K}"/><rect x="6" y="36" width="108" height="12" fill="${M}" stroke="${K}"/><rect x="6" y="33" width="108" height="5" fill="#aeb8c4" stroke="${K}"/>${[18,46,74,102].map(x=>scr(x,28)+scr(x,42)).join('')}`;
 case'conc':return `<circle cx="34" cy="35" r="18" fill="${M}" stroke="${K}"/><rect x="48" y="27" width="56" height="16" rx="4" fill="${M}" stroke="${K}"/><rect x="84" y="20" width="20" height="30" fill="#aeb8c4" stroke="${K}"/>${scr(94,27)+scr(94,43)}`;
 case'mag':return `<rect x="20" y="22" width="50" height="26" rx="4" fill="#f3f3f3" stroke="${K}"/><rect x="62" y="26" width="8" height="18" fill="#555"/><rect x="80" y="22" width="20" height="26" fill="${M}" stroke="${K}"/>${scr(32,35)+scr(90,35)}`;
 case'ball':return `<rect x="20" y="28" width="60" height="14" rx="7" fill="${B}" stroke="${K}"/><circle cx="82" cy="35" r="7" fill="${M}" stroke="${K}"/><rect x="92" y="20" width="16" height="30" fill="${B}" stroke="${K}"/>`;
 case'hasp':return `<rect x="10" y="20" width="56" height="20" rx="4" fill="${M}" stroke="${K}"/><rect x="58" y="16" width="14" height="28" rx="3" fill="${M}" stroke="${K}"/><path d="M80 28 Q80 18 92 18 Q104 18 104 28" stroke="${K}" stroke-width="4" fill="none"/><rect x="78" y="28" width="30" height="24" rx="3" fill="${B}" stroke="${K}"/>`;
 case'toggle':return `<rect x="14" y="30" width="30" height="20" fill="${M}" stroke="${K}"/><path d="M30 34 L76 22" stroke="${K}" stroke-width="5"/><path d="M76 22 Q96 30 96 40" stroke="${K}" stroke-width="2" fill="none"/><rect x="88" y="40" width="20" height="14" fill="${M}" stroke="${K}"/>`;
 default:return `<rect x="16" y="24" width="60" height="22" rx="3" fill="${M}" stroke="${K}"/><rect x="10" y="31" width="90" height="8" rx="4" fill="#aeb8c4" stroke="${K}"/><rect x="40" y="16" width="6" height="16" fill="${K}"/><rect x="94" y="22" width="16" height="26" fill="${M}" stroke="${K}"/>`;}}

PAGES.finishes = {t:'Finishes',html:()=>`

<div class="card">${lab('Finish finder','choose a material and situation')}

init(){
  const R={hardwood:{int:['Danish/teak oil or wax over sanding sealer','Enhances the natural grain; polyurethane varnish if it needs to be hard-wearing.'],ext:['Teak oil or exterior (yacht) varnish','Water resistant and UV resistant; re-oil every year. Teak/oak are naturally durable.'],food:['Food-safe vegetable/olive oil','Non-toxic and easy to re-apply after washing.'],toy:['Non-toxic water-based paint or food-safe oil','Must meet toy safety standards – no lead or toxic solvents.'],heat:['Polyurethane varnish (several thin coats)','Hard, waterproof and resists heat and spills.']},
  softwood:{int:['Wood stain + polyurethane varnish, or paint','Varnish protects; paint hides knots (use knotting solution first).'],ext:['Preservative (tanalised) + exterior paint or stain','Protects from rot, fungus and insects.'],food:['Food-safe oil','Non-toxic.'],toy:['Non-toxic water-based paint','Bright colours and safe.'],heat:['Polyurethane varnish','Hard-wearing and heat resistant.']},
  mdf:{int:['Sanding sealer/primer then paint (or veneer)','MDF has no grain so paints to a smooth finish; seal edges first because they absorb paint.'],ext:['Use moisture-resistant MDF or exterior plywood, then exterior paint','Standard MDF swells and breaks down outdoors.'],food:['Not recommended – use solid hardwood','Resin binders and absorbent surface.'],toy:['Sealer + non-toxic paint','Smooth, safe painted finish.'],heat:['Melamine (MF) laminate surface','Heat and scratch resistant – like kitchen worktops.']},
  steel:{int:['Paint (primer + top coat) or plastic dip coat','Stops rust; dip coating also gives a soft grip.'],ext:['Galvanising, powder coating or Hammerite','Long-lasting corrosion protection outdoors.'],food:['Use stainless steel instead (self-finishing)','No coating to chip or wear off.'],toy:['Plastic dip coating or powder coat','Smooth, colourful, no sharp edges.'],heat:['Heat-resistant paint or stainless steel','Ordinary paint and plastic coatings burn.']},
  alu:{int:['Polish and lacquer, or anodise','Anodising thickens the oxide layer and can be dyed.'],ext:['Anodising or powder coating','Aluminium resists corrosion but anodising adds hardness and colour.'],food:['Anodised aluminium','Hard, inert surface (drinks bottles).'],toy:['Anodise (dyed colours)','Durable and colourful.'],heat:['Anodising','Coloured oxide layer withstands heat.']},
  copper:{int:['Polish (e.g. Brasso) then clear lacquer','Lacquer stops tarnishing.'],ext:['Leave to form a green patina, or lacquer','Copper is naturally corrosion resistant.'],food:['Tin or stainless lining for cookware','Copper reacts with acidic food.'],toy:['Lacquer','Seals the surface.'],heat:['Polish only (lacquer can discolour)','Copper conducts heat well.']},
  acrylic:{int:['Self-finishing – just polish the edges','File → wet & dry → polish (buffing machine).'],ext:['Self-finishing; use UV-stable grades','Weather resistant.'],food:['Use food-safe plastics (PP, HDPE)','Acrylic scratches and can crack.'],toy:['Self-finishing; round and polish all edges','No coating needed – colour is all the way through.'],heat:['Use a thermoset (MF) or glass instead','Thermoplastics soften when heated.']}};
  const upd=()=>{const r=R[ffM.value][ffU.value];ffOut.innerHTML=`<p><b>${r[0]}</b></p><p>${r[1]}</p>`;};ffM.onchange=ffU.onchange=upd;upd();
  const show=k=>{const F=FINISHES[k];fnBody.innerHTML=`<h2>Preparation – ${k}</h2><div class="card"><ol class="small">${F.prep.map(p=>`<li>${p}</li>`).join('')}</ol></div><h2>Finishes</h2><div class="grid g2">${F.list.map(f=>`<div class="card"><h4>${f.n}</h4><p class="small">${f.d}</p><span class="pill ${f.int?'s':''}">${f.int?'✓':'✗'} Interior</span><span class="pill ${f.ext?'s':''}">${f.ext?'✓':'✗'} Exterior</span></div>`).join('')}</div>`;};
  fnSeg.onclick=e=>{const b=e.target.closest('button');if(!b)return;fnSeg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));show(b.dataset.k);};show('wood');}};

['Brass vs bronze','Brass band ZINGs, Bronze age TINs','Brass = copper + <b>zinc</b> · Bronze = copper + <b>tin</b>','Both are alloys – an easy 1 mark.'],
['Hardwood vs softwood','Hands vs Needles','<b>Hard</b> = broad leaves like hands, drop in autumn · <b>Soft</b> = needles & cones, evergreen','TRAP: balsa is a HARDWOOD. It\'s about the tree, not hardness.'],
['Percentiles','Reach LOW, Clear HIGH','Reach (shelf, controls) → <b>5th</b> · Clearance (doors, seats) → <b>95th</b>','Design for 5th–95th = 90% of people.'],

['Taps & dies','Tap INto a hole, Die on the OUTside','Tap = internal thread · Die = external thread · order: Taper → Second → Plug ("TSP")','Always drill the TAPPING size first (M6 → 5 mm).'],
['Saw teeth','Hacksaw Pushes, Coping Pulls','Hacksaw teeth point FORWARD · Coping saw teeth point BACK to the handle','Coping = curves (wood/plastic). Hacksaw = straight (metal).'],
['The 6 Rs','Really Rich Robots Rarely Refuse Repairs','<b>R</b>educe · <b>R</b>euse · <b>R</b>ecycle · <b>R</b>ethink · <b>R</b>efuse · <b>R</b>epair','Any sustainability question: name an R + explain how.'],
['Heat treatment','Anneal = Ahh, relax','Anneal → soften · Harden → heat + quench · Temper → take out brittleness · Case harden → mild steel skin','Harden THEN temper – never the other way round.'],
['Finish matches','A for A, G for Zinc','<b>A</b>luminium → <b>A</b>nodise · <b>G</b>alvanise = zinc coat · Plastic dip coat = heat, dip, cure','Plastics are self-finishing.'],
['Glue matches','Wood-PVA, Acrylic-Tensol, Anything-Epoxy','PVA (wood) · Tensol (acrylic) · Epoxy/Araldite (mixed) · Contact (laminates, both sides)','Name the glue, not just "glue".'],
['Describe-how answers','My Hamster Can Speak Japanese Fairly Slowly','<b>M</b>ark · <b>H</b>old · <b>C</b>ut · <b>S</b>hape · <b>J</b>oin · <b>F</b>inish · <b>S</b>afety','Name a SPECIFIC tool at every step.'],
['Seasoning','Air = Annual, Kiln = Quick','Air: ~1 year per 25 mm, MC 15–20% · Kiln: days, MC 6–12%','Kiln-dried for indoor (heated) furniture.'],
['Scale of production','More made → cheaper each','One-off (bespoke, skilled) → Batch (jigs & templates) → Mass (production line, robots)','Batch = jigs, templates, moulds.']];
const QWIN=[
['Outdoor furniture?','Teak – natural oils resist rot & water (or cedar for softwood).'],
['Child\'s toy?','Beech – close grain, no splinters; non-toxic paint or food-safe oil.'],
['Product casing (hairdryer, phone)?','ABS – tough, glossy, injection moulded.'],
['Saucepan / kettle handle?','PF (Bakelite) – thermoset: won\'t soften, insulates heat.'],
['Plug or socket?','UF – thermoset, electrical insulator.'],
['Drinks bottle?','PET (fizzy) / HDPE (milk) – blow moulded.'],
['Vacuum-formed tray?','HIPS sheet – cheap, forms easily.'],
['Gears or bearings?','Nylon – self-lubricating, hard-wearing.'],
['Flip-top cap / living hinge?','Polypropylene – fatigue resistant.'],
['Flat-pack furniture?','MDF / chipboard + KD fittings (cam locks).'],
['Painted, smooth panel?','MDF – no grain, takes paint well.'],
['Drill bits & lathe tools?','HSS – stays hard when hot.'],
['Hammer / axe handle?','Ash – tough, absorbs shock.'],
['Lightweight + strong metal?','Aluminium alloy (duralumin).'],
['Steel used outdoors?','Galvanise, paint (primer + top coat) or plastic dip coat.'],
['Join acrylic?','Tensol cement. Wood → PVA. Metal to plastic → epoxy.'],
['100 identical holes?','Drilling jig – accurate & repeatable.'],
['Hollow product?','Blow moulding.'],
['Long constant profile (pipe, window frame)?','Extrusion.'],
['Complex plastic part, thousands needed?','Injection moulding – cheap per item, expensive mould.'],
['Bend acrylic?','Strip heater + bending jig.'],
['Curved cut in plywood?','Coping saw / scroll saw – or laser cutter.'],
['Mark a line on metal?','Scriber + engineer\'s square on marking blue.'],
['Hold small work on the drill?','Machine vice (never your hand).']];

['Balsa is a softwood.',false,'Hardwood – broad-leaved tree.'],['Mild steel can be hardened & tempered.',false,'Too little carbon – case harden it.'],['Thermoplastics can be reheated and reshaped.',true,'That\'s why they recycle.'],['Brass is copper + tin.',false,'Copper + zinc. Bronze has tin.'],['A hacksaw blade is fitted with teeth pointing forward.',true,'Cuts on the push stroke.'],['Anodising works on steel.',false,'Aluminium only.'],['Plywood has an odd number of layers.',true,'Grain alternates at 90°.'],['PVC is safe to laser cut.',false,'Gives off toxic chlorine gas.'],['Third angle: plan above the front view.',true,'See it there, draw it there.'],['A tap cuts an external thread.',false,'Tap = internal; die = external.'],['Annealing makes metal harder.',false,'It softens it.'],['Door height uses the 95th percentile.',true,'Clearance → 95th.'],['Chipboard holds ordinary screws well.',false,'Use KD fittings / chipboard screws.'],['Injection moulding has low unit cost.',true,'But very high mould cost.'],['HIPS is ideal for vacuum forming.',true,'Cheap and forms easily.'],['A centre punch is used to find the centre of a bar.',false,'That\'s a centre square – the punch marks for drilling.'],['Galvanising coats steel with zinc.',true,'Sacrificial protection.'],['Epoxy resin is a thermoplastic.',false,'Thermoset.'],['Kiln seasoning is faster than air seasoning.',true,'Days not years.'],['Oak is fine with steel screws.',false,'Tannic acid – use brass/stainless.'],['MDF can be painted to a smooth finish.',true,'No grain.'],['Natural gas is a renewable energy source.',false,'Finite fossil fuel.'],['A dovetail joint can be pulled apart in any direction.',false,'Only one direction.'],['Nylon is self-lubricating.',true,'Great for gears.']];

PAGES.success={t:'Exam Success Kit',html:()=>`
${head('Start · Exam success','⭐ Exam Success Kit','Everything that turns knowledge into marks – game plans, memory hacks, instant answers and a speed round. Short words, big marks.')}
${toc([['plan','Game plans'],['mnemo','Memory hacks'],['qwin','Instant answers'],['magnet','Mark magnets'],['killers','Mark killers'],['speed','Speed round'],['count','Countdown']])}
<h2 id="plan" class="sec">🎯 Game plans</h2>
<div class="grid g2">
<div class="card"><h3 style="margin-top:0">Paper 1 · Product Design</h3><p class="small muted" style="margin-top:0">75 min · 50 marks · answer ONE of three · ≈ 1.5 min per mark</p>
<div class="tl">${[['5','Read all 3. Pick the one you can SKETCH best.','#e8eefc'],['8','Spec points: number + reason.','#e3f6f2'],['25','3 DIFFERENT ideas, annotated.','#fff4df'],['7','Evaluate vs spec. Choose one.','#efe9fd'],['22','Develop: materials, joints, sizes, finish, how it\'s made.','#e5f5eb'],['8','Check labels, dimensions, units.','#fdeaea']].map(([m,t,c])=>`<div class="tlrow" style="--w:${m/75*100}%"><span class="tlbar" style="background:${c}"></span><b>${m}′</b><span>${t}</span></div>`).join('')}</div></div>
<div class="card"><h3 style="margin-top:0">Paper 3 · Resistant Materials</h3><p class="small muted" style="margin-top:0">60 min · 50 marks · ≈ 1 mark per minute + 10 spare</p>
<div class="tl">${[['25','Section A: 10 short Qs. Fast facts. Don\'t over-write.','#e8eefc'],['3','Read ALL three Section B questions.','#fff4df'],['27','Section B: one question – sketches + notes, name tools & processes.','#e3f6f2'],['5','Check: specific names? units? every part answered?','#fdeaea']].map(([m,t,c])=>`<div class="tlrow" style="--w:${m/60*100}%"><span class="tlbar" style="background:${c}"></span><b>${m}′</b><span>${t}</span></div>`).join('')}</div>
<div class="tip"><p>Pick Section B by the <b>high-mark parts</b> (making processes, sketches), not by part (a).</p></div></div></div>
<h2 id="mnemo" class="sec">🧠 Memory hacks</h2><p class="small muted">Tap a card to reveal it. Say it out loud – silly sticks.</p>
<div class="grid g3" id="mnGrid"></div>
<h2 id="qwin" class="sec">⚡ If they ask… you write…</h2><p class="small muted">The most-repeated exam questions, answered in one line. Tap to flip.</p>
<div class="chips" style="margin:6px 0 10px"><button class="chip on" id="qwAll">Show all</button><button class="chip" id="qwHide">Hide answers (test me)</button></div>
<div class="grid g3" id="qwGrid"></div>
<h2 id="magnet" class="sec">🧲 Mark magnets</h2>
<div class="grid g2">
<div class="card"><h4 style="margin-top:0">P · B · R – the explain formula</h4><p class="small"><b>Point</b> → <b>Because</b> → <b>Result</b></p><div class="eg" style="margin:6px 0"><p>Beech <b>is close-grained</b>, <b>so</b> it sands very smooth, <b>which means</b> no splinters for a young child.</p></div><p class="small muted">One chain = up to 2–3 marks. "It's strong" = 0.</p></div>
<div class="card"><h4 style="margin-top:0">Sketch rules (Papers 1 & 3)</h4><ul class="small"><li><b>Big</b> – fill the space.</li><li><b>3D</b> (isometric/2-pt) for ideas; <b>2D</b> section for joints.</li><li><b>Label + arrow</b> every part.</li><li>Add <b>sizes</b> in mm & <b>materials</b>.</li><li>Show <b>tools</b> in "how to make" answers.</li></ul></div>
<div class="card"><h4 style="margin-top:0">Words that score</h4><div class="chips">${['tough','rigid','corrosion resistant','close grain','lightweight','self-finishing','ergonomic','5th/95th percentile','draft angle','datum','jig','tolerance','self-lubricating','thermoset','FSC timber','recyclable'].map(w=>`<span class="pill s">${w}</span>`).join('')}</div><p class="small muted">Always attach a reason.</p></div>
<div class="card"><h4 style="margin-top:0">Paper 1 idea booster</h4><p class="small">Make your 3 ideas truly different – change at least one of:</p><div class="grid g3" style="gap:6px">${[['FORM','box / cylinder / organic'],['MOVEMENT','hinge / slide / rotate'],['MATERIAL','wood / acrylic / metal']].map(([a,b])=>`<div class="mini"><b>${a}</b><span>${b}</span></div>`).join('')}</div><p class="small muted">Then annotate: how it works · material + why · how it's made.</p></div></div>
<h2 id="killers" class="sec">🚫 Mark killers</h2>
<div class="grid g4">${[['"Plastic"','Say acrylic, HIPS, ABS…'],['"Wood"','Say pine, beech, MDF…'],['"Saw" / "glue"','Tenon saw, PVA…'],['"Strong / cheap"','…because… so…'],['"Be careful"','Name hazard + control'],['Same point twice','Each mark = new idea'],['Tiny sketches','Big, labelled, 3D'],['Blank answers','Guess smart – 0 is certain'],['Ignoring the context','Use the product in the Q'],['No units','mm, °C, %']].map(([a,b])=>`<div class="kill"><b>${a}</b><span>${b}</span></div>`).join('')}</div>
<h2 id="speed" class="sec">🏁 Speed round</h2>
<div class="card" id="spBox"></div>
<h2 id="count" class="sec">📅 Countdown</h2>
<div class="grid g4">${[['4 weeks','One topic a day on this site → tick the syllabus checklist.'],['2 weeks','One past paper every 2 days, timed. Mark with the mark scheme.'],['1 week','Read examiner reports. Redo mistakes. Flashcards daily.'],['Night before','Memory hacks + instant answers. Pack kit. SLEEP.']].map(([a,b],i)=>`<div class="card cd" style="padding:14px"><div class="cdn">${i+1}</div><b>${a}</b><p class="small" style="margin:4px 0 0">${b}</p></div>`).join('')}</div>
<div class="note"><p><b>Pack:</b> 2 pencils (HB + 2H), black fine-liner, eraser, ruler, compass, colour pencils, calculator, spare pens. Check the Cambridge FAQ for any extras.</p></div>`,
init(){
 mnGrid.innerHTML=MNEMO.map((m,i)=>`<div class="mnc" data-i="${i}"><div class="mnt">${m[0]}</div><div class="mnh">“${m[1]}”</div><div class="mnb">${m[2]}<p>${m[3]}</p></div><div class="mntap">tap to reveal ↓</div></div>`).join('');
 mnGrid.onclick=e=>{const c=e.target.closest('.mnc');if(c)c.classList.toggle('open');};
 let hide=false;const dq=()=>{qwGrid.innerHTML=QWIN.map(([q,a])=>`<div class="qw ${hide?'':'open'}"><b>${q}</b><span>${a}</span></div>`).join('');};
 qwGrid.onclick=e=>{const c=e.target.closest('.qw');if(c)c.classList.toggle('open');};qwAll.onclick=()=>{hide=false;qwAll.classList.add('on');qwHide.classList.remove('on');dq();};qwHide.onclick=()=>{hide=true;qwHide.classList.add('on');qwAll.classList.remove('on');dq();};dq();
 // speed round
 let T=null,left=60,score=0,n=0,cur=null,deck=[];const best=()=>LS.get('speedbest',0);
 const intro=()=>{spBox.innerHTML=`<div class="center"><div style="font-size:2.4rem">⏱️</div><h3 style="margin:4px 0">True or false? 60 seconds.</h3><p class="small muted">Instant feedback. Best score: <b>${best()}</b></p><button class="btn" id="spGo">Start</button></div>`;spGo.onclick=start;};
 const next=()=>{if(!deck.length)deck=shuffle(TF);cur=deck.pop();spQ.textContent=cur[0];spFb.textContent='';};
 const start=()=>{left=60;score=0;n=0;deck=shuffle(TF);spBox.innerHTML=`<div class="flex" style="justify-content:space-between;align-items:center"><span class="pill" id="spT">60s</span><span class="pill s" id="spS">0 ✓</span></div><div class="bar" style="margin:10px 0"><i id="spBar" style="width:100%"></i></div><h3 id="spQ" class="center" style="min-height:56px;margin:14px 0"></h3><div class="grid g2"><button class="btn ok" data-a="1" style="padding:14px;font-size:1.05rem">✓ True</button><button class="btn bad" data-a="0" style="padding:14px;font-size:1.05rem">✗ False</button></div><p id="spFb" class="center small" style="min-height:22px"></p>`;
  next();spBox.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(!cur)return;const ok=(b.dataset.a==='1')===cur[1];n++;if(ok)score++;spS.textContent=score+' ✓';spFb.innerHTML=`<span class="res ${ok?'ok':'no'}">${ok?'✓':'✗'}</span> ${cur[2]}`;cur=null;setTimeout(()=>{if(left>0&&document.getElementById('spQ'))next();},650);});
  clearInterval(T);T=setInterval(()=>{left--;if(!document.getElementById('spT')){clearInterval(T);return;}spT.textContent=left+'s';spBar.style.width=(left/60*100)+'%';if(left<=0){clearInterval(T);Game.event('speed',{score});const b=best();if(score>b)LS.set('speedbest',score);spBox.innerHTML=`<div class="center"><div style="font-size:2.4rem">${score>=15?'🏆':score>=10?'🔥':'💪'}</div><h3 style="margin:4px 0">${score} correct out of ${n}</h3><p class="small muted">${score>b?'New best!':'Best: '+b}</p><button class="btn" id="spGo">Go again</button></div>`;spGo.onclick=start;}},1000);};
 CLEANUP.push(()=>clearInterval(T));intro();}};

const HACKS={materials:[1,2,4,5,6,16],heat:[3,12,4],tools:[9,10,15],processes:[17,15],joining:[14,15],finishes:[13,14],design:[0,7,11,17],drawing:[8],components:[9],cadcam:[17],safety:[15]};
function hackStrip(pg){const h=HACKS[pg];if(!h)return'';return `<div class="hackstrip"><span class="hk">🧠 Remember</span>${h.map(i=>`<button class="hkb" data-i="${i}"><b>“${MNEMO[i][1]}”</b><small>${MNEMO[i][0]}</small></button>`).join('')}<a href="#success" class="hkmore">All memory hacks →</a></div>`;}
document.addEventListener('click',e=>{const b=e.target.closest('.hkb');if(!b)return;const m=MNEMO[+b.dataset.i];openModal(`<div class="v3kicker">${m[0]}</div><h2 style="margin:4px 0 10px">“${m[1]}”</h2><p>${m[2]}</p><div class="tip"><p>${m[3]}</p></div><a class="btn sm" href="#success" onclick="closeModal()">Open the Exam Success Kit</a>`);});

{p:'Paper 3 · Section A',t:'Materials',m:3,q:'Explain why plywood is more stable than a solid timber board of the same size.',s:['Made from an odd number of veneers / plies','Grain of each layer is at 90° to the next','So shrinkage and movement in one layer is resisted by the next – it does not warp or split'],tip:'"Explain" needs a because-chain.'},
{p:'Paper 3 · Section A',t:'Materials',m:2,q:'State two reasons why ABS is used for the casing of a hairdryer.',s:['Tough / high impact strength – survives being dropped','Electrical / heat insulator, lightweight, self-coloured, easily injection moulded (any one more)'],tip:'Two DIFFERENT reasons.'},
{p:'Paper 3 · Section A',t:'Materials',m:2,q:'Describe the difference between a ferrous and a non-ferrous metal and give one example of each.',s:['Ferrous contains iron (usually magnetic / rusts) – e.g. mild steel','Non-ferrous contains no iron – e.g. aluminium, copper, brass'],tip:''},
{p:'Paper 3 · Section A',t:'Tools',m:3,q:'Name three marking-out tools used to mark the position of a hole to be drilled in a piece of mild steel.',s:['Steel rule','Scriber (with engineer\'s square / odd-leg calipers)','Centre punch (and hammer)'],tip:'Metal = scriber, not pencil.'},

{p:'Paper 3 · Section A',t:'Components',m:2,q:'A screw is described as "40 × No. 8 countersunk steel". Explain what "40" and "No. 8" mean.',s:['40 = length in mm','No. 8 = gauge / diameter of the shank'],tip:''},

{p:'Paper 3 · Section B',t:'Processes',m:5,q:'Describe how a mortise would be cut in the leg of a table.',s:['Mark out with a mortise gauge, try square and pencil / marking knife','Hold the leg securely in a vice or clamped to the bench','Chop with a mortise chisel and mallet, starting in the centre and working to the lines (or drill out the waste first)','Lever out the waste; cut half-way from each side for a through mortise','Pare the sides square and check the fit of the tenon'],tip:'Name the specific gauge, chisel and holding method.'},

PAGES.written={t:'Written exam questions',html:()=>`
${head('Practise · Exam-style','Written exam questions','Original exam-style questions with mark schemes. Write (or say) your answer first, reveal the scheme, then tick the marks you earned.')}
<div class="chips" id="wqFilter"></div>
<div class="card"><div class="flex" style="justify-content:space-between;align-items:center"><b>Marks earned</b><span class="pill s" id="wqScore">0</span></div><div class="bar" style="margin-top:8px"><i id="wqBar"></i></div></div>
<div id="wqList"></div>
<div class="note"><p>These are written in the style of Cambridge questions for practice. For real papers and official mark schemes use the <a href="#exam">past paper finder</a>.</p></div>`,
init(){const papers=['All',...new Set(WRITTEN.map(w=>w.p))];let cur='All';const done=LS.get('wq',{});

 annHTML(max){const a=(Auth.S.announcements||[]).slice(0,max||9);return a.map(x=>`<div class="ann ${x.pinned?'pin':''}"><div class="crumb" style="margin:0">${x.pinned?'📌 Pinned · ':''}${new Date(x.created).toLocaleDateString()}</div><b>${esc(x.title)}</b><p>${esc(x.body)}</p></div>`).join('');},
 afterRoute(pg){if(pg!=='home')return;const hero=document.querySelector('#main .hero2')||document.querySelector('#main .hero');if(!hero)return;let box=document.getElementById('homeX');if(!box){box=document.createElement('div');box.id='homeX';hero.after(box);}
  const u=Auth.S.user,S=Auth.S,nx=Path.next(),pd=Path.count();box.innerHTML=`<div class="contcard"><div><p class="eyebrow">Learning path · ${pd} of ${LESSONS.length} done</p><b>${nx?`${pd?'Next up':'Start here'}: ${nx.id} ${esc(nx.t)}`:'Every lesson done'}</b><small>${nx?esc(nx.goal)+' · '+nx.min+' min':'Time for past papers.'}</small></div><i class="cbar"><b style="width:${pd/LESSONS.length*100}%"></b></i>${nx?`<button class="btn sm" onclick="Path.open('${nx.id}')">${pd?'Continue':'Start'}</button>`:'<a class="btn sm" href="#exam">Past papers</a>'}</div>${S.settings.multiplier>1?`<div class="banner evb"><b>${S.settings.multiplier}× coins</b> event on${S.settings.multiplierEnds?' until '+new Date(S.settings.multiplierEnds).toLocaleString([],{weekday:'short',hour:'2-digit',minute:'2-digit'}):''}. Everything you earn counts double or more.</div>`:''}${S.settings.banner?`<div class="banner">${esc(S.settings.banner)}</div>`:''}${u?`<div class="grid g2" style="margin-top:14px"><div class="card"><div class="flex" style="justify-content:space-between;align-items:center"><h3 style="margin:0">This week's goals</h3><a href="#profile" class="small">My Space →</a></div>${this.goalsHTML()}</div><div class="card"><div class="flex" style="justify-content:space-between;align-items:center"><h3 style="margin:0">Announcements</h3><span class="pill">🔥 ${u.streak}-day streak</span></div>${this.annHTML(2)||'<p class="muted small">Nothing new.</p>'}<div class="flex" style="margin-top:8px"><a class="btn sm" href="#challenge">❄️ ${esc(S.settings.challengeTitle||'Challenge')}</a><a class="btn ghost sm" href="#leaderboard">🏆 Leaderboard</a></div></div></div>`
   :`<div class="card joinc" style="margin-top:14px"><div><div class="crumb" style="margin:0">Coins · Shop · Leaderboard</div><h3 style="margin:4px 0">Sign in to earn coins while you revise</h3><p class="small muted" style="margin:0">Every quiz, syllabus tick and challenge earns coins for avatars, frames, titles and themes.</p></div><button class="btn" onclick="Auth.gate(true)">Sign in</button></div>`}`;},
 /* profile pop-up with compare */
 profile(uid){const me=Auth.S.user;let p=null;
   if(me&&uid===me.uid)p=Friends.cardOf(me);else p=Friends.list().find(f=>f.uid===uid)||((Auth.S.settings.board||[]).find(b=>b.uid===uid));
   if(!p){toast('No card for that player');return;}
   const wk=x=>x.wk===weekStamp()?x.weekXp:0;const mine=me?Friends.cardOf(me):null,other=!mine||mine.uid!==p.uid;
   const pick=x=>({xp:x.xp,weekXp:wk(x),streak:x.streak,q:(x.stats||{}).quizzes,pf:(x.stats||{}).perfect,sy:(x.stats||{}).syllabus,sp:(x.stats||{}).speedBest,ch:x.chal?x.chal.score:null,own:x.own});
   const A=pick(p),B=mine?pick(mine):null;
   const rowsC=[['Total XP','xp'],['XP this week','weekXp'],['Day streak','streak'],['Quizzes done','q'],['Perfect 10/10s','pf'],['Syllabus ticks','sy'],['Speed-round best','sp'],['Challenge score','ch'],['Cosmetics owned','own']];
   const fr=Friends.list().some(f=>f.uid===p.uid);
   openModal(`<div class="pcard"><div>${this.avatar(p.eq,p.name,84)}</div><h2 style="margin:8px 0 2px">${esc(p.name)}</h2>${this.title(p.eq)}<p class="small muted" style="margin:6px 0 0">${other?`Card updated ${new Date(p.t).toLocaleDateString()}`:'This is how your card looks to friends'}</p></div>
    <div class="tw" style="margin-top:14px"><table class="t cmp" style="min-width:0"><tr><th></th><th>${esc(p.name.split(' ')[0])}</th>${other&&B?'<th>You</th>':''}</tr>${rowsC.map(([l,k])=>{const a=A[k],b=B?B[k]:null;const sh=v=>v==null?'–':fmt(v);return `<tr><td>${l}</td><td class="${other&&B&&(a||0)>(b||0)?'win':''}">${sh(a)}</td>${other&&B?`<td class="${(b||0)>(a||0)?'win':''}">${sh(b)}</td>`:''}</tr>`;}).join('')}</table></div>
    ${fr?`<button class="btn ghost sm" id="frDel" style="margin-top:12px">Remove from my leaderboard</button>`:''}`);
   const d=document.getElementById('frDel');if(d)d.onclick=()=>{Friends.remove(p.uid);closeModal();toast('Removed');if(CUR==='leaderboard')route();};}
};

 <p class="small muted">Scores come from each person's own device, so this board is for fun and bragging rights, not for marks.</p>${hallHTML()}`}`,

    +(who==='friends'&&r.length<2?'<p class="muted center small" style="padding:14px">Just you so far. Share your card with friends and add theirs below.</p>':'')
    :`<p class="muted center" style="padding:20px">${who==='class'?'Your teacher has not posted a class board yet.':'No challenge scores yet.'}</p>`;};

['A table needs 4 legs, each 720 mm long, cut from 45 × 45 PAR sold in 2.4 m lengths. Allowing 5 mm waste per saw cut, how many lengths must be bought for the legs?',['1','2','3','4'],1,'Three legs need 3 × 720 + cuts ≈ 2175 mm – that fits in 2400. The fourth does not (2900 mm total), so a second length is needed.'],

['Why does a plain-sawn (through-and-through) board tend to cup more than a quarter-sawn board?',['It contains more knots','Its growth rings run in long arcs across the board, and wood shrinks most along the rings','It is always cut from sapwood','It is thinner'],1,'Timber shrinks roughly twice as much along the growth rings (tangentially) as across them. Quarter-sawn boards have rings at ~90° to the face, so they stay flat.']

PAGES.challenge={t:'Winter Challenge',html:()=>`${head('Community · Challenge','❄️ '+esc(Auth.S.settings.challengeTitle||'Winter Pre-Mock Challenge'),'Hard, non-typical questions that make you APPLY what you know. Timed. Your first score is locked in for the challenge leaderboard.')}<div id="chBox"></div>`,
 init(){const box=chBox,u=Auth.S.user,done=u&&u.chal&&u.chal.main,SS=Auth.S.settings||{},closed=SS.challengeOn===false,MIN=SS.challengeMinutes||20;
  const BANK=CHALLENGE.concat((Auth.S.questions||[]).filter(q=>q.target==='challenge'&&q.o&&q.o.length>=2).map(q=>[q.q,q.o,Math.min(q.answer,q.o.length-1),q.explain||'Set by your teacher.']));
  let T=null,qs=[],i=0,ans=[],left=MIN*60,start=0;CLEANUP.push(()=>clearInterval(T));
  const intro=()=>{box.innerHTML=`<div class="card chintro"><div class="grid g3">${[['🧩',BANK.length+' questions','Design problems, faults to diagnose, and calculations'],['⏱️',MIN+' minutes','The timer keeps running – no feedback until the end'],['🏆',closed?'Practice only':done?'Practice mode':'First try counts',closed?'The challenge is closed – scores are not recorded':done?`Your locked score: ${done.score}/${done.total}`:'Coins and a place on the challenge board']].map(([a,b,c])=>`<div class="statc"><span>${a}</span><b>${b}</b><small>${c}</small></div>`).join('')}</div><div class="center" style="margin-top:16px"><button class="btn" id="chGo">${done||closed?'Practise':'Start the challenge'}</button>${u?'':'<p class="small muted" style="margin-top:8px">You are playing as a guest – sign in first if you want your score on the leaderboard.</p>'}</div></div>`;chGo.onclick=begin;};
  const begin=()=>{qs=shuffle(BANK).map(q=>{const o=shuffle(q[1].map((t,k)=>({t,ok:k===q[2]})));return{q:q[0],o,e:q[3]};});i=0;ans=[];left=MIN*60;start=Date.now();clearInterval(T);T=setInterval(()=>{left--;const el=document.getElementById('chT');if(el)el.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;if(left<=0)finish();},1000);show();};
  const show=()=>{const q=qs[i];box.innerHTML=`<div class="card"><div class="flex" style="justify-content:space-between;align-items:center"><span class="crumb" style="margin:0">Question ${i+1} of ${qs.length}</span><span class="pill" id="chT">${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</span></div><div class="bar" style="margin:8px 0 14px"><i style="width:${i/qs.length*100}%"></i></div><h3 style="margin-top:0">${esc(q.q)}</h3>${q.o.map((o,k)=>`<button class="qopt" data-k="${k}">${String.fromCharCode(65+k)}. ${esc(o.t)}</button>`).join('')}</div>`;box.querySelectorAll('.qopt').forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.k;i++;i<qs.length?show():finish();});};
  const finish=()=>{clearInterval(T);const score=qs.reduce((a,q,k)=>a+(ans[k]!==undefined&&q.o[ans[k]].ok?1:0),0),secs=Math.round((Date.now()-start)/1000);if(Auth.S.user&&!closed)Game.event('challenge',{score,total:qs.length,secs});
   box.innerHTML=`<div class="card center"><div style="font-size:2.6rem">${score>=13?'Outstanding':score>=9?'Solid':'Keep going'}</div><h2 style="margin:4px 0">${score} / ${qs.length}</h2><p class="muted">${score>=13?'Outstanding – that is A* thinking.':score>=9?'Strong. Read the explanations for the ones you missed.':'These are hard on purpose. Study the explanations, then practise again.'}</p><div class="flex" style="justify-content:center"><button class="btn" id="chAgain">Practise again</button><a class="btn ghost" href="#leaderboard">Leaderboard</a></div></div>${qs.map((q,k)=>{const right=ans[k]!==undefined&&q.o[ans[k]].ok;return `<div class="card"><span class="pill" style="background:${right?'#ecfdf5':'#fdeaea'};color:${right?'#047857':'#b91c1c'}">${right?'✓ Correct':'✗ '+(ans[k]===undefined?'Not answered':'Wrong')}</span><h4 style="margin:8px 0">${esc(q.q)}</h4><p class="small"><b>Answer:</b> ${esc(q.o.find(o=>o.ok).t)}</p><div class="key" style="margin-bottom:0"><p>${esc(q.e)}</p></div></div>`;}).join('')}`;chAgain.onclick=begin;window.scrollTo(0,0);};
  intro();}};

 ['Coin rules',{coinsPerCorrect:['Coins per correct quiz answer','num'],perfectBonus:['Bonus coins for 10/10','num'],dailyQuizCap:['Quizzes per day that earn coins','num'],syllabusCoin:['Coins per syllabus tick','num'],writtenCoin:['Coins per written mark','num'],streakCoin:['Coins per streak day (up to 7)','num'],challengeCoin:['Coins per challenge mark','num']}]];

const toCSV=rows=>rows.map(r=>r.map(v=>{v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\n');

 document.getElementById('exC').onclick=()=>copyText(text);document.getElementById('exX').onclick=closeModal;}

/* the draft lives on the admin's device until it is published */
const Draft={get(){let d=lget(LKEY.draft,null);if(d)return d;const pk=lget(LKEY.pack,null),db=localCore().raw();
  if(pk&&pk.data)d=JSON.parse(JSON.stringify(pk.data));else d={};
  const bool=v=>v===true||v==='true';
  d.announcements=d.announcements||[];d.goals=d.goals||[];d.questions=d.questions||[];d.board=d.board||[];d.hall=d.hall||[];d.resets=d.resets||[];d.gifts=d.gifts||[];d.admins=d.admins||lget(LKEY.trust,[]);
  d.shop=d.shop||(db.shop||[]).map(r=>({id:r.id,name:r.name,type:r.type,value:r.value,price:+r.price,active:bool(r.active),desc:r.desc}));
  if(!d.settings){d.settings={};(db.settings||[]).forEach(r=>{if(!/^(hall|maintenance|maintenanceMsg|signupOpen|bannedWords)$/.test(r.key))d.settings[r.key]=r.value;});}
  return d;},
 save(d){d.edited=Date.now();lset(LKEY.draft,d);},
 dirty(d){const pk=lget(LKEY.pack,null);return !pk||(d.edited||0)>pk.t;}};

   Questions(){const e=edit||{target:'quiz',active:true,answer:0},Q=D.questions,L=['A','B','C','D'];
    box.innerHTML=`<p class="small muted" style="margin-top:0">The site already has ${QUIZ.length}+ quiz questions and ${CHALLENGE.length} challenge questions. Yours are added on top.</p>
     <div class="card"><h3 style="margin-top:0">${e.id?'Edit':'New'} question</h3><div class="grid g2">${fld('Goes into',`<select id="qG" style="width:100%"><option value="quiz" ${e.target!=='challenge'?'selected':''}>Quiz</option><option value="challenge" ${e.target==='challenge'?'selected':''}>Challenge</option></select>`)}${fld('Topic',inp('qT',e.topic,"e.g. Teacher's picks"))}</div><label class="small" style="display:block;margin-top:8px"><b>Question</b></label><textarea id="qQ">${esc(e.q||'')}</textarea><div class="grid g2" style="margin-top:8px">${L.map(l=>fld('Option '+l+(l>'B'?' (optional)':''),inp('q'+l,e[l.toLowerCase()],''))).join('')}${fld('Correct answer',`<select id="qAns" style="width:100%">${L.map((l,i)=>`<option value="${i}" ${+e.answer===i?'selected':''}>${l}</option>`).join('')}</select>`)}${fld('Explanation',inp('qE',e.explain,'Why that answer is right'))}</div><div class="ctrl">${chk('qV',e.active!==false,'In use')}<button class="btn sm" id="qGo">${e.id?'Save':'Add question'}</button>${e.id?'<button class="btn ghost sm" id="qX">Cancel</button>':''}</div></div>
     <details class="card"><summary><b>Paste lots at once</b></summary><p class="small muted">One per line: <code>Question | A | B | C | D | correct letter | explanation</code>. C, D and the explanation can be empty.</p><textarea id="qI" style="min-height:110px" placeholder="Which joint is strongest for a drawer front? | Butt | Dovetail | Dowel | Housing | B | Dovetails resist being pulled apart."></textarea><div class="ctrl"><select id="qIg"><option value="quiz">Into the quiz</option><option value="challenge">Into the challenge</option></select><input type="text" id="qIt" placeholder="Topic (optional)" style="width:180px"><button class="btn sm" id="qIgo">Import</button></div></details>
     ${Q.slice().reverse().map(q=>`<div class="card adrow"><div style="flex:1;min-width:220px"><span class="pill ${q.target==='challenge'?'':'s'}">${q.target==='challenge'?'Challenge':'Quiz'}</span> <span class="pill">${esc(q.topic)}</span> ${q.active===false?'<span class="pill">off</span>':''}<p style="margin:6px 0 2px"><b>${esc(q.q)}</b></p><p class="small muted" style="margin:0">${[q.a,q.b,q.c,q.d].filter(Boolean).map((o,i)=>`${i===+q.answer?'<u>':''}${L[i]}. ${esc(o)}${i===+q.answer?'</u>':''}`).join(' &nbsp; ')}</p></div><div class="flex"><button class="btn ghost sm" data-t="${q.id}">${q.active===false?'Switch on':'Switch off'}</button><button class="btn ghost sm" data-e="${q.id}">Edit</button><button class="btn ghost sm" data-d="${q.id}">Delete</button></div></div>`).join('')||'<p class="muted">No questions added yet.</p>'}`;
    const pack=(vals,ans)=>{const o=vals.map(v=>String(v||'').trim()),keep=o.map((v,i)=>v?i:-1).filter(i=>i>=0);if(!o[ans])return null;return {o:keep.map(i=>o[i]),answer:keep.indexOf(ans)};};
    const mk=(src,p)=>({id:src.id||nid('q'),target:src.target,topic:(src.topic||"Teacher's picks").slice(0,40),q:src.q.slice(0,400),a:p.o[0],b:p.o[1],c:p.o[2]||'',d:p.o[3]||'',answer:p.answer,explain:(src.explain||'').slice(0,500),active:src.active!==false,by:K.name});
    G('qGo').onclick=()=>{const p=pack(L.map(l=>G('q'+l).value),+G('qAns').value);if(!G('qQ').value.trim()){toast('Type the question');return;}if(!p||p.o.length<2){toast('Fill at least two options and pick a filled one as correct');return;}const it=mk({id:e.id,target:G('qG').value,topic:G('qT').value,q:G('qQ').value.trim(),explain:G('qE').value,active:G('qV').checked},p);edit=null;act(()=>upsert('questions',it),'Saved to draft');};
    if(G('qX'))G('qX').onclick=()=>{edit=null;draw();};editList(Q);
    G('qIgo').onclick=()=>{const items=[],bad=[];G('qI').value.split('\n').map(l=>l.trim()).filter(Boolean).forEach((l,n)=>{const c=l.split('|').map(x=>x.trim()),ans='ABCD'.indexOf((c[5]||'').toUpperCase().charAt(0)),p=c.length>=6&&ans>=0?pack(c.slice(1,5),ans):null;if(!p||p.o.length<2||!c[0]){bad.push(n+1);return;}items.push(mk({target:G('qIg').value,topic:G('qIt').value,q:c[0],explain:c[6]||''},p));});
     if(bad.length){toast('Check line '+bad.slice(0,4).join(', ')+': it needs 6 parts split by |');return;}if(!items.length){toast('Paste at least one question');return;}act(()=>items.forEach(it=>D.questions.push(it)),items.length+' added');};
    box.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>act(()=>{const q=Q.find(x=>x.id===b.dataset.t);q.active=q.active===false;}));
    box.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>askConfirm('Delete this question?','Delete',()=>act(()=>del('questions',b.dataset.d),'Deleted')));},

   Shop(){const e=edit||{type:'avatar',active:true,price:100},vals={frame:['bronze','silver','emerald','gold','neon','rainbow'],theme:['sunset','violet','carbon','gold']};

     <div class="card"><h3 style="margin-top:0">Sale</h3><div class="ctrl"><select id="saP"><option value="0.9">10% off everything</option><option value="0.75">25% off</option><option value="0.5" selected>Half price</option><option value="2">Double (undo half price)</option></select><button class="btn ghost sm" id="saGo">Apply</button></div></div>
     <div class="tw"><table class="t"><tr><th>Item</th><th>Type</th><th>Value</th><th>Price</th><th>On sale</th><th></th></tr>${D.shop.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${s.type}</td><td>${esc(s.value)}</td><td>${s.price}</td><td>${s.active!==false?'yes':'no'}</td><td><button class="btn ghost sm" data-e="${s.id}">Edit</button> <button class="btn ghost sm" data-d="${s.id}">Delete</button></td></tr>`).join('')}</table></div>`;
    const vb=()=>{const t=G('sT').value;G('sVl').textContent=t==='avatar'?'Emoji':t==='title'?'Title text':'Style';G('sVbox').innerHTML=vals[t]?`<select id="sV" style="width:100%">${vals[t].map(v=>`<option ${e.value===v?'selected':''}>${v}</option>`).join('')}</select>`:inp('sV',e.type===t?e.value:'',t==='avatar'?'One emoji':'e.g. Forge Master');};vb();G('sT').onchange=vb;
    G('sGo').onclick=()=>{if(!G('sN').value.trim()||!G('sV').value.trim()){toast('Fill the name and value');return;}const it={id:e.id||nid('s'),name:G('sN').value.trim().slice(0,40),type:G('sT').value,value:G('sV').value.trim().slice(0,30),price:Math.max(0,+G('sP').value||0),desc:G('sD').value.slice(0,80),active:G('sA').checked};edit=null;act(()=>upsert('shop',it),'Saved to draft');};
    G('saGo').onclick=()=>{const f=+G('saP').value;act(()=>D.shop.forEach(s=>s.price=Math.max(0,Math.round(s.price*f/5)*5)),'Prices changed');};
    if(G('sX'))G('sX').onclick=()=>{edit=null;draw();};editList(D.shop);
    box.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>askConfirm('Delete this item?','Delete',()=>act(()=>del('shop',b.dataset.d),'Deleted')));},

   Settings(){box.innerHTML=SETGROUPS.map(([title,o])=>`<div class="card"><h3 style="margin-top:0">${title}</h3><div class="grid g2">${Object.entries(o).map(([k,[l,t]])=>t==='bool'?`<div>${chk('st_'+k,isOn(k),l)}</div>`:fld(l,inp('st_'+k,S()[k],'',t==='num'?'number':'text'))).join('')}</div></div>`).join('')+`<div class="ctrl"><button class="btn" id="stGo">Save</button><button class="btn ghost" id="stDef">Coin rules back to normal</button></div>`;
    G('stGo').onclick=()=>act(()=>SETGROUPS.forEach(([,g])=>Object.entries(g).forEach(([k,[,t]])=>{const el=G('st_'+k);S()[k]=t==='bool'?el.checked:el.value;})),'Saved to draft');

   'Class board'(){const B=D.board,now=Date.now(),day=864e5;
    box.innerHTML=`<div class="card"><h3 style="margin-top:0">Collect students' cards</h3><p class="small muted" style="margin-top:0">Ask students to copy their card link (Leaderboard, then "Copy my card link") into a Google Form or a private comment. Paste them here, as many as you like. Publishing then shows a class leaderboard on everyone's device. Only names, avatars and scores are shared. Nothing else.</p><textarea id="cbIn" style="min-height:90px" placeholder="Paste card links, one per line"></textarea><div class="ctrl"><button class="btn sm" id="cbGo">Add to board</button>${B.length?'<button class="btn ghost sm" id="cbX">Export as spreadsheet</button><button class="btn ghost sm" id="cbClr">Clear the board</button>':''}</div></div>
     ${B.length?`<div class="grid g4">${[[B.length,'students'],[B.filter(x=>now-x.t<7*day).length,'cards from this week'],[fmt(Math.round(B.reduce((a,x)=>a+(+x.xp||0),0)/B.length)),'average XP'],[B.filter(x=>x.chal).length?(B.filter(x=>x.chal).reduce((a,x)=>a+x.chal.score,0)/B.filter(x=>x.chal).length).toFixed(1):'–','average challenge']].map(([v,l])=>`<div class="statc card"><b>${v}</b><small>${l}</small></div>`).join('')}</div>
     <div class="grid g2">${bars('Syllabus points ticked',[['None',0,0],['1–10',1,10],['11–25',11,25],['26+',26,1e9]].map(([l,a,b])=>[l,B.filter(x=>{const v=(x.stats||{}).syllabus||0;return v>=a&&v<=b;}).length]))}${bars('Card age (when they last sent one)',[['This week',0,6],['1–4 weeks',7,30],['Older',31,1e9]].map(([l,a,b])=>[l,B.filter(x=>{const d=Math.floor((now-x.t)/day);return d>=a&&d<=b;}).length]))}</div>
     <div class="tw"><table class="t"><tr><th>#</th><th>Name</th><th>XP</th><th>This week</th><th>Streak</th><th>Quizzes</th><th>Syllabus</th><th>Challenge</th><th>Card</th><th></th></tr>${B.slice().sort((a,b)=>b.xp-a.xp).map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.name)}</b></td><td>${fmt(x.xp)}</td><td>${fmt(wk(x))}</td><td>${x.streak||0}</td><td>${(x.stats||{}).quizzes||0}</td><td>${(x.stats||{}).syllabus||0}</td><td>${x.chal?x.chal.score+'/'+x.chal.total:'–'}</td><td>${agoTxt(x.t)}</td><td><button class="btn ghost sm" data-d="${esc(x.uid)}">Remove</button></td></tr>`).join('')}</table></div>`:''}`;
    G('cbGo').onclick=async()=>{const lines=G('cbIn').value.split(/\s+/).filter(l=>/card[=:]/.test(l));if(!lines.length){toast('No card links found');return;}let n=0,bad=0;
     for(const l of lines){try{const c=await Pack.dec(l);if(c.k!=='card'||!c.uid)throw 0;const i=D.board.findIndex(x=>x.uid===c.uid);const o={uid:c.uid,name:String(c.name).slice(0,20),eq:c.eq||{},xp:+c.xp||0,weekXp:+c.weekXp||0,wk:c.wk,streak:+c.streak||0,own:+c.own||0,stats:c.stats||{},chal:c.chal||null,t:+c.t||Date.now()};if(i>=0){if(D.board[i].t<=o.t)D.board[i]=o;}else D.board.push(o);n++;}catch(e){bad++;}}
     act(()=>{},`${n} card${n===1?'':'s'} added${bad?`, ${bad} could not be read`:''}`);};
    if(G('cbX'))G('cbX').onclick=()=>showExport('Class board',toCSV([['Name','XP','This week','Streak','Quizzes','Perfect','Syllabus ticks','Written marks','Challenge','Card sent']].concat(B.map(x=>{const s=x.stats||{};return [x.name,x.xp,wk(x),x.streak,s.quizzes||0,s.perfect||0,s.syllabus||0,s.written||0,x.chal?x.chal.score+'/'+x.chal.total:'',new Date(x.t).toISOString().slice(0,10)];}))));
    if(G('cbClr'))G('cbClr').onclick=()=>askConfirm('Clear every card from the board?','Clear',()=>act(()=>{D.board=[];},'Board cleared'));
    box.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>act(()=>{D.board=D.board.filter(x=>x.uid!==b.dataset.d);}));},

   'Resets & gifts'(){const pend=D.resets.concat(D.gifts).sort((a,b)=>b.t-a.t);
    box.innerHTML=`<div class="card"><h3 style="margin-top:0">End the season</h3><p class="small muted" style="margin-top:0">Puts the top 3 from the class board into a Hall of Fame on the leaderboard and resets everyone's XP when they open the update. Coins and cosmetics stay.</p><div class="ctrl"><input type="text" id="seN" placeholder="Season name, e.g. Autumn term" maxlength="40" style="flex:1;min-width:200px"><button class="btn bad sm" id="seGo">End season</button></div>${D.hall.length?`<h3>Hall of Fame</h3>${D.hall.map((h,i)=>`<div class="adrow" style="padding:6px 0"><span><b>${esc(h.name)}</b> <span class="small muted">${new Date(h.ended).toLocaleDateString()}: ${h.top.map((t,k)=>(k+1)+'. '+esc(t.name)).join(', ')||'no scores'}</span></span><button class="btn ghost sm" data-h="${i}">Remove</button></div>`).join('')}`:''}</div>
     <div class="card"><h3 style="margin-top:0">Give coins to everyone</h3><div class="ctrl"><input type="number" id="gfA" value="50" style="width:100px"><input type="text" id="gfN" placeholder="Reason (shown to students)" maxlength="60" style="flex:1;min-width:180px"><button class="btn sm" id="gfGo">Add to update</button></div></div>
     <div class="card"><h3 style="margin-top:0">Reset something for everyone</h3><p class="small muted" style="margin-top:0">Happens once on each student's device when they open the update. Students who join later are not affected.</p><div class="grid g2">${Object.entries(RESETS).map(([k,[t,d]])=>`<div class="adrow"><div><b>${t}</b><p class="small muted" style="margin:2px 0">${d}</p></div><button class="btn ghost sm" data-r="${k}">Reset</button></div>`).join('')}</div></div>
     <div class="card"><h3 style="margin-top:0">In this update</h3>${pend.map(x=>`<div class="adrow" style="padding:6px 0"><span>${x.amount!=null?`Give ${x.amount} coins${x.note?': '+esc(x.note):''}`:`Reset ${esc((RESETS[x.what]||['season'])[0].toLowerCase())}${x.what==='season'?' (end of season)':''}`} <span class="small muted">added ${agoTxt(x.t)}</span></span><button class="btn ghost sm" data-x="${x.id}">Remove</button></div>`).join('')||'<p class="muted small">Nothing yet.</p>'}<p class="small muted" style="margin:6px 0 0">These stay in your updates for 30 days so students who open a later link still get them once.</p></div>`;
    G('seGo').onclick=()=>askConfirm('End the season? Everyone\'s XP resets when they open the next update.','End season',()=>act(()=>{const top=D.board.slice().sort((a,b)=>b.xp-a.xp).slice(0,3).map(x=>({name:x.name,xp:x.xp,eq:x.eq}));D.hall.unshift({name:G('seN').value.trim()||'Season '+(D.hall.length+1),ended:Date.now(),top});D.hall=D.hall.slice(0,6);D.resets.push({id:nid('r'),what:'season',t:Date.now()});D.board=[];},'Season ended. Publish to send it'));
    G('gfGo').onclick=()=>{const n=Math.round(+G('gfA').value);if(!n||n<0||n>5000){toast('Type an amount from 1 to 5000');return;}act(()=>D.gifts.push({id:nid('c'),amount:n,note:G('gfN').value.trim(),t:Date.now()}),'Added. Publish to send it');};
    box.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>askConfirm(`Reset ${RESETS[b.dataset.r][0].toLowerCase()} for everyone?`,'Add to update',()=>act(()=>D.resets.push({id:nid('r'),what:b.dataset.r,t:Date.now()}),'Added. Publish to send it')));
    box.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>act(()=>D.hall.splice(+b.dataset.h,1)));
    box.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>act(()=>{D.resets=D.resets.filter(x=>x.id!==b.dataset.x);D.gifts=D.gifts.filter(x=>x.id!==b.dataset.x);}));},

   Admins(){box.innerHTML=`<div class="card"><h3 style="margin-top:0">Your key</h3><p class="small" style="margin-top:0">Signed in as <b>${esc(K.name)}</b> (${K.role==='owner'?'owner':'admin'}). Save the backup somewhere private, such as your school Google Drive. You need it to publish from another device. Anyone who has it can publish as you.</p><div class="ctrl"><button class="btn sm" id="bkC">Copy key backup</button><button class="btn ghost sm" id="bkF">Remove key from this device</button></div></div>
     <div class="card"><h3 style="margin-top:0">Other admins</h3><p class="small muted" style="margin-top:0">A teacher opens Admin on their own device, creates a key and sends you the code it shows. Paste it here and publish. From then on, students accept their updates too. Only the owner can change this list.</p><div class="ctrl"><input type="text" id="amIn" placeholder="Name | key" style="flex:1;min-width:200px"><button class="btn sm" id="amGo">Add admin</button></div>${D.admins.map((a,i)=>`<div class="adrow" style="padding:6px 0"><span><b>${esc(a.name)}</b> <span class="small muted">${esc(a.key.slice(0,16))}…</span></span><button class="btn ghost sm" data-a="${i}">Remove</button></div>`).join('')||'<p class="muted small">No other admins yet.</p>'}</div>`;

    G('amGo').onclick=()=>{const [n,k]=G('amIn').value.split('|').map(s=>s.trim());if(!n||!k||!/^[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}$/.test(k)){toast('Paste the whole code, like: Mr Tan | abc….xyz…');return;}act(()=>{D.admins=D.admins.filter(a=>a.key!==k).concat([{name:n.slice(0,40),key:k}]);},'Added. Publish to make it count');};

   Publish(){const hist=lget('rm_pubhist',[]);
    box.innerHTML=`<div class="card"><h3 style="margin-top:0">Publish this update</h3><p class="small muted" style="margin-top:0">It includes ${D.announcements.length} announcements, ${D.goals.length} goals, ${D.questions.length} questions, ${D.shop.length} shop items, your settings${D.board.length?`, a class board of ${D.board.length}`:''}${D.resets.length+D.gifts.length?` and ${D.resets.length+D.gifts.length} resets or gifts`:''}. Each link replaces the last one, so students only ever need the newest.</p><button class="btn" id="pbGo">Publish and get the link</button></div><div id="pbOut">${LAST?outHTML(LAST):''}</div>
     ${hist.length?`<div class="card"><h3 style="margin-top:0">Published before</h3>${hist.slice(0,8).map(h=>`<div class="small" style="padding:4px 0">${new Date(h.t).toLocaleString([],{dateStyle:'medium',timeStyle:'short'})}: ${h.sum}</div>`).join('')}</div>`:''}`;
    G('pbGo').onclick=async()=>{const cut=Date.now()-30*864e5;D.resets=D.resets.filter(x=>x.t>cut);D.gifts=D.gifts.filter(x=>x.t>cut);
     const data={announcements:D.announcements,goals:D.goals,shop:D.shop,questions:D.questions,settings:D.settings,board:D.board,hall:D.hall,resets:D.resets,gifts:D.gifts};if(K.role==='owner')data.admins=D.admins;
     try{LAST=await Classroom.publish(data,K.name);Draft.save(D);D.edited=lget(LKEY.pack,{t:Date.now()}).t;lset(LKEY.draft,D);
      hist.unshift({t:Date.now(),sum:`${D.announcements.length} announcements, ${D.goals.length} goals, ${D.questions.length} questions`});lset('rm_pubhist',hist.slice(0,20));toast('Published. Now post the link');draw();}catch(e){toast(e.message);}};
    bindOut();}
  };
  const outHTML=L=>`<div class="card"><h3 style="margin-top:0">Your link</h3><div class="synctop"><div style="flex:1"><textarea readonly id="pbL" style="min-height:80px;font-family:ui-monospace,monospace;font-size:.72rem">${esc(L.link)}</textarea><div class="ctrl"><button class="btn sm" id="pbC">Copy link</button><button class="btn ghost sm" id="pbM">Copy a message for Google Classroom</button><button class="btn ghost sm" id="pbK">Copy as text code</button></div><p class="small muted">${L.link.length>2000?'This is a long link. If it gets cut off when you post it, students can paste the text code into My Space instead.':'Students open it once and the update loads.'}</p></div><div id="pbQR" class="qr"></div></div></div>`;
  const bindOut=()=>{if(!LAST||!G('pbC'))return;G('pbC').onclick=()=>copyText(LAST.link);G('pbK').onclick=()=>copyText('class:'+LAST.code);
   G('pbM').onclick=()=>copyText(`New RM Revise update. Open this link on the device you revise on:\n${LAST.link}`);
   const q=G('pbQR');if(LAST.link.length<=2900&&typeof qrcode!=='undefined'){try{const r=qrcode(0,'L');r.addData(LAST.link);r.make();q.innerHTML=r.createSvgTag({cellSize:3,margin:2,scalable:true})+'<small>Show this on the board</small>';}catch(e){}}};
  const draw=()=>{T[tab]();state();};
  const setTab=t=>{tab=t;edit=null;document.querySelectorAll('#adTabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));draw();};
  document.getElementById('adTabs').onclick=e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.t);};draw();}};

/* ================= NAV + ROUTER ================= */
/* plain typography: strip emoji that are only decoration at the start of headings, buttons and labels */
const DECO_RE=/^(?:\s*(?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:\uFE0F|\u20E3|\u200D\p{Extended_Pictographic}|\p{Emoji_Modifier})*)+\s*/u;
const DECO_SEL='h1,h2,h3,h4,h5,.btn,button,.pill,.crumb,summary,th,.eyebrow,.v3kicker,label,.goal b,.ann b,.tag,.banner,.hk,.sec,li>b:first-child,td>b:first-child,.toast,#toast';
function undeco(root){if(!root||!root.querySelectorAll)return;const els=[...root.querySelectorAll(DECO_SEL)];if(root.matches&&root.matches(DECO_SEL))els.push(root);
 els.forEach(el=>{if(el.closest('.ava,.pv,svg,.shopc .big'))return;let n=el.firstChild;while(n&&n.nodeType===3&&!n.textContent.trim())n=n.nextSibling;
  if(n&&n.nodeType===1&&!n.children.length&&DECO_RE.test(n.textContent)&&!n.textContent.replace(DECO_RE,'').trim()&&!n.closest('.ava'))n.remove();
  else if(n&&n.nodeType===3&&DECO_RE.test(n.textContent))n.textContent=n.textContent.replace(DECO_RE,'');});}
(function(){let q=new Set(),t=0;const mo=new MutationObserver(ms=>{ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)q.add(n);else if(n.parentElement)q.add(n.parentElement);}));if(!t)t=requestAnimationFrame(()=>{t=0;const a=[...q];q.clear();a.forEach(undeco);});});
 document.addEventListener('DOMContentLoaded',()=>mo.observe(document.body,{childList:true,subtree:true}));if(document.body)mo.observe(document.body,{childList:true,subtree:true});})();

 MATERIALS.forEach(m=>S.push({t:m.name,s:'Material · '+MATCATS[m.cat].label,k:(m.name+' '+m.uses+' '+m.props.join(' ')).toLowerCase(),go:()=>go('materials',()=>showMaterial(m.id))}));
 TOOLS.forEach(t=>S.push({t:t.name,s:'Tool · '+TOOLCATS[t.cat],k:(t.name+' '+t.use).toLowerCase(),go:()=>{TOOLWS_START=t.id;go('tools',()=>{const e=document.getElementById('t3d');if(e)e.scrollIntoView();});}}));
 PROCESSES.forEach(p=>S.push({t:p.name,s:'Process',k:(p.name+' '+p.products+' '+p.mat).toLowerCase(),go:()=>go('processes',()=>{const c=document.querySelector(`#prList [data-id="${p.id}"]`);if(c){c.click();c.scrollIntoView({block:'center'});}})}));

 GLOSS.forEach(g=>S.push({t:g[0],s:'Key term',k:(g[0]+' '+g[1]).toLowerCase(),d:g[1],go:()=>openModal(`<span class="pill">Key term</span><h2 style="margin-top:6px">${g[0]}</h2><p>${g[1]}</p>`)}));

function initSearch(){const IDX=searchIndex();const q=document.getElementById('q'),box=document.getElementById('sres');let hits=[];
 q.addEventListener('input',()=>{const v=q.value.trim().toLowerCase();if(v.length<2){box.style.display='none';return;}
  hits=IDX.map(x=>({x,sc:x.t.toLowerCase().startsWith(v)?3:x.t.toLowerCase().includes(v)?2:x.k.includes(v)?1:0})).filter(h=>h.sc).sort((a,b)=>b.sc-a.sc).slice(0,12).map(h=>h.x);
  box.innerHTML=hits.length?hits.map((h,i)=>`<a href="#" data-i="${i}"><b>${esc(h.t)}</b><small>${esc(h.s)}</small></a>`).join(''):'<a href="#"><small>No results</small></a>';box.style.display='block';});
 box.addEventListener('click',e=>{e.preventDefault();const a=e.target.closest('[data-i]');if(!a)return;const h=hits[+a.dataset.i];box.style.display='none';q.value='';q.blur();h.go();});
