Object.assign(TOOLINFO,{
mallet:{how:['Hold the handle near the end.','Strike squarely with the flat face.','Use controlled taps – let the weight of the head do the work.'],safety:'Check the head is tight on the handle before use.',tip:'Chisel → mallet, never a hammer (a hammer splits the handle). Sheet metal → mallet so the surface is not dented or stretched.'},
hammer:{how:['Choose the right hammer and weight for the job.','Hold near the end of the shaft and watch the nail/punch, not the hammer.','Start with light taps, then strike squarely.'],safety:'Wear eye protection when striking hardened tools; never use a hammer with a loose head.',tip:'Ball-pein = riveting and punches. Cross-pein starts panel pins between your fingers. Claw = pulling nails.'},
screwdriver:{how:['Match the tip type and size to the screw head.','Keep the driver in line with the screw and press firmly.','Turn clockwise to tighten.'],safety:'Never hold the work in your hand while driving a screw – the blade can slip.',tip:'Pozidriv screws need a Pozidriv driver – a Phillips driver cams out and chews the head.'},
spanner:{how:['Choose the spanner that fits the nut exactly.','Pull the spanner towards you rather than pushing.','Tighten firmly – add a spring washer or lock nut against vibration.'],safety:'A loose-fitting spanner slips and rounds the nut (and skins knuckles).',tip:'Ring spanners grip all six corners; open-ended are quicker to fit.'},
bradawl:{how:['Place the blade ACROSS the grain so it cuts the fibres.','Push and twist left and right.','Drive the screw into the starting hole.'],safety:'Keep your other hand behind the point.',tip:'A bradawl starts small screws; larger screws need a drilled pilot hole.'},
popriveter:{how:['Drill a hole through both sheets to match the rivet diameter.','Put the mandrel in the gun and the rivet through the hole.','Squeeze the handles until the mandrel snaps off.'],safety:'The snapped mandrel is sharp – dispose of it; wear eye protection.',tip:'Use pop rivets when you can only reach ONE side (blind riveting), e.g. box sections and tubes.'},
soldering:{how:['Clean the joint and let the iron reach temperature; "tin" the tip.','Heat the joint (not the solder) for a couple of seconds.','Feed solder into the joint, remove the solder, then the iron. A good joint is shiny.'],safety:'Tip is around 350 °C – use the stand, fume extraction and eye protection.',tip:'Flux stops oxidation so the solder "wets" the metal. A dull, blobby joint is a dry joint.'},
hearth:{how:['Arrange firebricks around the work to reflect heat.','Light the torch and adjust to a blue roaring flame.','Heat the whole joint evenly to the right colour, then apply the brazing rod or quench as needed.'],safety:'Leather apron, gauntlets, visor, tongs; know where the gas shut-off is.',tip:'Brazing ≈ 870–900 °C with borax flux and brass spelter – the parent metal does NOT melt.'},
spokeshave:{how:['Hold the work in a vice.','Hold both handles with thumbs behind the blade.','Push (or pull) along the curve, working "downhill" with the grain.'],safety:'Keep the blade sharp and fingers clear of the mouth.',tip:'Curved edge in wood → spokeshave. Flat edge → plane.'},
handdrill:{how:['Tighten the bit in the chuck by hand.','Hold the drill upright with one hand on the top handle.','Turn the wheel steadily with light pressure.'],safety:'Clamp the work; keep fingers away from the gears.',tip:'Good for small pilot holes; for larger or accurate holes use a pillar drill.'},
miller:{how:['Clamp the work in a machine vice bolted to the table.','Set the cutter speed and depth of cut.','Feed the table slowly so the work moves against the rotation of the cutter.'],safety:'Guards in place, goggles, no loose clothing; remove swarf with a brush only when stopped.',tip:'Lathe = work rotates, tool still. Milling machine = cutter rotates, work moves. Makes flats, slots and steps.'},
hotwire:{how:['Mark the cutting line on the foam.','Switch on and let the wire heat up.','Push the foam slowly through the wire – do not force it.'],safety:'Wire is hot and fumes are harmful – use ventilation/extraction.',tip:'Styrofoam is a quick modelling material and can be used for vacuum-forming test moulds.'},
combo:{how:['Loosen the lock nut and slide the head along the rule.','Hold the head against the datum edge.','Mark 90° or 45°, or use the rule end as a depth gauge.'],safety:'Keep the scriber stored in the head.',tip:'One tool that replaces a try square, mitre square, depth gauge and rule.'},
foldbars:{how:['Mark the bend line with a scriber.','Clamp the sheet in the folding bars with the line level with the top, then grip the bars in a vice.','Bend the sheet over with a mallet, working evenly along the length.'],safety:'Sheet edges are sharp – wear gloves and deburr.',tip:'A mallet (not a hammer) avoids marking and stretching the sheet.'}
});

<h2 id="struct" class="sec">Paper 3 (Resistant Materials) structure</h2>
<div class="grid g2">
<div class="card"><h3 style="margin-top:0">Section A · 25 marks · ≈25 min</h3><p>10 compulsory short questions. Typically: name a tool, state a property, sketch a joint or component, give a reason. Mostly AO1 knowledge – learn the facts on this site!</p></div>
<div class="card"><h3 style="margin-top:0">Section B · 25 marks · ≈35 min</h3><p>Choose ONE of three structured questions based on a product. Expect: material choice with reasons, making processes step-by-step with sketches, joining methods, finishes, modifications and evaluation.</p></div></div>
<div class="tip"><p>The whole paper is 50 marks in 60 minutes – roughly <b>1 mark per minute</b>, leaving ~10 minutes to check. Read all three Section B questions before choosing: pick the one where you can answer the high-mark parts, not just the first part.</p></div>
<h2 id="cmd" class="sec">Command words</h2>
<div class="tw"><table class="t"><tr><th>Word</th><th>What the examiner wants</th><th>Example</th></tr>
<tr><td><b>Name / State / Give</b></td><td>A short answer – a word or phrase. No explanation needed.</td><td>"Name a suitable hardwood." → Beech</td></tr>
<tr><td><b>Describe</b></td><td>Say what something is like or what happens, in steps or features.</td><td>Describe how timber is air seasoned.</td></tr>
<tr><td><b>Explain</b></td><td>Give reasons – use "because…" / "so that…".</td><td>Explain why MDF is good for painted toys.</td></tr>
<tr><td><b>Sketch</b></td><td>Freehand drawing, labelled. Neatness matters less than clear detail.</td><td>Sketch a corner halving joint.</td></tr>
<tr><td><b>Use notes and sketches</b></td><td>Both! Sketches showing tools/equipment + notes in sequence. Usually high marks.</td><td>Use notes and sketches to show how the base could be vacuum formed.</td></tr>
<tr><td><b>Compare</b></td><td>Similarities AND differences – "whereas…".</td><td>Compare air and kiln seasoning.</td></tr>
<tr><td><b>Evaluate / Discuss</b></td><td>Advantages and disadvantages, then a judgement.</td><td>Evaluate the use of CAM in a small workshop.</td></tr>
<tr><td><b>Suggest</b></td><td>Apply your knowledge to a new situation – there may be several right answers.</td><td>Suggest a modification to improve stability.</td></tr></table></div>
<h2 id="describe" class="sec">How to write a "describe how to make" answer</h2>
<div class="card"><ol><li><b>Mark out</b> – name the tools (e.g. "scriber and engineer's square on marking blue").</li><li><b>Hold</b> the work – say what holds it (vice, G-clamp, machine vice).</li><li><b>Cut / shape</b> – name the specific tool or machine (coping saw, not "saw").</li><li><b>Form / join</b> – specific process (line bend on strip heater using a jig).</li><li><b>Finish</b> – the full sequence (draw file → wet &amp; dry → polish).</li><li><b>Safety</b> – one relevant precaution (goggles, guard, extraction).</li></ol>
<div class="eg"><p><b>Q: Describe how the 3 mm acrylic phone stand could be made (6 marks).</b></p><p>Mark the outline on the protective film with a spirit marker using a card template. Hold the acrylic in a vice with soft jaws and cut out with a coping saw (or laser cut from a CAD drawing). File the edges flat with a flat file, then draw file, rub down with wet &amp; dry paper used wet and polish on a buffing machine. Remove the film, mark the bend line and heat it on a strip heater, turning it over regularly, then bend it over a wooden jig at 70° and hold until it cools. Wear goggles when buffing.</p></div></div>
<h2 id="mistakes" class="sec">Common ways students lose marks</h2>
<div class="grid g2">
<div class="warn" style="margin:0"><p><b>Vague words:</b> "strong", "cheap", "easy to work", "looks nice" – always qualify: "strong in tension so it will not snap when the bag is lifted".</p></div>
<div class="warn" style="margin:0"><p><b>Generic materials:</b> "plastic", "wood", "metal" usually get 0. Say <i>acrylic</i>, <i>beech</i>, <i>aluminium</i>.</p></div>
<div class="warn" style="margin:0"><p><b>Generic tools:</b> "saw", "file", "glue". Say <i>tenon saw</i>, <i>half-round file</i>, <i>PVA</i>.</p></div>
<div class="warn" style="margin:0"><p><b>Repeating the question</b> or giving the same reason twice for two marks.</p></div>
<div class="warn" style="margin:0"><p><b>Unlabelled sketches.</b> Label parts, materials and dimensions.</p></div>
<div class="warn" style="margin:0"><p><b>Safety answers like "be careful".</b> Name the hazard and the control: "wear goggles to protect eyes from flying swarf".</p></div></div>
<h2 id="timer" class="sec">Exam timer</h2>
<div class="card">${lab('Timed practice')}
<div class="ctrl"><select id="tmSel"><option value="60">Paper 3 – 60 min</option><option value="75">Paper 1 – 75 min</option><option value="25">Section A only – 25 min</option><option value="35">Section B only – 35 min</option><option value="10">Quick 10 min drill</option></select><button class="btn sm" id="tmGo">Start</button><button class="btn ghost sm" id="tmStop">Reset</button></div>

init(){
  const out=document.getElementById('ppOut');
  const upd=()=>{const y=+ppYear.value,s=ppSer.value,p=ppPap.value,v=ppVar.value;const yy=String(y).slice(2);const code=`0445_${s}${yy}`;const sess=`${y}-${s==='s'?'may-june':'oct-nov'}`;
    const late = (y===2026&&s==='w');

    ${late?`<p class="warn">The Oct/Nov 2026 papers will be released after results – try another session.</p>`:`<a class="btn" style="margin-top:10px;display:inline-block;text-decoration:none" href="${LINKS.pp}/${sess}" target="_blank" rel="noopener">Open ${s==='s'?'May/June':'Oct/Nov'} ${y} session →</a>`}`;};
  ['ppYear','ppSer','ppPap','ppVar'].forEach(i=>document.getElementById(i).addEventListener('change',upd));upd();
  let T=null,left=3600,total=3600;const face=document.getElementById('tmFace'),bar=document.getElementById('tmBar'),msg=document.getElementById('tmMsg');

    const used=(total-left)/60; if(total===3600){msg.textContent= used<25?'Section A – short answers, keep moving':used<55?'Section B – detailed answers with sketches':'Check your answers!';}};
  const reset=()=>{clearInterval(T);T=null;total=left=+tmSel.value*60;show();msg.textContent='';tmGo.textContent='Start';};
  tmSel.onchange=reset; tmStop.onclick=reset;
  tmGo.onclick=()=>{if(T){clearInterval(T);T=null;tmGo.textContent='Resume';return;}tmGo.textContent='Pause';T=setInterval(()=>{left--;show();if(left<=0){clearInterval(T);T=null;msg.textContent='⏰ Time is up – pens down!';}},1000);};

}};

/* ---------------- DESIGN (Product design) ---------------- */
const STAGES=[['Identify need','Spot a problem or opportunity – observe users, situations and existing products. Write a short design brief: who it is for, what it must do, and the context.'],
['Research','Gather and analyse information: existing products (ACCESS FM analysis), user questionnaires and interviews, anthropometric data, materials and costs. Record findings as charts and summaries.'],
['Specification','A list of measurable, testable requirements the product must meet (size, weight, cost, materials, safety, users…). Everything later is checked against this.'],
['Ideas','Generate a RANGE of different ideas – sketches with annotation, models, mock-ups. Appraise each against the specification.'],
['Develop','Choose and refine the best idea: test with models, decide materials, construction, joints, dimensions and finishes. Use CAD where helpful.'],
['Plan & make','Produce working drawings, a cutting list and a production plan (stages, tools, time, quality checks). Make the product safely and accurately.'],
['Test & evaluate','Test the product against each specification point and with real users. Suggest modifications – functional, safety, aesthetic, ergonomic and economic.']];
PAGES.design = {t:'Product design',html:()=>`
${head('Paper 1 · Product Design','Product design, users & sustainability','Common content for every candidate – it is examined in Paper 1 and drives your coursework. It also appears in Paper 3 Section B questions.')}
${toc([['cycle','Design process'],['spec','Specification builder'],['research','Research'],['aes','Function & aesthetics'],['anthro','Anthropometrics'],['scale','Scale of production'],['society','Society'],['sust','Sustainability'],['recycle','Recycling symbols'],['control','Control systems'],['p1','Paper 1 tips']])}
<h2 id="cycle" class="sec">The design process</h2>
<div class="grid g2"><div class="card cycle"><svg id="cyc" viewBox="0 0 400 400"></svg></div><div class="card"><h3 id="cycT" style="margin-top:0"></h3><p id="cycD"></p><p class="muted small">Tap each stage. Designing is <b>iterative</b> – you loop back and improve at every stage.</p></div></div>
<div class="key"><p><b>Design brief</b> – a short statement of the problem and the product needed. <b>Specification</b> – a detailed list of measurable criteria the design must meet.</p></div>
<h2 id="spec" class="sec">Specification builder (ACCESS FM)</h2>
<div class="card">${lab('Build a specification','type points, then check them')}
<div class="ctrl"><label>Product</label><input type="text" id="spProd" value="Desk tidy for a student" style="flex:1;min-width:200px"></div>
<div class="grid g2" id="spFields"></div>
<div class="flex" style="margin-top:10px"><button class="btn" id="spCheck">Check my specification</button><button class="btn ghost" id="spCopy">Copy as list</button><button class="btn ghost" id="spEx">Fill an example</button></div>
<div id="spOut" style="margin-top:12px"></div></div>
<div class="tip"><p>A good spec point is <b>specific and testable</b>: "The desk tidy must not be larger than 200 × 150 × 120 mm so it fits on a small desk." Always add a reason.</p></div>
<h2 id="research" class="sec">Research methods</h2>
<div class="grid g2"><div class="card"><h3 style="margin-top:0">Primary (you collect it)</h3><ul><li>Questionnaires &amp; surveys (sampling)</li><li>Interviews with users / experts</li><li>Observing people using products</li><li>Measuring users &amp; spaces; testing materials</li><li>Disassembling / analysing existing products</li></ul></div>
<div class="card"><h3 style="margin-top:0">Secondary (someone else collected it)</h3><ul><li>Websites, online stores, reviews</li><li>Books, magazines, catalogues</li><li>Anthropometric data tables</li><li>Standards &amp; regulations (e.g. toy safety)</li></ul></div></div>
<p><b>Analysing an existing product</b> – use ACCESS FM: Aesthetics, Cost, Customer, Environment, Safety, Size, Function, Materials (and Manufacture). Present data as bar/pie charts, tables or flow charts.</p>
<h2 id="aes" class="sec">Function &amp; aesthetics</h2>
<p>Function = how well the product does its job. Aesthetics = how it looks and feels. The syllabus elements of aesthetics:</p>
<div class="grid g4">${[['Line','straight, curved, thick/thin – leads the eye'],['Shape','2D outline – geometric or organic'],['Form','3D shape and volume'],['Proportion','size of parts relative to each other (e.g. golden ratio)'],['Space','gaps and negative space around parts'],['Colour','warm/cool, contrast, harmony, brand, mood'],['Texture','how the surface looks and feels – smooth, grained, matt']].map(([a,b])=>`<div class="card" style="padding:12px"><b>${a}</b><p class="small muted" style="margin:3px 0 0">${b}</p></div>`).join('')}</div>
<h2 id="anthro" class="sec">Anthropometrics &amp; ergonomics</h2>
<div class="key"><p><b>Anthropometrics</b> = measurements of the human body. <b>Ergonomics</b> = designing products to be comfortable, efficient and safe for people to use, using anthropometric data.</p></div>
<p>Designers usually design for the <b>5th to 95th percentile</b> – 90% of the population. A 95th percentile measurement means 95% of people are that size or smaller.</p>
<div class="card">${lab('Which percentile?','choose for each design situation')}<div id="pcBox"></div></div>
<h2 id="scale" class="sec">Scale of production</h2>
<div class="tw"><table class="t"><tr><th></th><th>One-off</th><th>Batch</th><th>Mass</th></tr>
<tr><td><b>Quantity</b></td><td>One (or a few)</td><td>Set number of identical items</td><td>Very large numbers, continuous run</td></tr>
<tr><td><b>Labour</b></td><td>Highly skilled craftspeople</td><td>Semi-skilled; workers/machines switch between batches</td><td>Low-skilled, specialised tasks; automation & robots</td></tr>
<tr><td><b>Production aids</b></td><td>Few – hand tools, CNC for prototypes</td><td>Jigs, templates, moulds, formers</td><td>Dedicated machines, production lines, expensive moulds</td></tr>
<tr><td><b>Cost per item</b></td><td>High</td><td>Medium</td><td>Low (high set-up cost)</td></tr>
<tr><td><b>Examples</b></td><td>Wedding dress, prototype, bespoke kitchen, bridge</td><td>Bread, furniture ranges, limited edition trainers</td><td>Cars, phones, LEGO, drinks bottles</td></tr></table></div>
<div class="card">${lab('Sort the products','tap an item, then tap a box')}<div class="chips" id="srtItems"></div><div class="grid g3" id="srtBins"></div><div class="flex" style="margin-top:8px"><button class="btn sm" id="srtCheck">Check</button><button class="btn ghost sm" id="srtReset">Reset</button></div><div id="srtRes" class="res"></div></div>
<h2 id="society" class="sec">Design &amp; technology in society</h2>
<div class="grid g3"><div class="card"><h4>Social effects</h4><p class="small">Products change how we live and work – smartphones, automation replacing jobs, inclusive design for elderly/disabled users, cultural acceptability.</p></div><div class="card"><h4>Environmental effects</h4><p class="small">Use of finite resources, energy in manufacture and transport, pollution, waste and landfill, deforestation.</p></div><div class="card"><h4>Economic effects</h4><p class="small">Jobs and industries created or lost, global manufacturing, cheaper mass-produced goods, cost of disposal.</p></div></div>
<p><b>Designers</b> create ideas and solutions; <b>artisans/craftspeople</b> make high-quality products by hand with specialist skills; <b>technologists/engineers</b> develop the technical systems, materials and manufacturing methods. Designers must consider a range of human needs: physical, safety, social, cultural and aesthetic.</p>
<h2 id="sust" class="sec">Environment &amp; sustainability</h2>
<div class="grid g2"><div class="card"><h4>Finite (non-renewable) energy</h4><p class="small">Fossil fuels – coal, oil, natural gas – and nuclear (uranium). Will run out; fossil fuels release CO₂.</p></div><div class="card"><h4>Renewable ("almost infinite")</h4><p class="small">Solar, wind, hydroelectric, tidal, wave, geothermal, biomass. Products can conserve energy: insulation, LED lighting, efficient motors, standby switches, solar chargers.</p></div></div>
<h3>The 6 Rs</h3>
<div class="grid g3">${[['Reduce','Use less material and energy; make products lighter and more efficient.'],['Reuse','Use a product again for the same or a new purpose.'],['Recycle','Reprocess the material into new products (thermoplastics, metals, paper).'],['Rethink','Design differently – is there a better way to meet the need?'],['Refuse','Don\'t accept unsustainable products/packaging.'],['Repair','Design products that can be mended – easy disassembly, standard parts.']].map(([a,b])=>`<div class="card" style="padding:12px"><b>${a}</b><p class="small muted" style="margin:3px 0 0">${b}</p></div>`).join('')}</div>
<ul><li><b>Sustainable materials:</b> FSC-certified timber, recycled plastics (rPET), materials that biodegrade, local sourcing.</li><li><b>Design for disassembly:</b> use KD fittings/screws instead of glue, label plastics, standard parts that can be reused.</li><li><b>Limited lifetime:</b> some products wear out or become obsolete (planned obsolescence) – designers should consider the full life cycle.</li></ul>
<h2 id="recycle" class="sec">Recycling symbols</h2>
<div class="grid g4" id="ricGrid"></div><div class="card" id="ricInfo" style="margin-top:10px"><p class="muted">Tap a symbol.</p></div>
<h2 id="control" class="sec">Control systems</h2>
<div class="card"><svg viewBox="0 0 640 170" style="width:100%;height:auto">
<rect x="20" y="40" width="150" height="60" rx="10" fill="#e8eefc" stroke="#1747d1" stroke-width="2"/><text x="95" y="68" text-anchor="middle" font-weight="700" font-family="Outfit" font-size="18">INPUT</text><text x="95" y="88" text-anchor="middle" font-size="12">sensor, switch</text>
<rect x="245" y="40" width="150" height="60" rx="10" fill="#e3f6f2" stroke="#0f9d8a" stroke-width="2"/><text x="320" y="68" text-anchor="middle" font-weight="700" font-family="Outfit" font-size="18">PROCESS</text><text x="320" y="88" text-anchor="middle" font-size="12">controller / mechanism</text>
<rect x="470" y="40" width="150" height="60" rx="10" fill="#fff4df" stroke="#b86e00" stroke-width="2"/><text x="545" y="68" text-anchor="middle" font-weight="700" font-family="Outfit" font-size="18">OUTPUT</text><text x="545" y="88" text-anchor="middle" font-size="12">motor, lamp, heater</text>
<path d="M170 70 L240 70 M395 70 L465 70" stroke="#2b3644" stroke-width="3" marker-end="url(#ah)"/><path d="M545 100 L545 145 L95 145 L95 105" stroke="#d23a3a" stroke-width="3" fill="none" stroke-dasharray="7 5" marker-end="url(#ah2)"/><text x="320" y="162" text-anchor="middle" font-size="13" fill="#d23a3a" font-weight="700">FEEDBACK (closed loop)</text>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2b3644"/></marker><marker id="ah2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d23a3a"/></marker></defs></svg>
<p class="small"><b>Open loop:</b> no feedback – a toaster timer runs whether the bread is done or not. <b>Closed loop:</b> feedback adjusts the output – a thermostat measures temperature and switches the heater on/off. Example: street light – input LDR, process transistor/IC, output lamp.</p></div>
<h2 id="p1" class="sec">Paper 1 – how to score well</h2>
<div class="card"><ul><li>You answer <b>one</b> of three questions on A3 sheets in 1 h 15 min. Choose the context you can design for best.</li><li>Typical parts: <b>specification points</b> (other than those given) → <b>a range of ideas</b> (usually three, clearly different) → <b>evaluation</b> of ideas → <b>development</b> of one idea (materials, construction details, joints, fixings, dimensions) → a <b>detailed final solution</b>/making details. Check the mark allocation on the paper and spend time to match it.</li><li>Ideas must be genuinely <b>different</b> – different mechanisms, forms or materials, not the same idea in three colours.</li><li><b>Annotate</b> every sketch: function, materials, sizes, how it is made and joined.</li><li>Use colour/tone to show form and materials but don't waste time on decoration.</li><li>Bring the right equipment: pencils, fine liners, colour pencils, ruler, eraser, compass (check the Cambridge FAQ).</li></ul></div>`,
init(){
  // cycle
  const svg=document.getElementById('cyc');let g='';const R=145,cx=200,cy=200;
  g+=`<circle cx="200" cy="200" r="${R}" fill="none" stroke="#e3e8ef" stroke-width="16"/>`;
  STAGES.forEach((s,i)=>{const a=-Math.PI/2+i*2*Math.PI/STAGES.length;const x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);
    g+=`<g class="st" data-i="${i}"><circle cx="${x}" cy="${y}" r="38" fill="#fff" stroke="#1747d1" stroke-width="2.5"/><text x="${x}" y="${y-4}" text-anchor="middle" font-size="13" font-weight="800" font-family="Outfit" fill="#1747d1">${i+1}</text>${s[0].split(' ').map((w,j,arr)=>`<text x="${x}" y="${y+10+j*12-(arr.length-1)*4}" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f1b2d" font-family="Inter">${w}</text>`).join('')}</g>`;});
  g+=`<text x="200" y="196" text-anchor="middle" font-family="Outfit" font-weight="800" font-size="22" fill="#0f1b2d">Design</text><text x="200" y="220" text-anchor="middle" font-family="Outfit" font-weight="800" font-size="22" fill="#0f1b2d">process</text>`;
  svg.innerHTML=g;const sel=i=>{svg.querySelectorAll('.st').forEach(e=>e.classList.toggle('on',+e.dataset.i===i));cycT.textContent=(i+1)+'. '+STAGES[i][0];cycD.textContent=STAGES[i][1];};
  svg.addEventListener('click',e=>{const st=e.target.closest('.st');if(st)sel(+st.dataset.i);});sel(0);
  // spec builder
  const F=[['A','Aesthetics','e.g. Must use a bright colour scheme to appeal to teenagers'],['C','Cost','e.g. Must cost less than $8 in materials'],['C2','Customer / user','e.g. For students aged 14–18 working at a desk'],['E','Environment','e.g. At least 50% of the material must be recyclable'],['S','Safety','e.g. Must have no sharp edges – all corners radiused at least 3 mm'],['S2','Size','e.g. Must not exceed 200 × 150 × 120 mm'],['F','Function','e.g. Must hold at least 10 pens and a mobile phone'],['M','Materials / manufacture','e.g. Must be made from 3 mm acrylic so it can be laser cut']];
  const ex=['Must use a bright, modern colour scheme to appeal to teenagers','Must cost less than $8 in materials','For students aged 14–18 working at a home desk','At least 50% of the material must be recyclable','Must have no sharp edges – all corners radiused to 3 mm','Must not exceed 200 × 150 × 120 mm so it fits on a small desk','Must hold at least 10 pens and stand a mobile phone at 60°','Must be made from 3 mm acrylic so it can be laser cut in batches'];
  spFields.innerHTML=F.map(([k,t,p])=>`<div><label class="small"><b>${t}</b></label><textarea data-k="${k}" placeholder="${p}"></textarea></div>`).join('');
  const vals=()=>[...spFields.querySelectorAll('textarea')].map((t,i)=>[F[i][1],t.value.trim()]).filter(x=>x[1]);
  spEx.onclick=()=>spFields.querySelectorAll('textarea').forEach((t,i)=>t.value=ex[i]);
  spCheck.onclick=()=>{const v=vals();if(!v.length){spOut.innerHTML='<p class="res no">Write at least one point first.</p>';return;}
    const vague=/\b(nice|good|cheap|easy|small|big|large|strong|pretty|cool|attractive|safe|light)\b/i;
    spOut.innerHTML=`<h4>${spProd.value||'Product'} – specification</h4><ol>${v.map(([cat,t])=>{const iss=[];if(!/\d/.test(t))iss.push('add a number/measurement');if(vague.test(t)&&!/\d/.test(t))iss.push('vague word: "'+t.match(vague)[0]+'"');if(!/\bmust|should|will\b/i.test(t))iss.push('start with "must…"');if(!/(so|because|to )/i.test(t))iss.push('add a reason ("so that…")');
      return `<li><b>${cat}:</b> ${esc(t)} ${iss.length?`<span class="pill" style="background:#fdeaea;color:#b23;border-color:#f5c6c6">⚠ ${iss.join(' · ')}</span>`:'<span class="pill" style="background:#e5f5eb;color:#1d6a3a;border-color:#b9e3c8">✓ measurable</span>'}</li>`;}).join('')}</ol>`;};
  spCopy.onclick=()=>copyText(`${spProd.value} – specification\n`+vals().map(([c,t],i)=>`${i+1}. ${t}`).join('\n'));
  // percentile
  const PC=[['Height of a doorway','95','Clearance – the tallest people must fit, so use the 95th percentile (plus allowance for shoes/hats).'],['Height of the top shelf in a kitchen cupboard','5','Reach – if the 5th percentile can reach it, everyone taller can too.'],['Width of a bus seat','95','Clearance – the widest hips must fit.'],['Distance from seat to car pedals (fixed)','5','Reach – shorter people must reach. Most cars make this adjustable (5th–95th).'],['Gap between bars of a cot (to stop a baby\'s head passing)','5','Safety – make gaps SMALLER than the 5th percentile head size so no baby can get stuck.'],['Height of an adjustable office chair','5 to 95','Adjustable range – covers 90% of users.']];
  pcBox.innerHTML=PC.map((p,i)=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${p[0]}</b><div class="chips">${['5','50','95','5 to 95'].map(o=>`<button class="chip" data-i="${i}" data-o="${o}">${o==='5 to 95'?'5th–95th range':o+'th'}</button>`).join('')}</div><div class="small" id="pc${i}"></div></div>`).join('');
  pcBox.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;const p=PC[b.dataset.i];const ok=b.dataset.o===p[1];document.getElementById('pc'+b.dataset.i).innerHTML=`<span class="res ${ok?'ok':'no'}">${ok?'✓ Correct.':'✗ Not quite.'}</span> ${p[2]}`;});
  // sorter
  const ITEMS=[['Wedding dress for a client','o'],['LEGO bricks','m'],['Bread rolls in a bakery','b'],['Smartphones','m'],['Prototype of a new kettle','o'],['A range of 200 café chairs','b'],['Plastic drinks bottles','m'],['Bespoke kitchen','o'],['Limited edition trainers','b'],['Cars','m'],['A suspension bridge','o'],['School uniforms for one term','b']];
  const BINS=[['o','One-off'],['b','Batch'],['m','Mass']];let pick=null;const place={};
  const draw=()=>{srtItems.innerHTML=ITEMS.map((it,i)=>place[i]?'':`<button class="sortitem ${pick===i?'sel':''}" data-i="${i}">${it[0]}</button>`).join('')||'<span class="muted small">All placed – press Check.</span>';
    srtBins.innerHTML=BINS.map(([k,t])=>`<div class="bin" data-b="${k}"><h4>${t}</h4><div class="chips">${ITEMS.map((it,i)=>place[i]===k?`<button class="sortitem" data-p="${i}">${it[0]}</button>`:'').join('')}</div></div>`).join('');};
  srtItems.onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;pick=+b.dataset.i;draw();};
  srtBins.onclick=e=>{const p=e.target.closest('[data-p]');if(p){delete place[p.dataset.p];draw();return;}const bin=e.target.closest('.bin');if(bin&&pick!==null){place[pick]=bin.dataset.b;pick=null;draw();}};
  srtCheck.onclick=()=>{let ok=0;srtBins.querySelectorAll('[data-p]').forEach(b=>{const i=+b.dataset.p;const r=ITEMS[i][1]===place[i];b.classList.add(r?'right':'wrong');if(r)ok++;});srtRes.className='res '+(ok===ITEMS.length?'ok':'no');srtRes.textContent=`${ok} / ${ITEMS.length} correct${ok===ITEMS.length?' – brilliant!':' – red ones are in the wrong box.'}`;};
  srtReset.onclick=()=>{for(const k in place)delete place[k];pick=null;srtRes.textContent='';draw();};draw();
  // recycling
  const RIC=[['1','PET','Drinks bottles, food trays','Widely recycled – into new bottles, fleece and carpet.'],['2','HDPE','Milk & detergent bottles, crates','Widely recycled.'],['3','PVC','Pipes, window frames, cable insulation','Rarely recycled at home; releases toxic gases if burned.'],['4','LDPE','Carrier bags, squeezy bottles, film','Sometimes recycled (bag collection points).'],['5','PP','Food tubs, bottle caps, straws','Increasingly recycled.'],['6','PS','Yoghurt pots, packaging foam (EPS)','Difficult to recycle; often landfilled.'],['7','OTHER','Mixed plastics, acrylic, polycarbonate, nylon','Generally not recycled.']];
  const ricSvg=(n,ab)=>`<svg viewBox="0 0 64 64"><path d="M32 8 L52 44 L12 44 Z" fill="none" stroke="#0f1b2d" stroke-width="4" stroke-linejoin="round"/><path d="M46 30 l6 14 -10 -2 M26 44 l-14 0 6 -8 M30 12 l2 -4 4 8" stroke="#0f1b2d" stroke-width="3" fill="none"/><text x="32" y="38" text-anchor="middle" font-size="15" font-weight="800" font-family="Outfit">${n}</text><text x="32" y="58" text-anchor="middle" font-size="9" font-weight="800" font-family="Inter">${ab}</text></svg>`;
  const OTH=[['loop','Mobius loop','The product/packaging CAN be recycled (if inside a circle with %, it contains that % recycled material).',`<svg viewBox="0 0 64 64"><g fill="none" stroke="#1d8a4a" stroke-width="6" stroke-linecap="round"><path d="M20 46 L10 30 L18 18"/><path d="M28 12 L44 12 L50 22"/><path d="M54 32 L46 48 L32 48"/></g><g fill="#1d8a4a"><path d="M13 14 l10 2 -6 8z"/><path d="M50 14 l4 10 -10 -2z"/><path d="M28 54 l-6 -8 10 -1z"/></g></svg>`],['dot','Green Dot','The producer has paid towards recovery/recycling schemes – it does NOT mean the item is recyclable.',`<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="#1d8a4a"/><path d="M32 10 A22 22 0 0 0 32 54" stroke="#fff" stroke-width="7" fill="none"/><path d="M32 54 A22 22 0 0 0 32 10" stroke="#7fd3a1" stroke-width="7" fill="none"/></svg>`],['tidy','Tidyman','Please dispose of this litter responsibly in a bin.',`<svg viewBox="0 0 64 64"><circle cx="24" cy="12" r="6" fill="#0f1b2d"/><path d="M24 20 L22 38 L16 56 M22 38 L30 56 M24 26 L36 34" stroke="#0f1b2d" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M38 34 L54 34 L52 56 L40 56 Z" fill="#0f1b2d"/></svg>`]];
  ricGrid.innerHTML=RIC.map((r,i)=>`<div class="sym" data-r="${i}">${ricSvg(r[0],r[1])}<span>${r[0]} · ${r[1]}</span></div>`).join('')+OTH.map((o,i)=>`<div class="sym" data-o="${i}">${o[3]}<span>${o[1]}</span></div>`).join('');
  ricGrid.onclick=e=>{const s=e.target.closest('.sym');if(!s)return;ricGrid.querySelectorAll('.sym').forEach(x=>x.classList.remove('on'));s.classList.add('on');
    if(s.dataset.r!==undefined){const r=RIC[s.dataset.r];ricInfo.innerHTML=`<h4>${r[0]} – ${r[1]}</h4><p><b>Products:</b> ${r[2]}</p><p><b>Recycling:</b> ${r[3]}</p><p class="small muted">This is the Resin Identification Code – it tells you which plastic it is, not that it will be recycled.</p>`;}
    else{const o=OTH[s.dataset.o];ricInfo.innerHTML=`<h4>${o[1]}</h4><p>${o[2]}</p>`;}};
}};

const isoPt=(x,y,z,s=1,ox=0,oy=0)=>[ox+(x-y)*Math.cos(Math.PI/6)*s, oy+((x+y)*Math.sin(Math.PI/6)-z)*s];
function isoBoxSVG(ox,oy,w,d,h,s,tone=true){const P=(x,y,z)=>isoPt(x,y,z,s,ox,oy).map(v=>v.toFixed(1)).join(',');
  return `<polygon points="${P(0,0,h)} ${P(w,0,h)} ${P(w,d,h)} ${P(0,d,h)}" fill="${tone?'#eef3ff':'none'}"/><polygon points="${P(0,d,0)} ${P(w,d,0)} ${P(w,d,h)} ${P(0,d,h)}" fill="${tone?'#c9d6f5':'none'}"/><polygon points="${P(w,0,0)} ${P(w,d,0)} ${P(w,d,h)} ${P(w,0,h)}" fill="${tone?'#8fa6e0':'none'}"/>`;}

PAGES.drawing = {t:'Drawing & communication',html:()=>`
${head('Paper 1 · Communication','Drawing & communicating ideas','You must communicate ideas with sketches, colour, shading and technical vocabulary – in Paper 1, Paper 3 sketch questions and your project.')}
${toc([['tech','Drawing techniques'],['orthoS','Orthographic'],['lt','Line types & dimensions'],['rend','Rendering'],['ann','Annotation & modelling']])}
<div class="flex"><a class="btn" href="#sketch">✏️ Open Sketch Studio</a><a class="btn ghost" href="#projection">🧊 Projection Lab</a></div>
<h2 id="tech" class="sec">Drawing techniques</h2>
<div class="grid g2">
<div class="card"><div class="pdiag">${DRAW_SVGS.iso}</div><h3>Isometric</h3><p class="small">Vertical lines stay vertical; horizontal edges at <b>30°</b>. All three axes drawn true length. Use an isometric grid or 30/60 set square. Good for showing 3D products clearly.</p></div>
<div class="card"><div class="pdiag">${DRAW_SVGS.obl}</div><h3>Oblique</h3><p class="small">Front face drawn as a true shape; receding lines at <b>45°</b>. <b>Cabinet oblique</b> uses half-length receding lines so it doesn't look stretched. Quick for objects with a detailed front (e.g. circles).</p></div>
<div class="card"><div class="pdiag">${DRAW_SVGS.p1}</div><h3>One-point perspective</h3><p class="small">All receding lines go to a single vanishing point (VP) on the horizon line. Good for interiors and front-facing objects.</p></div>
<div class="card"><div class="pdiag">${DRAW_SVGS.p2}</div><h3>Two-point perspective</h3><p class="small">Two VPs on the horizon. Most realistic view of a product's corner. Objects get smaller with distance.</p></div>
<div class="card"><div class="pdiag">${DRAW_SVGS.exploded}</div><h3>Exploded views</h3><p class="small">Parts drawn separated along the lines they move to assemble – shows how a product fits together (great for KD furniture and joints).</p></div>
<div class="card"><div class="pdiag">${DRAW_SVGS.section}</div><h3>Sectional views</h3><p class="small">An imaginary cut through the object shows inside detail. Cut surfaces are hatched at 45°; adjacent parts in opposite directions.</p></div></div>
<div class="tip"><p><b>Crating:</b> start by drawing a light box (crate) the size of the object, then "carve" the shape out of it. This keeps proportions correct – try the Box tool in the Sketch Studio.</p></div>
<h2 id="orthoS" class="sec">Orthographic projection</h2>
<div class="grid g2"><div class="card"><div class="pdiag">${DRAW_SVGS.ortho}</div></div>
<div class="card"><p><b>Third angle</b> (used by Cambridge in most questions): <b>plan above</b> the front elevation; the view from the <b>right</b> is drawn on the <b>right</b>.</p><p><b>First angle</b>: plan <b>below</b> the front elevation; the view from the left is drawn on the right.</p><p>Views line up with thin projection lines. Show the projection symbol. Scale written as e.g. 1:2 (half size), 2:1 (twice size).</p><a class="btn sm" href="#projection">Try it in the Projection Lab →</a></div></div>
<h2 id="lt" class="sec">Line types &amp; dimensioning</h2>
<div class="grid g2"><div class="card"><div class="pdiag">${DRAW_SVGS.lines}</div></div><div class="card"><div class="pdiag">${DRAW_SVGS.dims}</div><ul class="small"><li>All dimensions in <b>mm</b> – don't write "mm" after every number.</li><li>Projection lines leave a small gap from the object; arrowheads touch them.</li><li>Numbers sit above the dimension line, read from the bottom or right.</li><li><b>Ø</b> = diameter, <b>R</b> = radius. Don't dimension the same feature twice.</li></ul></div></div>
<h2 id="rend" class="sec">Rendering</h2>
<div class="grid g2"><div class="card"><div class="pdiag">${DRAW_SVGS.render}</div></div><div class="card"><ul class="small"><li><b>Tone:</b> pick a light source – top faces lightest, faces away darkest (3 tones).</li><li><b>Thick &amp; thin lines:</b> thick line where you can only see one surface (outer edges); thin where you see both surfaces.</li><li><b>Wood:</b> base colour + darker grain lines following the form; end grain shows rings.</li><li><b>Metal:</b> strong contrast, sharp white highlights, streaks along the form.</li><li><b>Acrylic/transparent:</b> show edges darker, diagonal white reflection lines, see-through detail.</li><li>Cylinders: lightest band a third of the way across, darkest at the edges.</li></ul></div></div>
<h2 id="ann" class="sec">Annotation &amp; modelling</h2>
<div class="card"><p><b>Annotate</b> sketches with notes explaining function, materials, sizes, construction, ergonomics and how they meet the specification – not just labels. Arrows should point at the feature.</p><p><b>Modelling</b> tests ideas before making: card, foam board, Styrofoam, MDF, polymorph, 3D prints and CAD models. Mock-ups test size and ergonomics with real users; CAD models can be rendered, tested (stress analysis) and sent directly to CAM.</p></div>`};

/* ---------------- CAD/CAM & production ---------------- */
PAGES.cadcam = {t:'CAD/CAM & manufacture',html:()=>`
${head('Paper 1 · Use of technology','CAD/CAM, CNC & quality','How computers are used to design, make and control the quality of products – from one-offs to mass production.')}
${toc([['cad','CAD'],['cam','CAM & CNC'],['aids','Jigs, templates & moulds'],['qc','Quality & stock control'],['tol','Tolerance checker']])}
<h2 id="cad" class="sec">CAD – computer-aided design</h2>
<div class="grid g2"><div class="card"><h4>Advantages</h4><ul class="small"><li>Very accurate drawings; easy to edit and copy</li><li>2D drawings and 3D models; photo-realistic rendering</li><li>Test virtually (stress, fit, movement) before making</li><li>Libraries of standard components</li><li>Files emailed instantly to clients/factories anywhere</li><li>Links directly to CAM machines</li></ul></div>
<div class="card"><h4>Disadvantages</h4><ul class="small"><li>Software and hardware are expensive</li><li>Training needed; takes time to learn</li><li>Files can be corrupted, lost or hacked</li><li>Can limit creativity compared with freehand sketching</li></ul></div></div>
<p class="small"><b>2D CAD</b> (e.g. 2D Design, Inkscape) produces flat drawings for laser cutting and working drawings. <b>3D CAD</b> (e.g. Fusion 360, SolidWorks, Onshape) builds solid models by sketching then extruding, revolving or lofting.</p>
<h2 id="cam" class="sec">CAM &amp; CNC machines</h2>
<div class="grid g3">${[['Laser cutter','Cuts and engraves sheet materials (acrylic, MDF, plywood, card). Vector = cut, raster = engrave. Needs fume extraction. Never PVC.'],['CNC router','Spinning cutter moves in X, Y, Z – 2.5D and 3D shapes in wood, MDF, plastics, foam.'],['CNC milling machine','Like a router but rigid – for metals.'],['CNC lathe','Automatic turning of round parts.'],['3D printer','Additive – builds layers of PLA/ABS. Complex shapes, little waste, slow.'],['Vinyl cutter / engraver','Cuts self-adhesive vinyl; engravers mark signs and plates.']].map(([a,b])=>`<div class="card" style="padding:12px"><b>${a}</b><p class="small muted" style="margin:3px 0 0">${b}</p></div>`).join('')}</div>
<div class="grid g2" style="margin-top:12px"><div class="card"><h4>CAM advantages</h4><ul class="small"><li>Accuracy and repeatability – every part identical</li><li>Fast; can run 24/7 with little supervision</li><li>Complex shapes that are hard by hand</li><li>Less waste (nesting parts on the sheet)</li><li>Safer – less contact with cutters</li></ul></div><div class="card"><h4>CAM disadvantages</h4><ul class="small"><li>High initial cost and maintenance</li><li>Skilled programmers needed</li><li>Fewer manual jobs (de-skilling)</li><li>Breakdown can stop production</li></ul></div></div>
<div class="tip"><p><b>One-off:</b> CAD/CAM allows fast prototypes and personalised products. <b>Batch/mass:</b> the same CAD file is used again and again for consistent quality.</p></div>
<h2 id="aids" class="sec">Production aids: jigs, templates, moulds, formers</h2>
<div class="grid g4">${[['Jig','Holds work and guides the tool – e.g. a drilling jig puts every hole in the same place; bending jig for acrylic.'],['Template','Shape drawn round to mark out identical parts quickly.'],['Mould','Gives shape to material: vacuum forming moulds, injection moulds, sand casting patterns.'],['Former','Material is bent/laminated around it.'],['Fixture','Holds work on a machine (machine vice, clamps).']].map(([a,b])=>`<div class="card" style="padding:12px"><b>${a}</b><p class="small muted" style="margin:3px 0 0">${b}</p></div>`).join('')}</div>
<p class="small">They save time, improve accuracy and consistency, reduce the need for skilled workers and make batch production possible.</p>
<h2 id="qc" class="sec">Quality &amp; stock control</h2>
<div class="grid g2"><div class="card"><h4>Quality control (QC)</h4><p class="small">Inspection and testing at stages during manufacture: measuring with vernier/micrometer, go/no-go gauges, visual checks, sampling (testing 1 in every 100). Computers and sensors can check every item automatically.</p><h4>Quality assurance (QA)</h4><p class="small">The overall system that guarantees quality at every stage – training, standards (e.g. ISO 9001), procedures and records.</p></div>
<div class="card"><h4>Stock control</h4><p class="small">Computers track materials and components using barcodes and RFID. <b>Just-in-time (JIT)</b>: materials arrive exactly when needed – less storage space, money and waste, but a late delivery stops production.</p><p class="small">Computers also order stock automatically when it falls below a set level.</p></div></div>
<h2 id="tol" class="sec">Tolerance checker</h2>
<div class="card">${lab('Is it within tolerance?')}
<div class="ctrl"><label>Nominal (mm)</label><input type="number" id="tlN" value="50" step="0.1" style="width:90px"><label>± tolerance</label><input type="number" id="tlT" value="0.5" step="0.05" style="width:80px"><label>Measured</label><input type="number" id="tlM" value="50.3" step="0.01" style="width:90px"></div>
<svg id="tlSvg" viewBox="0 0 400 70" style="width:100%;height:auto"></svg><div id="tlRes" class="res"></div></div>`,
init(){const upd=()=>{const n=+tlN.value,t=Math.abs(+tlT.value),m=+tlM.value;const lo=n-t,hi=n+t;const ok=m>=lo&&m<=hi;const range=Math.max(t*3,Math.abs(m-n)*1.3,0.01);const X=v=>200+(v-n)/range*170;
  tlSvg.innerHTML=`<rect x="${X(lo)}" y="22" width="${X(hi)-X(lo)}" height="22" fill="#e5f5eb" stroke="#1d8a4a"/><line x1="20" y1="33" x2="380" y2="33" stroke="#9aa6b5"/><line x1="${X(n)}" y1="16" x2="${X(n)}" y2="50" stroke="#0f1b2d" stroke-dasharray="3 2"/><text x="${X(lo)}" y="64" font-size="11" text-anchor="middle">${lo.toFixed(2)}</text><text x="${X(hi)}" y="64" font-size="11" text-anchor="middle">${hi.toFixed(2)}</text><circle cx="${Math.max(10,Math.min(390,X(m)))}" cy="33" r="7" fill="${ok?'#1d8a4a':'#d23a3a'}"/><text x="${Math.max(30,Math.min(370,X(m)))}" y="12" font-size="11" text-anchor="middle" font-weight="700">${m}</text>`;
  tlRes.className='res '+(ok?'ok':'no');tlRes.textContent=ok?`✓ Accept – ${m} mm is between ${lo.toFixed(2)} and ${hi.toFixed(2)} mm.`:`✗ Reject – outside the limits of ${lo.toFixed(2)}–${hi.toFixed(2)} mm.`;};
  ['tlN','tlT','tlM'].forEach(i=>document.getElementById(i).addEventListener('input',upd));upd();}};

/* ---------------- SAFETY ---------------- */
function signSVG(type){
  if(type==='pro')return `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="#fff" stroke="#d23a3a" stroke-width="7"/><path d="M24 22 h10 a6 6 0 0 1 0 12 h-6 v10 M22 44 h14" stroke="#0f1b2d" stroke-width="3" fill="none"/><line x1="14" y1="14" x2="50" y2="50" stroke="#d23a3a" stroke-width="7"/></svg>`;
  if(type==='man')return `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="#1f5fc4"/><path d="M14 30 Q14 24 22 24 L42 24 Q50 24 50 30 L50 34 Q50 40 42 40 L38 40 L34 34 L30 34 L26 40 L22 40 Q14 40 14 34 Z" fill="#fff"/></svg>`;
  if(type==='war')return `<svg viewBox="0 0 64 64"><path d="M32 6 L60 56 L4 56 Z" fill="#f5c400" stroke="#0f1b2d" stroke-width="4" stroke-linejoin="round"/><rect x="29" y="22" width="6" height="20" fill="#0f1b2d"/><rect x="29" y="46" width="6" height="6" fill="#0f1b2d"/></svg>`;
  if(type==='safe')return `<svg viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="3" fill="#1d8a4a"/><rect x="26" y="14" width="12" height="36" fill="#fff"/><rect x="14" y="26" width="36" height="12" fill="#fff"/></svg>`;
  return `<svg viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="3" fill="#d23a3a"/><rect x="26" y="20" width="12" height="32" rx="4" fill="#fff"/><path d="M30 20 L30 12 L42 12" stroke="#fff" stroke-width="4" fill="none"/></svg>`;}
PAGES.safety = {t:'Health & safety',html:()=>`
${head('Paper 1 · Health & safety','Health & safety','Safe use of tools and machines, protective equipment, safety signs and a designer\'s responsibility for safe products.')}
${toc([['signs','Safety signs'],['rules','Workshop rules'],['ppe','PPE'],['hz','Hazards by process'],['risk','Risk assessment'],['prod','Product safety']])}
<h2 id="signs" class="sec">Safety signs</h2>
<div class="grid g4">${[['pro','Prohibition','Red circle with diagonal bar – you must NOT (e.g. no eating).'],['man','Mandatory','Blue circle – you MUST (e.g. wear eye protection).'],['war','Warning','Yellow triangle, black border – hazard (e.g. hot surface, electricity).'],['safe','Safe condition','Green square – first aid, emergency exit, eye wash.'],['fire','Fire equipment','Red square – fire extinguisher, fire alarm.']].map(([k,t,d])=>`<div class="card center" style="padding:12px"><div style="width:72px;margin:auto">${signSVG(k)}</div><b>${t}</b><p class="small muted" style="margin:3px 0 0">${d}</p></div>`).join('')}</div>
<h2 id="rules" class="sec">Workshop rules</h2>
<div class="grid g2"><div class="card"><ul class="small"><li>Tie back long hair; tuck in ties and loose clothing; wear an apron and sensible shoes.</li><li>Never use a machine without training and permission.</li><li>Know where the <b>emergency stop</b> buttons are.</li><li>Use guards and adjust them correctly; remove chuck keys before switching on.</li><li>Clamp work – never hold small items by hand on the pillar drill.</li></ul></div><div class="card"><ul class="small"><li>Carry tools pointing down; never run.</li><li>Keep the floor and benches clear; sweep up swarf with a brush, never hands.</li><li>Report all accidents and damaged equipment.</li><li>Only one person operates a machine; wait for it to stop before clearing it.</li><li>Use extraction for dust and fumes.</li></ul></div></div>
<h2 id="ppe" class="sec">Personal protective equipment (PPE)</h2>
<div class="grid g4">${[['Goggles / visor','Flying chips, swarf, dust, splashes. Visor for wood turning and casting.'],['Apron','Protects clothing; leather apron for hot work and casting.'],['Gloves','Heat-resistant gauntlets for casting/brazing; chemical gloves for resins. NEVER on rotating machines.'],['Dust mask','MDF dust, sanding, resin powders.'],['Ear defenders','Noisy machines – planers, routers.'],['Welding mask','Dark filter protects eyes from intense UV light.'],['Safety boots','Heavy items, molten metal.']].map(([a,b])=>`<div class="card" style="padding:12px"><b>${a}</b><p class="small muted" style="margin:3px 0 0">${b}</p></div>`).join('')}</div>
<h2 id="hz" class="sec">Hazards by process</h2>
<div class="tw"><table class="t"><tr><th>Process / machine</th><th>Hazard</th><th>Control measure</th></tr>
<tr><td>Pillar drill</td><td>Work spinning, entanglement</td><td>Machine vice/clamp, guard down, hair tied back, remove chuck key</td></tr>
<tr><td>Lathes</td><td>Entanglement, flying swarf</td><td>Guards, visor, remove chuck key, tool rest close (wood)</td></tr>
<tr><td>Sanders / grinders</td><td>Dust, abrasion of fingers</td><td>Extraction, goggles, use downward side of disc, keep fingers back</td></tr>
<tr><td>Laser cutter</td><td>Fire, toxic fumes</td><td>Never leave unattended, extraction on, never cut PVC</td></tr>
<tr><td>Casting</td><td>Burns, molten splashes, steam explosions</td><td>Full PPE (visor, leather apron, gauntlets, boots), dry sand & preheated tools</td></tr>
<tr><td>Brazing / soldering</td><td>Burns, fumes</td><td>Heat-resistant mat, tongs, ventilation, goggles</td></tr>
<tr><td>Adhesives & finishes</td><td>Toxic or flammable fumes, skin irritation</td><td>Ventilation, gloves, no naked flames, follow COSHH data</td></tr>
<tr><td>Vacuum former / strip heater</td><td>Burns from heater and hot plastic</td><td>Don't touch elements, use gloves when handling hot plastic</td></tr></table></div>
<h2 id="risk" class="sec">Risk assessment</h2>
<div class="card"><ol class="small"><li>Identify the <b>hazard</b> (anything that could cause harm).</li><li>Decide who might be harmed and how.</li><li>Evaluate the <b>risk</b> (likelihood × severity).</li><li>Decide <b>control measures</b> to reduce the risk.</li><li>Record, and review regularly.</li></ol><p class="small"><b>COSHH</b> (Control of Substances Hazardous to Health) – rules for storing and using hazardous substances such as solvents, resins and finishes.</p></div>
<h2 id="prod" class="sec">Designers' responsibility for product safety</h2>
<div class="card"><ul class="small"><li>No sharp edges or corners; no finger traps or small parts for young children (choking).</li><li>Stable – won't tip over; strong enough for the load (with a safety margin).</li><li>Non-toxic finishes and materials (especially toys and food products).</li><li>Electrical safety: insulation, earthing, fuses.</li><li>Clear instructions and warning labels; meet safety standards (e.g. CE / UKCA marks, BSI Kitemark, toy safety standards).</li></ul></div>`};

/* ================= PAGES (part 2): Resistant Materials ================= */
PAGES.materials = {t:'Materials',html:()=>`
${head('Paper 3 · Resistant Materials','Materials: woods, metals, plastics, smart & composites','Know the properties AND working properties of each material and match them to uses – the most examined area of Paper 3.')}
${toc([['explore','Material explorer'],['props','Property words'],['woods','Woods'],['season','Conversion & seasoning'],['boards','Manufactured boards'],['metals','Metals'],['plastics','Plastics'],['smart','Smart & composites'],['market','Market forms']])}
<h2 id="explore" class="sec">Material explorer</h2>
<div class="card">${lab('Explore '+MATERIALS.length+' materials','tap a card for full notes')}
<div class="chips" id="mxCats"></div><input type="text" id="mxQ" placeholder="Search e.g. outdoor, gears, food safe…" style="width:100%;margin-bottom:10px">
<div class="grid g3" id="mxGrid"></div></div>
<h2 id="props" class="sec">Property words you must use</h2>
<div class="grid g4">${[['Hardness','resists scratches, wear and dents'],['Toughness','absorbs impact without breaking'],['Strength','resists forces: tensile (pulling), compressive (squashing), shear, bending, torsion'],['Brittleness','snaps without bending'],['Malleability','can be hammered/pressed into shape'],['Ductility','can be drawn/stretched into wire'],['Elasticity','returns to shape when the force is removed'],['Durability','withstands wear, weather and decay'],['Conductivity','passes heat/electricity'],['Density','mass per volume – "lightweight"'],['Corrosion resistance','does not rust or degrade'],['Working properties','how easy it is to cut, shape, join and finish']].map(([a,b])=>`<div class="card" style="padding:12px"><b>${a}</b><p class="small muted" style="margin:3px 0 0">${b}</p></div>`).join('')}</div>
<h2 id="woods" class="sec">Woods</h2>
<div class="grid g2"><div class="card"><h4>Hardwoods</h4><p class="small">From <b>deciduous</b>, broad-leaved trees (lose leaves in autumn) – plus tropical evergreens. Slow growing, so usually more expensive; generally harder, more durable and attractive grain. Seeds in a fruit/nut.</p><p class="small"><b>Examples:</b> oak, beech, ash, mahogany, teak, jelutong, balsa, walnut.</p></div>
<div class="card"><h4>Softwoods</h4><p class="small">From <b>coniferous</b> trees with needles and cones (mostly evergreen). Fast growing (≈30 years), so cheaper and more sustainable; straight trunks, often knotty and resinous.</p><p class="small"><b>Examples:</b> Scots pine, spruce, western red cedar, parana pine, larch.</p></div></div>
<div class="tip"><p>"Hardwood" and "softwood" describe the <b>type of tree</b>, not hardness – balsa is a hardwood; yew is a softwood but very hard.</p></div>
<h2 id="season" class="sec">Conversion &amp; seasoning</h2>
<div class="card">${lab('Conversion of a log')}
<div class="seg" id="cvSeg"><button class="on" data-v="plain">Through & through (plain sawn)</button><button data-v="quarter">Quarter sawn</button></div>
<div class="grid g2" style="margin-top:10px;align-items:center"><svg id="cvSvg" viewBox="0 0 220 220" style="max-width:260px;margin:auto;display:block"></svg><div id="cvTxt" class="small"></div></div></div>
<div class="grid g2"><div class="card"><h4>Air seasoning</h4><ul class="small"><li>Planks stacked with <b>stickers</b> (spacers) under a roof, open sides for air flow, raised off the ground, ends painted to slow drying.</li><li>Slow – about <b>1 year per 25 mm</b> thickness.</li><li>Cheap, little energy; MC only down to ≈15–20% (outdoor use).</li></ul></div>
<div class="card"><h4>Kiln seasoning</h4><ul class="small"><li>Timber stacked in a kiln; <b>steam then hot air</b> with controlled temperature and humidity.</li><li>Fast – days to weeks.</li><li>MC down to ≈6–12% for centrally heated interiors; kills insects/fungi; expensive (energy).</li></ul></div></div>
<p class="small"><b>Why season?</b> Freshly felled ("green") timber can be over 50% water. Seasoning makes it stronger, more stable (less shrinking, warping, splitting), lighter, and resistant to rot – and it can then be glued and finished. <b>Defects</b> if seasoned badly: warping (cupping, bowing, twisting), splits/checks, shakes; knots are natural defects. <b>Storage:</b> stack timber flat on racks supported along its length in a dry, ventilated place; store sheet boards flat or on edge in a rack to stop bending.</p>
<h3>Steam bending &amp; laminating</h3><p class="small">See <a href="#processes">Shaping processes</a> – steaming softens lignin so solid ash/beech can be bent around a former; lamination glues thin veneers in a former for strong, stable curves.</p>
<h2 id="boards" class="sec">Manufactured boards vs solid timber</h2>
<div class="grid g2"><div class="card"><h4>✓ Advantages</h4><ul class="small"><li>Available in large sheets (2440 × 1220 mm)</li><li>Stable – don't warp, shrink or twist</li><li>Uniform quality; no knots or defects</li><li>Cheaper; use waste wood and fast-growing timber</li><li>Can be veneered or laminated to look like expensive wood</li></ul></div>
<div class="card"><h4>✗ Disadvantages</h4><ul class="small"><li>Edges are unattractive/fragile – need lipping or edging tape</li><li>Most are damaged by water (except exterior/marine grades)</li><li>Adhesives contain formaldehyde; dust is harmful</li><li>Blunt tools; chipboard has poor screw holding</li><li>Can't be carved or shaped like solid wood</li></ul></div></div>
<h2 id="metals" class="sec">Metals</h2>
<div class="grid g3"><div class="card"><h4>Ferrous</h4><p class="small">Contain <b>iron</b>; most are magnetic and rust (except stainless steel). Cast iron, mild steel, medium/high carbon steel, stainless steel, HSS.</p></div><div class="card"><h4>Non-ferrous</h4><p class="small">Contain <b>no iron</b>; not magnetic; resist corrosion. Aluminium, copper, zinc, lead, tin (and their alloys).</p></div><div class="card"><h4>Alloys</h4><p class="small">A metal mixed with other elements to improve properties. Brass (Cu+Zn), bronze (Cu+Sn), duralumin (Al+Cu+Mg+Mn), stainless steel (Fe+Cr+Ni), solder.</p></div></div>
<div class="tw"><table class="t"><tr><th>Steel</th><th>Carbon</th><th>Properties</th><th>Uses</th></tr><tr><td>Mild steel</td><td>0.15–0.35%</td><td>Tough, ductile, can't be hardened</td><td>Nuts, bolts, car bodies, girders</td></tr><tr><td>Medium carbon</td><td>0.35–0.7%</td><td>Stronger and harder than mild steel</td><td>Springs, garden tools, rails</td></tr><tr><td>High carbon (tool)</td><td>0.7–1.4%</td><td>Very hard; can be hardened &amp; tempered</td><td>Chisels, files, saw blades, screwdrivers</td></tr><tr><td>Cast iron</td><td>2–4%</td><td>Hard skin, brittle, strong in compression</td><td>Vices, machine beds, manhole covers</td></tr></table></div>
<h2 id="plastics" class="sec">Plastics</h2>
<div class="grid g2"><div class="card"><svg viewBox="0 0 220 110" style="width:100%"><g stroke="#2b8fd6" stroke-width="3" fill="none"><path d="M10 20 Q40 5 70 25 T130 20 T210 30"/><path d="M10 50 Q50 40 80 60 T150 50 T210 60"/><path d="M10 85 Q40 70 90 90 T160 80 T210 95"/></g></svg><h4>Thermoplastics</h4><p class="small">Long polymer chains with weak forces between them and <b>no cross-links</b>. Soften when heated, can be re-shaped many times (plastic memory) and recycled. Processes: vacuum forming, line bending, injection & blow moulding, extrusion.</p></div>
<div class="card"><svg viewBox="0 0 220 110" style="width:100%"><g stroke="#6a3fd1" stroke-width="3" fill="none"><path d="M10 20 Q40 5 70 25 T130 20 T210 30"/><path d="M10 50 Q50 40 80 60 T150 50 T210 60"/><path d="M10 85 Q40 70 90 90 T160 80 T210 95"/></g><g stroke="#d23a3a" stroke-width="3"><line x1="40" y1="17" x2="40" y2="47"/><line x1="100" y1="22" x2="100" y2="55"/><line x1="170" y1="25" x2="170" y2="58"/><line x1="65" y1="55" x2="65" y2="82"/><line x1="135" y1="52" x2="135" y2="85"/></g></svg><h4>Thermosetting plastics</h4><p class="small">Chains are joined by strong <b>cross-links</b> when they set. Cannot be softened or reshaped – they char/burn if overheated. Hard, rigid, heat resistant; good insulators. Not recyclable in the normal way. Compression moulding, casting resins.</p></div></div>
<p class="small">Plastics come mostly from crude oil (finite). Bioplastics such as PLA are made from plant starch and can biodegrade under industrial composting.</p>
<h2 id="smart" class="sec">Smart, modern &amp; composite materials</h2>
<div class="key"><p><b>Smart material:</b> its properties change reversibly in response to a change in its environment (temperature, light, stress). <b>Composite:</b> two or more materials combined (usually fibres in a resin matrix) to give better properties than each alone.</p></div>
<p class="small">Find thermochromic materials, polymorph, SMA, shape memory polymer, GRP, CFRP and Kevlar in the explorer above (filter "Smart & composites").</p>
<h2 id="market" class="sec">Market forms, types &amp; sizes</h2>
<div class="grid g4" id="mfGrid"></div>
<div class="tip"><p>Specify stock like a professional: "<b>PAR</b> pine 20 × 45 mm" (planed all round), "<b>MDF</b> 2440 × 1220 × 12 mm", "<b>bright drawn mild steel</b> round bar Ø10 mm × 1 m", "<b>3 mm cast acrylic</b> sheet 600 × 400". Sizes are usually length × width × thickness in mm.</p></div>`,
init(){
  const grps=['All','Woods','Metals','Plastics','Smart & composites'];let cur='All';
  const draw=()=>{const q=mxQ.value.toLowerCase().trim();const list=MATERIALS.filter(m=>(cur==='All'||MATCATS[m.cat].grp===cur)&&(!q||(m.name+' '+m.props.join(' ')+' '+m.uses+' '+m.work+' '+MATCATS[m.cat].label).toLowerCase().includes(q)));
    mxGrid.innerHTML=list.map(m=>`<div class="mcard" data-id="${m.id}"><div class="sw">${swatch(m)}</div><div class="bd"><span class="pill ${MATCATS[m.cat].pill}">${MATCATS[m.cat].label}</span><h4>${m.name}</h4><p>${m.uses}</p></div></div>`).join('')||'<p class="muted">No matches.</p>';};
  mxCats.innerHTML=grps.map(g=>`<button class="chip ${g==='All'?'on':''}" data-g="${g}">${g}</button>`).join('');
  mxCats.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cur=b.dataset.g;mxCats.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));draw();};
  mxQ.oninput=draw; mxGrid.onclick=e=>{const c=e.target.closest('.mcard');if(c)showMaterial(c.dataset.id);}; draw();
  // conversion
  const cv=v=>{let g=`<circle cx="110" cy="110" r="100" fill="#d9b688" stroke="#7a4b14" stroke-width="4"/>${[80,60,40,20].map(r=>`<circle cx="110" cy="110" r="${r}" fill="none" stroke="#b98a4e" stroke-width="1.5"/>`).join('')}<circle cx="110" cy="110" r="5" fill="#7a4b14"/>`;
    if(v==='plain'){for(let i=1;i<8;i++){const y=10+i*25;g+=`<line x1="5" y1="${y}" x2="215" y2="${y}" stroke="#1747d1" stroke-width="2.5"/>`;}
      cvTxt.innerHTML='<p><b>Through and through (plain sawn):</b> parallel cuts straight through the log.</p><ul><li>✓ Quick, cheap, very little waste</li><li>✓ Wide boards</li><li>✗ Boards are prone to <b>cupping</b> (warping) as they dry because the growth rings run across the board</li></ul>';}
    else{g+=`<line x1="10" y1="110" x2="210" y2="110" stroke="#1747d1" stroke-width="3"/><line x1="110" y1="10" x2="110" y2="210" stroke="#1747d1" stroke-width="3"/>`;[[1,1],[1,-1],[-1,1],[-1,-1]].forEach(([sx,sy])=>{for(let i=1;i<4;i++){const d=i*24;g+=`<line x1="${110+sx*d}" y1="110" x2="${110+sx*d}" y2="${110+sy*Math.sqrt(10000-d*d)*.95}" stroke="#1747d1" stroke-width="2"/>`;}});
      cvTxt.innerHTML='<p><b>Quarter sawn:</b> the log is quartered, then cut roughly at right angles to the growth rings.</p><ul><li>✓ Much more <b>stable</b> – less warping and shrinking</li><li>✓ Shows attractive figure (silver grain/medullary rays in oak)</li><li>✗ More waste and more expensive; narrower boards</li></ul>';}
    cvSvg.innerHTML=g;};
  cvSeg.onclick=e=>{const b=e.target.closest('button');if(!b)return;cvSeg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));cv(b.dataset.v);};cv('plain');
  // market forms

/* ---------------- HEAT TREATMENT ---------------- */
PAGES.heat = {t:'Heat treatment',html:()=>`
${head('Paper 3 · Metals','Heat treatment & changing metal structure','How heating and cooling change the internal grain structure of metals – making them softer, harder or tougher.')}
${toc([['wh','Work hardening'],['ann','Annealing'],['hard','Hardening & tempering'],['tlab','Tempering lab'],['case','Case hardening']])}
<h2 id="wh" class="sec">Work hardening</h2>
<div class="card"><p>When a metal is bent, hammered or rolled <b>cold</b>, its grain structure is distorted and it becomes <b>harder and more brittle</b>. Keep bending a paper clip and it snaps. Copper and aluminium work-harden quickly when beaten into bowls – so they must be <b>annealed</b> regularly during shaping.</p></div>
<h2 id="ann" class="sec">Annealing – to soften</h2>
<div class="tw"><table class="t"><tr><th>Metal</th><th>How to anneal</th></tr>
<tr><td><b>Steel</b></td><td>Heat to cherry red (≈725–900 °C), then cool <b>very slowly</b> – e.g. buried in sand/ash or left in the switched-off furnace.</td></tr>
<tr><td><b>Copper</b></td><td>Heat to a dull red, then quench in water or leave to cool in air.</td></tr>
<tr><td><b>Brass</b></td><td>Heat to a dull red and allow to cool slowly in air.</td></tr>
<tr><td><b>Aluminium</b></td><td>Rub soap on the surface and heat gently until the soap turns black (≈350–400 °C) – aluminium doesn't glow before melting! Cool in air.</td></tr></table></div>
<div class="key"><p><b>Annealing</b> relieves internal stresses and makes metal softer and more ductile, so it can be worked further without cracking.</p></div>
<h2 id="hard" class="sec">Hardening &amp; tempering (high carbon / tool steel)</h2>
<div class="grid g2"><div class="card"><h4>1 · Hardening</h4><p class="small">Heat the tool steel to cherry red (≈800 °C) then <b>quench</b> rapidly in water or oil. It becomes very hard but too <b>brittle</b> to use – it would shatter.</p></div><div class="card"><h4>2 · Tempering</h4><p class="small">Clean the hardened steel bright with emery cloth. Reheat gently away from the cutting edge and watch the <b>oxide colours</b> travel along. When the right colour reaches the tip, quench. This removes brittleness and adds <b>toughness</b>, while keeping enough hardness.</p></div></div>
<div class="tip"><p>Mild steel can NOT be hardened this way (too little carbon). Only steels with roughly 0.4%+ carbon (medium/high carbon) respond.</p></div>
<h2 id="tlab" class="sec">Tempering colour lab</h2>
<div class="card">${lab('Slide the temperature')}
<input type="range" id="tpR" min="220" max="310" value="230" style="width:100%"><div class="chisel"><svg id="tpSvg" viewBox="0 0 600 120"></svg></div>
<div class="grid g2" style="align-items:center"><div><div style="font-family:Outfit;font-size:2rem;font-weight:800" id="tpT"></div><div id="tpC" style="font-weight:700"></div></div><div id="tpTools" class="small"></div></div>
<div class="tw"><table class="t" id="tpTab"></table></div><p class="small muted">Temperatures vary slightly between textbooks – learn the order: straw (hardest) → brown → purple → blue (toughest).</p></div>
<h2 id="case" class="sec">Case hardening (mild steel)</h2>
<div class="card"><ol class="small"><li>Heat the mild steel to red heat.</li><li>Dip/roll it in a carbon-rich powder (e.g. "Casenit") so carbon is absorbed into the surface.</li><li>Repeat the heating and dipping several times to build up a deeper carbon "case".</li><li>Reheat to red and quench in cold water.</li></ol><p class="small">Result: a <b>hard, wear-resistant outer skin</b> with a <b>tough, ductile core</b>. Used for gears, cams, bearing pins, vice jaws, hammer heads.</p></div>
<div class="warn"><p>Use tongs, heat-resistant gloves, a visor and leather apron. Quench away from your body – hot water and oil splash. Work on a brazing hearth with good ventilation.</p></div>`,
init(){
  tpTab.innerHTML='<tr><th>°C</th><th>Colour</th><th>Tools</th></tr>'+TEMPER.map(t=>`<tr><td>${t.t}</td><td><span style="display:inline-block;width:14px;height:14px;border-radius:4px;background:${t.hex};vertical-align:-2px;margin-right:6px;border:1px solid #0002"></span>${t.c}</td><td>${t.tools}</td></tr>`).join('');
  const upd=()=>{const T=+tpR.value;let i=TEMPER.findIndex(t=>t.t>=T);if(i<0)i=TEMPER.length-1;if(i>0&&Math.abs(TEMPER[i-1].t-T)<Math.abs(TEMPER[i].t-T))i--;const cur=TEMPER[i];
    tpT.textContent=T+' °C';tpC.innerHTML=`<span style="color:${cur.hex};text-shadow:0 0 1px #0006">■</span> ${cur.c}`;tpTools.innerHTML='<b>Suitable for:</b> '+cur.tools;
    // chisel: colour bands travel from heat point toward tip as T rises
    const seq=TEMPER.slice(i).reverse(); // hottest (near heat) ... current colour at the tip
    const stops=seq.map((t,j)=>`<stop offset="${(0.3+0.7*(seq.length>1?j/(seq.length-1):1)).toFixed(2)}" stop-color="${t.hex}"/>`).join('');
    tpSvg.innerHTML=`<defs><linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#3a4a6a"/><stop offset=".22" stop-color="#5a6a8a"/>${stops}</linearGradient></defs>
    <rect x="20" y="40" width="160" height="40" rx="10" fill="#c58c52" stroke="#2b3644" stroke-width="2"/>
    <path d="M180 47 L560 47 L590 60 L560 73 L180 73 Z" fill="url(#tg)" stroke="#2b3644" stroke-width="2"/>
    <path d="M250 100 Q260 82 270 100 Q280 82 290 100" stroke="#ff7a45" stroke-width="4" fill="none"/><text x="236" y="116" font-size="12" fill="#3b4a60">heat applied here</text><text x="596" y="30" font-size="12" text-anchor="end" fill="#3b4a60">quench when the tip turns ${cur.c.toLowerCase()} →</text>`;};
  tpR.oninput=upd;upd();}};

PAGES.tools = {t:'Tools & measuring',html:()=>`
${head('Paper 3 · Tools','Tools, equipment & measuring','Name the right tool for the material and the job – exam answers need the <b>specific</b> tool name.')}
${toc([['t3d','3D workshop'],['tg','Tool gallery'],['vern','Vernier simulator'],['holes','Hole types'],['lathe','Lathe operations'],['datum','Datums & holding work']])}
<h2 id="t3d" class="sec">3D tool workshop</h2>
${workshopHTML('tw','Pick up a tool','turn it round, zoom in and use it')}
<h2 id="tg" class="sec">Tool gallery</h2>
<div class="card">${lab(TOOLS.length+' tools & machines','tap a tool to load it in 3D')}<div class="chips" id="tgCats"></div><div class="grid g4" id="tgGrid"></div></div>
<h2 id="vern" class="sec">Vernier caliper simulator</h2>
<div class="card">${lab('Read the vernier','10-division vernier – reads to 0.1 mm')}
<div class="vern"><svg id="vnSvg" viewBox="0 0 640 170"></svg></div>
<div class="seg" id="vnMode" style="margin:6px 0"><button class="on" data-m="test">Test me</button><button data-m="explore">Explore (slider)</button></div>
<div id="vnTest" class="ctrl"><label>Your reading (mm)</label><input type="number" step="0.1" id="vnIn" style="width:110px"><button class="btn sm" id="vnChk">Check</button><button class="btn ghost sm" id="vnNew">New reading</button></div>
<div id="vnExp" class="ctrl" style="display:none"><input type="range" id="vnR" min="0" max="80" step="0.1" value="23.4" style="flex:1"></div>
<div id="vnRes" class="small"></div>
<div class="note"><p><b>How to read:</b> (1) Read the main scale (mm) just to the LEFT of the vernier zero. (2) Find the vernier line that lines up exactly with a main scale line. (3) Add: main reading + (vernier line × 0.1). Real verniers often have 50 divisions and read to 0.02 mm – the method is the same.</p></div></div>
<h2 id="holes" class="sec">Hole types (screw holes)</h2>
<div class="card">${lab('Hole types in section')}<div class="seg" id="hlSeg">${['Pilot','Clearance','Countersunk','Counterbored','Tapped'].map((h,i)=>`<button class="${i?'':'on'}" data-h="${i}">${h}</button>`).join('')}</div>
<div class="grid g2" style="margin-top:10px;align-items:center"><svg id="hlSvg" viewBox="0 0 260 180" style="width:100%;max-width:340px"></svg><div id="hlTxt" class="small"></div></div></div>
<h2 id="lathe" class="sec">Centre lathe operations</h2>
<div class="grid g3">${[['Facing off','Tool moves across the end of the bar to make it flat and square.'],['Parallel turning','Tool moves along the bar to reduce its diameter evenly.'],['Taper turning','Compound slide set at an angle to produce a cone.'],['Drilling','Drill in the tailstock chuck, after a centre drill.'],['Knurling','Knurling tool presses a diamond pattern into the surface for grip.'],['Parting off','Narrow tool cuts the finished part off the bar.'],['Chamfering','Removes sharp edges at 45°.'],['Screw cutting','Lead screw moves the tool to cut a thread.']].map(([a,b])=>`<div class="card" style="padding:12px"><b>${a}</b><p class="small muted" style="margin:3px 0 0">${b}</p></div>`).join('')}</div>
<p class="small"><b>Work holding:</b> 3-jaw self-centring chuck (round/hexagonal bar – jaws move together), 4-jaw independent chuck (square, irregular or off-centre work), faceplate (flat irregular work bolted on), between centres (long work driven by a carrier – can be removed and replaced accurately).</p>
<h3>Taps &amp; dies – tapping sizes</h3>
<div class="tw"><table class="t"><tr><th>Thread</th><th>M3</th><th>M4</th><th>M5</th><th>M6</th><th>M8</th><th>M10</th></tr><tr><td>Tapping drill (mm)</td><td>2.5</td><td>3.3</td><td>4.2</td><td>5.0</td><td>6.8</td><td>8.5</td></tr><tr><td>Clearance drill (mm)</td><td>3.4</td><td>4.5</td><td>5.5</td><td>6.6</td><td>9.0</td><td>11</td></tr></table></div>
<p class="small">Tapping: drill the tapping size, then use the <b>taper</b> tap (to start), <b>second</b> tap and <b>plug</b> tap (to the bottom of a blind hole), turning back half a turn every turn to break the swarf.</p>
<h2 id="datum" class="sec">Datums &amp; holding work</h2>
<div class="card"><p class="small">A <b>datum</b> is the edge or surface all measurements are taken from. In wood, plane a <b>face side</b> and <b>face edge</b> square to each other (marked with face marks) and measure from them. In metal, file one edge straight and flat (check with an engineer's square) or use the surface plate. Work should always be secured: woodwork vice, engineer's vice with soft jaws, machine vice on the drill, G-clamps, or chucks/faceplates on the lathe.</p></div>`,
init(){
  let cur='all';tgCats.innerHTML=`<button class="chip on" data-c="all">All</button>`+Object.entries(TOOLCATS).map(([k,v])=>`<button class="chip" data-c="${k}">${v}</button>`).join('');

  TOOLWS=mountWorkshop('tw',T3D,list,TOOLWS_START||'pillar',id=>{const t=TOOLS.find(x=>x.id===id);const I=TOOLINFO[id]||{};return{name:t.name,cat:TOOLCATS[t.cat],html:`<p style="margin-top:0">${t.use}</p><div class="kv"><b>Materials</b><div>${t.mat}</div><b>Category</b><div>${TOOLCATS[t.cat]}</div></div>${I.tip?`<div class="tip"><p>${I.tip}</p></div>`:''}`,how:I.how,safety:I.safety,tip:I.tip};});TOOLWS_START=null;

}};

PAGES.processes = {t:'Shaping processes',html:()=>`

/* ---------------- JOINING ---------------- */
PAGES.joining = {t:'Joining & assembly',html:()=>`
${head('Paper 3 · Joining','Joining, fittings & adhesives','Permanent and temporary methods for wood, metal and plastic – with a 3D joint explorer.')}
${toc([['j3d','3D joint explorer'],['cons','Construction types'],['metal','Joining metals'],['kd','KD fittings'],['adh','Adhesives'],['jigs','Holding & jigs']])}
<h2 id="j3d" class="sec">3D joint explorer</h2>
<div class="card">${lab('Rotate & explode the joint','drag to rotate')}
<div class="chips" id="jxList"></div>
<div class="grid g2"><div><div class="stage" id="jxStage"><canvas id="jxCan" height="380"></canvas></div>
<div class="ctrl"><label>Explode</label><input type="range" id="jxEx" min="0" max="100" value="60" style="flex:1"><button class="btn ghost sm" id="jxIso">Iso view</button><button class="btn ghost sm" id="jxSpin">Spin</button></div></div>
<div><h3 id="jxName" style="margin-top:0"></h3><div class="flex small"><span>Strength <b id="jxStr"></b></span><span>Difficulty <b id="jxDif"></b></span><span class="pill" id="jxType"></span></div><p id="jxDesc"></p><div class="kv"><b>Uses</b><div id="jxUses"></div><b>✓</b><div id="jxPros"></div><b>✗</b><div id="jxCons"></div></div></div></div></div>
<h2 id="cons" class="sec">Construction types</h2>
<div class="grid g3"><div class="card"><h4>Frame construction</h4><p class="small">Lengths of material joined to make a frame – doors, windows, picture frames. Joints: mortise &amp; tenon, halving, bridle, dowel, mitre.</p></div><div class="card"><h4>Carcase (box) construction</h4><p class="small">Flat panels/boards joined to make a box – cabinets, drawers, wardrobes. Joints: housing, dovetail, finger, rebate, dowel, biscuit, KD fittings.</p></div><div class="card"><h4>Stool construction</h4><p class="small">Legs joined by rails – tables, chairs, stools. Joints: mortise &amp; tenon, dowel, KD leg fastenings. Check it is square by measuring the diagonals.</p></div></div>
<div class="grid g2"><div class="key" style="margin:0"><p><b>Permanent:</b> cannot be taken apart without damage – glued joints, welding, brazing, soldering, rivets, nails.</p></div><div class="key" style="margin:0"><p><b>Temporary (non-permanent):</b> can be taken apart – screws, nuts &amp; bolts, KD fittings, hinges, clips.</p></div></div>
<h2 id="metal" class="sec">Joining metals</h2>
<div class="tw"><table class="t"><tr><th>Method</th><th>Temperature</th><th>Type</th><th>Notes</th></tr>${METALJOIN.map(m=>`<tr><td><b>${m.name}</b></td><td>${m.temp}</td><td>${m.perm}</td><td>${m.d}</td></tr>`).join('')}</table></div>
<div class="tip"><p>Order of strength: soft soldering &lt; hard soldering &lt; brazing &lt; welding. Only welding melts the <b>parent metal</b>. Plastics: acrylic is joined with Tensol cement; HIPS with liquid poly cement; thermoplastics can also be hot-air welded.</p></div>
<h2 id="kd" class="sec">Knock-down (KD) fittings</h2><p class="small">Used with manufactured boards (especially chipboard) in flat-pack furniture: quick to assemble with simple tools, can be taken apart, products packed flat (cheaper transport and storage). But they are less strong/rigid than glued joints and can work loose.</p>
<div class="grid g3" id="kdGrid"></div>
<h2 id="adh" class="sec">Adhesives</h2>
<div class="tw"><table class="t"><tr><th>Adhesive</th><th>Joins</th><th>Setting time</th><th>H &amp; S</th><th>Notes</th></tr>${ADHESIVES.map(a=>`<tr><td><b>${a.name}</b></td><td>${a.for}</td><td>${a.set}</td><td>${a.hs}</td><td>${a.n}</td></tr>`).join('')}</table></div>
<p class="small"><b>Preparation:</b> surfaces must be clean, dry and grease-free; roughen smooth surfaces (metal/plastic) with abrasive paper to give a "key". Clamp with even pressure; wipe off excess glue before it sets; leave the full curing time before stressing the joint.</p>
<h2 id="jigs" class="sec">Holding devices, formers &amp; jigs</h2>
<div class="card"><p class="small">Sash clamps for frames and carcases; G-clamps and quick-release clamps; band clamps for mitred frames; formers for lamination and bending; drilling jigs to position holes identically on every part (e.g. dowelling jig); sawing jigs and mitre boxes for repeated angles; bending jigs for acrylic. Jigs make batch production faster, more accurate and consistent.</p></div>`,
