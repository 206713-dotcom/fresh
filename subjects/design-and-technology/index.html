<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RM Revise — IGCSE Design &amp; Technology 0445 (Resistant Materials)</title>
<style>
:root{
  --ink:#0f1b2d; --ink2:#3b4a60; --mute:#6b7a90; --line:#e3e8ef; --bg:#f5f7fb; --card:#fff;
  --brand:#1747d1; --brand2:#0e2f8f; --brandSoft:#e8eefc;
  --teal:#0f9d8a; --tealSoft:#e3f6f2; --amber:#b86e00; --amberSoft:#fff4df;
  --red:#d23a3a; --redSoft:#fdeaea; --green:#1d8a4a; --greenSoft:#e5f5eb; --violet:#6a3fd1; --violetSoft:#efe9fd;
  --wood:#b9824a; --metal:#8a97a8; --plastic:#2b8fd6;
  --r:14px; --sh:0 1px 2px rgba(15,27,45,.06),0 4px 16px rgba(15,27,45,.06);
  --nav:270px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;font-size:15.5px;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:Outfit,Inter,sans-serif;line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,4.5vw,2.5rem);font-weight:800}
h2{font-size:clamp(1.3rem,3.2vw,1.7rem);font-weight:700;margin-top:1.6em}
h3{font-size:1.12rem;font-weight:700;margin-top:1.2em}
h4{font-size:1rem;font-weight:600}
p{margin:.4em 0 .8em}
a{color:var(--brand)}
button{font:inherit;cursor:pointer}
ul{padding-left:1.25em;margin:.3em 0 .8em} li{margin:.2em 0}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
/* ---------- layout ---------- */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-family:Outfit;font-weight:800;font-size:1.15rem;color:var(--ink);text-decoration:none}
.logo .mk{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--teal));display:grid;place-items:center;color:#fff;font-size:.85rem}
.logo small{display:block;font-family:Inter;font-weight:500;font-size:.7rem;color:var(--mute);letter-spacing:.02em}
.top .sp{flex:1}
.menuBtn{display:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font-weight:600}
.searchBox{position:relative}
.searchBox input{width:220px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;background:var(--bg)}
.sres{position:absolute;right:0;top:110%;width:min(380px,90vw);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);max-height:60vh;overflow:auto;display:none;z-index:60}
.sres a{display:block;padding:9px 12px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.sres a small{color:var(--mute);display:block}
.sres a:hover{background:var(--brandSoft)}
.wrap{display:flex;min-height:calc(100vh - 57px)}
nav.side{width:var(--nav);flex:none;border-right:1px solid var(--line);background:#fff;padding:14px 10px 40px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto}
nav.side .grp{font-size:.7rem;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin:16px 10px 6px}
nav.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink2);text-decoration:none;font-weight:500;font-size:.93rem}
nav.side a .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:.8rem;flex:none}
nav.side a:hover{background:var(--bg)}
nav.side a.on{background:var(--brandSoft);color:var(--brand2);font-weight:650}
nav.side a .tag{margin-left:auto;font-size:.62rem;background:var(--tealSoft);color:var(--teal);padding:2px 6px;border-radius:20px;font-weight:700}
main{flex:1;min-width:0;padding:26px clamp(14px,3.5vw,44px) 80px;max-width:1180px}
.crumb{font-size:.82rem;color:var(--mute);margin-bottom:6px}
.crumb b{color:var(--brand)}
.lead{font-size:1.06rem;color:var(--ink2);max-width:780px}
.scrim{display:none}
@media (max-width:900px){
  .menuBtn{display:block}
  nav.side{position:fixed;left:0;top:0;height:100vh;z-index:70;transform:translateX(-105%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.2)}
  nav.side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(10,20,35,.35);z-index:65}
  .searchBox input{width:130px}
  main{padding-top:18px}
}
@media (max-width:480px){.logo small{display:none}.searchBox input{width:110px}}
/* ---------- components ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card+.card{margin-top:14px}
.grid>.card+.card,.flex>.card+.card{margin-top:0}
.spec{background:var(--violetSoft);border:1px solid #d9cdfa;border-radius:12px;padding:12px 14px;margin:12px 0}
.spec::before{content:"SPECIFICATION";display:block;font-size:.7rem;font-weight:800;letter-spacing:.08em;color:var(--violet);margin-bottom:3px}
.spec p{margin:.2em 0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tip,.note,.warn,.key,.eg{border-radius:12px;padding:12px 14px 12px 14px;margin:12px 0;border:1px solid;font-size:.95rem}
.tip{background:var(--amberSoft);border-color:#f3d9a4}
.tip::before{content:"★ EXAM TIP";display:block;font-size:.7rem;font-weight:800;letter-spacing:.08em;color:var(--amber);margin-bottom:3px}
.note{background:var(--brandSoft);border-color:#cbd8fb}
.note::before{content:"NOTE";display:block;font-size:.7rem;font-weight:800;letter-spacing:.08em;color:var(--brand);margin-bottom:3px}
.warn{background:var(--redSoft);border-color:#f5c6c6}
.warn::before{content:"⚠ SAFETY";display:block;font-size:.7rem;font-weight:800;letter-spacing:.08em;color:var(--red);margin-bottom:3px}
.key{background:var(--tealSoft);border-color:#bfe8df}
.key::before{content:"KEY DEFINITION";display:block;font-size:.7rem;font-weight:800;letter-spacing:.08em;color:var(--teal);margin-bottom:3px}
.eg{background:var(--violetSoft);border-color:#d9cdfa}
.eg::before{content:"MODEL ANSWER";display:block;font-size:.7rem;font-weight:800;letter-spacing:.08em;color:var(--violet);margin-bottom:3px}
.tip p,.note p,.warn p,.key p,.eg p{margin:.2em 0}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--bg);color:var(--ink2);border:1px solid var(--line);margin:2px 3px 2px 0}
.pill.w{background:#f7ecdf;color:#7a4b14;border-color:#ecd3b6}.pill.m{background:#e9edf2;color:#3d4b5c;border-color:#d3dbe5}.pill.p{background:#e2f0fb;color:#14598f;border-color:#bfdcf3}.pill.c{background:#efe9fd;color:#4f2ea8;border-color:#dacffa}.pill.s{background:#e3f6f2;color:#0b6e61;border-color:#bfe8df}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-size:.86rem;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
a.btn{text-decoration:none;display:inline-block}
.btn{border:0;background:var(--brand);color:#fff;border-radius:10px;padding:9px 15px;font-weight:650;font-size:.92rem}
.btn:hover{background:var(--brand2)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--bg)}
.btn.sm{padding:6px 11px;font-size:.84rem}
.btn.ok{background:var(--green)}.btn.bad{background:var(--red)}
table.t{width:100%;border-collapse:collapse;font-size:.92rem;background:#fff}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--bg);font-weight:700;font-size:.82rem;color:var(--ink2)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:10px 0}
.tw table.t{min-width:560px}
.hero{background:radial-gradient(1200px 300px at 0% 0%,#dfe8ff 0%,transparent 60%),radial-gradient(800px 300px at 100% 0%,#d7f4ee 0%,transparent 60%),#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(18px,4vw,36px);box-shadow:var(--sh)}
.hero .stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px}
.hero .stat b{display:block;font-family:Outfit;font-size:1.5rem}
.hero .stat span{font-size:.8rem;color:var(--mute)}
.topic{display:block;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);transition:transform .12s,border-color .12s}
.topic:hover{transform:translateY(-2px);border-color:#b9c9f5}
.topic .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:1.2rem;margin-bottom:10px}
.topic h4{margin:0 0 4px}
.topic p{font-size:.86rem;color:var(--mute);margin:0}
.topic .lab{font-size:.68rem;font-weight:800;color:var(--teal);letter-spacing:.06em}
.sec{scroll-margin-top:70px}
.toc{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.toc a{font-size:.82rem;text-decoration:none;background:#fff;border:1px solid var(--line);padding:5px 10px;border-radius:8px;color:var(--ink2);font-weight:600}
.toc a:hover{border-color:var(--brand);color:var(--brand)}
.labhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.labhead .badge{background:var(--teal);color:#fff;font-size:.68rem;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.06em}
.labhead h3{margin:0}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.ctrl label{font-size:.84rem;font-weight:600;color:var(--ink2)}
select,input[type=text],input[type=number],textarea{font:inherit;border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff;color:var(--ink)}
textarea{width:100%;min-height:56px;resize:vertical}
input[type=range]{accent-color:var(--brand)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:#fff;padding:7px 11px;font-size:.84rem;font-weight:600;color:var(--ink2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.muted{color:var(--mute)} .small{font-size:.85rem}
.flex{display:flex;gap:12px;flex-wrap:wrap}
.center{text-align:center}
/* material & tool cards */
.mcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);cursor:pointer;display:flex;flex-direction:column;transition:transform .12s}
.mcard:hover{transform:translateY(-2px)}
.mcard .sw{height:92px;position:relative}
.mcard .sw svg{width:100%;height:100%;display:block}
.mcard .bd{padding:12px 14px}
.mcard h4{margin:0 0 3px}
.mcard p{margin:0;font-size:.84rem;color:var(--mute)}
.tcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--sh);cursor:pointer;transition:transform .12s;display:flex;flex-direction:column}
.tcard:hover{transform:translateY(-2px)}
.tcard .im{height:84px;background:linear-gradient(180deg,#f7f9fc,#eef2f8);border-radius:10px;display:grid;place-items:center;margin-bottom:9px}
.tcard .im svg{height:76px;width:100%}
.tcard h4{margin:0;font-size:.95rem}
.tcard p{margin:3px 0 0;font-size:.8rem;color:var(--mute)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,20,35,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:14px}
.modal.open{display:flex}
.modal .box{background:#fff;border-radius:18px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:22px;position:relative}
.modal .x{position:absolute;right:12px;top:12px;border:0;background:var(--bg);width:34px;height:34px;border-radius:50%;font-size:1.1rem}
.modal .hero-im{border-radius:12px;overflow:hidden;background:linear-gradient(180deg,#f7f9fc,#eef2f8);margin-bottom:12px}
.modal .hero-im svg{display:block;width:100%;height:180px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:.92rem}
.kv b{color:var(--ink2)}
@media (max-width:520px){.kv{grid-template-columns:1fr}.kv b{margin-top:6px}}
/* canvases */
.stage{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;touch-action:none}
.stage canvas{display:block;width:100%;touch-action:none}
.toolbar{display:flex;gap:6px;overflow-x:auto;padding:8px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.toolbar button{flex:none;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;font-size:.8rem;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:54px}
.toolbar button svg{width:22px;height:22px}
.toolbar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.toolbar .div{width:1px;background:var(--line);flex:none;margin:0 3px}
.sw8{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);flex:none;padding:0;min-width:0!important}
.sw8.on{box-shadow:0 0 0 2px var(--ink)}
/* stepper */
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:700}
.stepper button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.steptext{min-height:72px;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.95rem}
.pdiag{background:linear-gradient(180deg,#fbfcfe,#f1f4f9);border:1px solid var(--line);border-radius:12px}
.pdiag svg{display:block;width:100%;height:auto;max-height:340px}
.callout{transition:all .25s}
.callout.on circle{fill:var(--brand)!important;r:13}
.callout.on text{fill:#fff!important}
/* quiz */
.qopt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;margin:6px 0;font-size:.95rem}
.qopt:hover{border-color:var(--brand)}
.qopt.right{background:var(--greenSoft);border-color:var(--green)}
.qopt.wrong{background:var(--redSoft);border-color:var(--red)}
.bar{height:8px;background:var(--line);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--teal));width:0;transition:width .3s}
.flash{perspective:1000px;height:220px;cursor:pointer;margin:10px 0}
.flash .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .f,.flash .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;border:1px solid var(--line);box-shadow:var(--sh)}
.flash .f{background:#fff;font-family:Outfit;font-size:1.4rem;font-weight:700}
.flash .b{background:var(--brandSoft);transform:rotateY(180deg);font-size:.98rem}
/* misc */
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-bottom:1px solid var(--line)}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--green);flex:none}
.check.done span{color:var(--mute);text-decoration:line-through}
.sortitem{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font-size:.88rem;font-weight:600}
.sortitem.sel{border-color:var(--brand);background:var(--brandSoft)}
.sortitem.right{border-color:var(--green);background:var(--greenSoft)}
.sortitem.wrong{border-color:var(--red);background:var(--redSoft)}
.bin{border:2px dashed #c9d3e2;border-radius:12px;padding:10px;min-height:110px;background:#fafbfe}
.bin h4{margin:0 0 6px;font-size:.92rem}
.bin .chips{margin:0}
.res{font-weight:700;margin-top:8px}
.res.ok{color:var(--green)} .res.no{color:var(--red)}
.sym{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;cursor:pointer}
.sym.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brandSoft)}
.sym svg{width:64px;height:64px}
.sym span{font-size:.8rem;font-weight:700}
.cycle svg{width:100%;max-width:440px;display:block;margin:auto}
.cycle g.st{cursor:pointer}
.cycle g.st.on circle{fill:var(--brand)}
.cycle g.st.on text{fill:#fff}
.foot{margin-top:50px;padding-top:18px;border-top:1px solid var(--line);font-size:.82rem;color:var(--mute)}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;font-size:.8rem;background:#fff}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;transition:all .25s;z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.orthoGrid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.orthoGrid .cell{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center}
.orthoGrid .cell b{font-size:.75rem;color:var(--mute);display:block}
.orthoGrid svg{width:100%;height:auto;max-height:180px}
.hmap{display:grid;gap:4px;max-width:220px}
.hmap button{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;font-weight:800;font-size:1rem;background:#fff}
.vern svg{width:100%;height:auto;display:block}
.chisel svg{width:100%;height:auto;display:block}

/* 3D workshop v2 */
.v3card{background:linear-gradient(180deg,#fff,#fbfcfe)}
.v3stage{height:min(62vh,460px);background:radial-gradient(120% 90% at 50% 30%,#ffffff 0%,#eef2f7 55%,#dfe5ee 100%);border-radius:14px;overflow:hidden}
.v3sel{width:100%;font-weight:600;padding:10px 12px;border-radius:10px;background:#fff}
.v3hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px;pointer-events:none;gap:8px}
.v3name{background:rgba(15,27,45,.82);color:#fff;font-family:Outfit;font-weight:700;font-size:.85rem;padding:5px 10px;border-radius:8px;backdrop-filter:blur(4px)}
.v3btns{display:flex;gap:6px;pointer-events:auto}
.v3btns button{border:1px solid rgba(15,27,45,.12);background:rgba(255,255,255,.88);border-radius:8px;padding:5px 9px;font-size:.78rem;font-weight:700;color:#0f1b2d;backdrop-filter:blur(4px)}
.v3btns button.on{background:#0f1b2d;color:#fff}
.hsLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hs{position:absolute;left:0;top:0;will-change:transform}
.hs i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:#1747d1;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.hs span{position:absolute;left:10px;top:-30px;white-space:nowrap;background:rgba(255,255,255,.94);border:1px solid rgba(23,71,209,.35);color:#0f1b2d;font-size:.72rem;font-weight:700;padding:3px 7px;border-radius:7px;box-shadow:0 2px 8px rgba(15,27,45,.12)}
.hs span::before{content:"";position:absolute;left:-9px;bottom:-9px;width:12px;height:1.5px;background:#1747d1;transform:rotate(-45deg);transform-origin:right}
.hs::after{content:"";position:absolute;left:0;bottom:4px;width:1.5px;height:var(--lift,0px);background:#1747d1;opacity:.7}
.hs.left span{left:auto;right:10px}.hs.left span::before{left:auto;right:-9px;transform:rotate(45deg);transform-origin:left}
.hs.pulse i{animation:hsp 1s ease 2}.hs.pulse span{background:#1747d1;color:#fff}
@keyframes hsp{0%,100%{transform:scale(1)}50%{transform:scale(2.2)}}
@media(max-width:520px){.hs span{font-size:.62rem;padding:2px 5px;top:-24px}}
.v3bar{display:flex;align-items:center;gap:10px;margin:10px 0 6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.v3bar input{flex:1;min-width:100px}.v3pct{font-size:.78rem;font-weight:700;color:var(--mute);width:38px;text-align:right}
.v3kicker{font-size:.7rem;font-weight:800;letter-spacing:.08em;color:var(--teal);text-transform:uppercase}

/* ===== v4: plain, drawn-by-hand look ===== */
:root{--ink:#14181f;--ink2:#3a4350;--mute:#6b7380;--line:#d9dde3;--bg:#f5f5f1;--card:#fff;--brand:#1d4ed8;--brand2:#1e3a8a;--brandSoft:#eef2fb;--teal:#047857;--r:6px;--sh:none;--mono:PlexMono,ui-monospace,Menlo,Consolas,monospace}
body{font-family:Plex,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background-color:var(--bg);background-image:linear-gradient(90deg,rgba(20,24,31,.035) 1px,transparent 1px),linear-gradient(rgba(20,24,31,.035) 1px,transparent 1px);background-size:24px 24px;font-size:15.5px}

h1{font-weight:700;line-height:1.1}h2{font-weight:700}h3{font-weight:600}h4{font-weight:600}
h2{margin-top:1.6em;padding-bottom:6px;border-bottom:1px solid var(--line)}
code,.mono{font-family:var(--mono)}
/* header */
.top{background:#fff;border-bottom:1px solid var(--ink);box-shadow:none;padding:10px 18px}
.logo{font-weight:700;font-size:1.05rem;color:var(--ink)}

.logo small{font-family:var(--mono);font-size:.62rem;font-weight:500;letter-spacing:.04em;text-transform:none;color:var(--mute)}
.searchBox input,.menuBtn{border-radius:4px;border-color:var(--line);background:#fff}
/* sidebar */
nav.side{background:#fff;border-right:1px solid var(--line);padding:6px 0 40px}

nav.side a{border:0;border-left:3px solid transparent;border-radius:0;margin:0;padding:6px 15px;font-weight:500;font-size:.9rem;color:var(--ink2);justify-content:flex-start}

nav.side a .dot{width:5px;height:5px;border-radius:50%;background:#9aa3af;margin-left:auto}nav.side a.on .dot{background:var(--brand)}
nav.side .ic,nav.side .tag{display:none!important}
/* page header: no banner, just type and a rule */

/* home: drawing-sheet title block */

.seg{border-radius:4px;border-color:#c3c9d2}.seg button{font-weight:500;border-color:#c3c9d2}.seg button.on{background:var(--ink)}
input,select,textarea{border-radius:4px!important}
.note,.key,.warn,.banner{border-radius:var(--r);box-shadow:none}
.banner{background:#fff;border:1px solid var(--ink);border-left:6px solid var(--brand)}
.banner.evb{background:#fff;border-left-color:#d97706;color:var(--ink)}
.tw{border-radius:var(--r)}table.t th{font-family:var(--mono);font-weight:500;font-size:.7rem;letter-spacing:.03em}
.goal{border-radius:var(--r)}.ann{border-radius:var(--r)}
.statc b{font-weight:700}.statc small{font-family:var(--mono);text-transform:uppercase;font-size:.64rem;letter-spacing:.03em}
/* coins */
.coinchip{border-radius:4px;background:#fff;border:1px solid var(--line)}.coinchip i.cn,i.cn{display:inline-block;width:12px;height:12px;border-radius:50%;background:#e0a526;box-shadow:inset 0 0 0 2px #c98a12}
.userchip{border-radius:4px}
.coinpop{font-family:var(--mono)}
/* leaderboard + misc */
.pod{border-radius:var(--r)}.pod .medal{font-family:var(--mono);font-weight:700;font-size:1rem;width:26px;height:26px;display:inline-grid;place-items:center;border:1px solid var(--ink);border-radius:50%;background:#fff}
.lbrow{border-radius:4px}.lbrow .stk{font-family:var(--mono);font-size:.72rem;color:var(--mute)}
.hrk{font-style:normal;font-family:var(--mono);font-weight:700}
.foot{font-size:.78rem}
.modal .box{border-radius:6px}
/* sync */
.sync{border:1px solid var(--ink)}.synctop{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.qr{flex:none;width:150px;text-align:center}.qr svg{width:150px;height:150px;display:block;border:1px solid var(--line)}.qr small{display:block;font-size:.7rem;color:var(--mute);margin-top:4px}.qr:empty{display:none}
.stale{color:#b45309}
.adstate{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:8px 12px;border:1px dashed #c3c9d2;border-radius:4px;font-size:.86rem;background:#fff}.adstate .ok{color:var(--teal)}
details.card summary{cursor:pointer}
.hero .btn{background:var(--brand);color:#fff;border:1px solid var(--brand)}.hero .btn.ghost{background:#fff;color:var(--ink);border:1px solid #c3c9d2}.hero .btn.ghost:hover{background:#f4f5f7;border-color:var(--ink)}
.userchip{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:600}
#main>h2,.labs+h2{border-bottom:1px solid var(--line)}h2{border-bottom:0;padding-bottom:0}#main>h2{padding-bottom:6px}
.statg{grid-template-columns:repeat(3,1fr)!important;gap:8px!important}.statg .statc{border:1px solid var(--line);border-radius:4px;padding:10px 6px}
.ava{background:#e6e8ec}.ava>span{background:var(--ink);font-weight:600}.ava>span.emo{background:#fff}
.av{background:var(--ink)}.logo .mk,.mk{background:var(--ink)!important;border-radius:4px!important;box-shadow:none!important}

.pod.p1{background:#fff;border-color:var(--ink)}.joinc{background:#fff}
.chips button,.chip,.fbtn,.tabs button{border-radius:4px}

/* shop themes now recolour the accent instead of a banner */

body[data-theme=violet]{--brand:#6d28d9;--brand2:#4c1d95;--brandSoft:#f3efff;--bg:#f6f4fa}
body[data-theme=carbon]{--brand:#111827;--brand2:#000;--brandSoft:#eceef1;--bg:#ededeb}
body[data-theme=gold]{--brand:#a16207;--brand2:#854d0e;--brandSoft:#fdf6e3;--bg:#f8f5ec}
body[data-theme]:not([data-theme=""]) .phead{border-bottom-color:var(--brand)}body[data-theme]:not([data-theme=""]) .hero{border-color:var(--brand)}
.chip{border-radius:4px!important;font-weight:500!important;border-color:#c3c9d2!important}.chip.on{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important}

/* ===== learning path ===== */
.pathhead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}.pathhead>div:first-child{flex:1;min-width:260px}
.pprog{width:240px;font-size:.8rem;color:var(--ink2)}.pprog i{display:block;height:6px;background:#e3e6ea;margin:6px 0;border-radius:3px;overflow:hidden}.pprog i b{display:block;height:100%;background:var(--teal);transition:width .3s}.pprog small{font-family:var(--mono);font-size:.66rem;color:var(--mute)}

.tick{width:18px;height:18px;border-radius:50%;border:1.5px solid #c3c9d2;background:#fff;padding:0;cursor:pointer;position:relative}
.tick:hover{border-color:var(--teal)}.lrow.done .tick{background:var(--teal);border-color:var(--teal)}.lrow.done .tick::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}

#privbar{position:fixed;left:16px;bottom:16px;z-index:90;max-width:440px;background:#111317;color:#d6d9de;border-radius:20px;padding:16px 18px;box-shadow:0 18px 40px -14px rgba(17,19,23,.5);font-size:14px;line-height:1.5}

/* creator */
.creator{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-card);padding:22px 24px;margin-top:40px}
.creator h3{margin:2px 0 2px;font-size:1.35rem;letter-spacing:-.025em}.cr-role{margin:0 0 8px;color:var(--mute);font-size:14px}.cr-txt{margin:0;color:var(--ink2);max-width:66ch}
.cr-av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;font-weight:600;font-size:12px;letter-spacing:-.02em;flex:none}
.cr-av.big{width:64px;height:64px;font-size:22px;background:linear-gradient(160deg,#2440e6,#1a31b8)}
.foot-by{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:12px;font-size:15px}.foot-by b{font-weight:600}

/* material swatch generator */
function swatch(m){
  const c=m.col, cat=m.cat, id='g'+m.id;
  if(['hardwood','softwood'].includes(cat)){
    let lines='';for(let i=0;i<9;i++){const y=8+i*9+(i%3);lines+=`<path d="M0 ${y} C 60 ${y-6+i%4*3}, 120 ${y+7}, 200 ${y-2} S 320 ${y+5}, 400 ${y}" stroke="rgba(60,30,10,.22)" stroke-width="${1+(i%3)*.6}" fill="none"/>`;}
    const knot=cat==='softwood'?`<ellipse cx="270" cy="46" rx="14" ry="8" fill="rgba(80,40,15,.35)"/><ellipse cx="270" cy="46" rx="6" ry="3" fill="rgba(60,30,10,.5)"/>`:'';
    return `<svg viewBox="0 0 400 92" preserveAspectRatio="none"><rect width="400" height="92" fill="${c}"/>${lines}${knot}</svg>`;}
  if(cat==='board'){
    if(m.id==='plywood'){return `<svg viewBox="0 0 400 92" preserveAspectRatio="none"><rect width="400" height="92" fill="${c}"/>${[0,1,2,3,4].map(i=>`<rect x="0" y="${16+i*12}" width="400" height="12" fill="${i%2?'#c79a5e':'#e3c18f'}"/>`).join('')}<rect x="0" y="0" width="400" height="16" fill="${c}"/></svg>`;}
    let dots='';for(let i=0;i<140;i++){dots+=`<rect x="${(i*53)%400}" y="${(i*37)%92}" width="${2+i%5}" height="${1+i%3}" fill="rgba(70,40,15,${.12+(i%4)*.05})" transform="rotate(${i*23%90} ${(i*53)%400} ${(i*37)%92})"/>`;}
    return `<svg viewBox="0 0 400 92" preserveAspectRatio="none"><rect width="400" height="92" fill="${c}"/>${m.id==='mdf'||m.id==='hardboard'?'':dots}</svg>`;}
  if(['ferrous','nonferrous'].includes(cat)){
    let st='';for(let i=0;i<30;i++){st+=`<line x1="0" y1="${i*3.1}" x2="400" y2="${i*3.1+(i%3)}" stroke="rgba(255,255,255,${.05+(i%4)*.04})" />`;}
    return `<svg viewBox="0 0 400 92" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="${c}" stop-opacity="1"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient></defs><rect width="400" height="92" fill="${c}"/><rect width="400" height="92" fill="url(#${id})"/>${st}</svg>`;}
  if(cat==='thermo'||cat==='thermoset'||cat==='smart'){
    const extra=m.id==='thermochromic'?`<defs><linearGradient id="${id}t"><stop offset="0" stop-color="#2b6fd6"/><stop offset=".5" stop-color="#7d5cd6"/><stop offset="1" stop-color="#e2423a"/></linearGradient></defs><rect width="400" height="92" fill="url(#${id}t)"/>`:'';
    return `<svg viewBox="0 0 400 92" preserveAspectRatio="none"><rect width="400" height="92" fill="${c}"/>${extra}<path d="M-20 92 L120 -10 L180 -10 L40 92 Z" fill="#fff" opacity=".28"/><path d="M60 92 L200 -10 L215 -10 L75 92 Z" fill="#fff" opacity=".2"/><rect width="400" height="92" fill="none" stroke="rgba(0,0,0,.08)"/></svg>`;}

function fastenerHoles(f){const metric=f.size[0]==='M';
 if(!metric){const P={4:['1.5','2.0','3.0'],6:['2.0','2.5','3.5–4'],8:['2.5','3.0','4.5'],10:['3.0','3.5','5.0'],12:['3.5','4.0','5.5']}[f.size];
  return `<ul style="margin:0"><li><b>Pilot hole:</b> Ø${P[0]} mm in softwood, Ø${P[1]} mm in hardwood (into the bottom piece).</li><li><b>Clearance hole:</b> Ø${P[2]} mm through the top piece.</li>${f.head==='csk'||f.head==='rcsk'?'<li><b>Countersink</b> the clearance hole so the head sits flush.</li>':''}${f.type==='chip'?'<li>Chipboard screws are often driven without a pilot in softer boards – the twin coarse thread grips the particles.</li>':''}${f.type==='self'?'<li>Self-tappers need a pilot hole about the core diameter in sheet metal/plastic; the hardened thread cuts its own thread.</li>':''}</ul>`;}
 const d=+f.size.slice(1);const tap={3:2.5,4:3.3,5:4.2,6:5.0,8:6.8,10:8.5}[d],clr={3:3.4,4:4.5,5:5.5,6:6.6,8:9,10:11}[d];
 if(f.type==='coach')return `<ul style="margin:0"><li><b>Clearance hole:</b> ≈Ø${d+1} mm through the top timber.</li><li><b>Pilot hole:</b> ≈Ø${(d*0.65).toFixed(1)} mm into the main timber.</li><li>Tighten with a spanner or socket; use a washer under the head.</li></ul>`;
 return `<ul style="margin:0"><li><b>Clearance hole:</b> Ø${clr} mm (bolt passes through, nut on the back).</li><li><b>Tapped hole:</b> drill Ø${tap} mm tapping size then cut the thread with ${f.size} taps.</li>${f.head==='csk'?'<li><b>Countersink</b> for a flush head.</li>':''}${f.head==='socket'?`<li><b>Counterbore</b> ≈Ø${Math.round(d*1.8)} mm if the head must sit below the surface.</li>`:''}${f.type==='bolt'?`<li>Use an ${f.size} hexagon nut + plain washer (and a spring washer or nyloc nut against vibration).</li>`:''}</ul>`;}
function fastenerWhy(f){const H={csk:'Countersunk head sits flush with the surface – needed for hinges and anywhere flat.',rcsk:'Raised countersunk is decorative – often used with screw cups on panels/mirrors.',round:'Round head sits on the surface – fixing thin sheet or fittings with plain holes.',pan:'Pan head gives a wide bearing surface – sheet metal and plastic casings.',socket:'Socket cap heads are strong and neat; can be counterbored below the surface.',hex:'Hexagon head is turned with a spanner – high torque for heavy-duty fixings.'}[f.head];
 const Dr={pozi:'Pozidriv: the extra "tick" lines give better grip and less cam-out than Phillips – the standard for wood screws.',phillips:'Phillips cross head is common on machine and self-tapping screws.',slot:'Slotted is traditional (e.g. brass screws on antiques) but the driver slips easily.',hex:'Hex socket is driven with an Allen key – high torque, used in flat-pack furniture.',torx:'Torx star drive resists cam-out – used in power-driven construction screws.',none:''}[f.drive];
 const M={zinc:'Zinc plating stops rust indoors – general purpose.',brass:'Brass is corrosion resistant and decorative and won\'t stain oak (tannic acid) – but it is soft, so drive a steel screw first to cut the thread.',stainless:'Stainless steel for outdoor or wet use – will not rust.',black:'Black japanned finish for black ironmongery (e.g. tee hinges).',bright:'Bright (uncoated) steel – cheap; rusts if damp.',hts:'High tensile steel for structural/engineering loads.'}[f.mat];
 const T={wood:'Wood screws have a plain shank so the top piece is pulled tightly onto the bottom piece.',chip:'Chipboard screws are fully threaded with a coarse twin thread to grip weak particle board.',self:'Self-tapping screws are hardened and cut their own thread in sheet metal and plastic.',mach:'Machine screws have an ISO metric thread – used with a nut or in a tapped hole.',bolt:'Bolts have a plain shank and are used with a nut and washer.',coach:'Coach screws are large wood screws with hexagon heads for heavy timber (gates, decking, wall plates).'}[f.type];
 return `<p style="margin:0 0 4px">${T}</p><p style="margin:0 0 4px">${H}</p>${Dr?`<p style="margin:0 0 4px">${Dr}</p>`:''}<p style="margin:0">${M}</p>`;}
function initFastener(){const f={type:'wood',head:'csk',drive:'pozi',size:'8',len:30,mat:'zinc'};
 const ctrl=()=>{const t=FT[f.type];if(!t.heads.includes(f.head))f.head=t.heads[0];if(!t.drives.includes(f.drive))f.drive=t.drives[0];if(f.head==='socket'&&!['hex','torx'].includes(f.drive))f.drive='hex';if(!t.sizes.includes(f.size))f.size=t.sizes[Math.min(2,t.sizes.length-1)];if(!t.mat.includes(f.mat))f.mat=t.mat[0];f.len=Math.max(t.len[0],Math.min(t.len[1],f.len));
  const seg=(k,opts,nm)=>`<div><label>${k[0].toUpperCase()+k.slice(1)}</label><div class="seg" data-k="${k}" style="margin-top:4px;display:flex">${opts.map(o=>`<button class="${f[k]===o?'on':''}" data-v="${o}" ${k==='drive'&&f.head==='socket'&&!['hex','torx'].includes(o)?'disabled style="opacity:.35"':''}>${nm(o)}</button>`).join('')}</div></div>`;
  fbCtrl.innerHTML=seg('type',Object.keys(FT),o=>FT[o].label.replace(' screw','').replace('Hexagon head ',''))+seg('head',t.heads,o=>HEADN[o].replace(' head',''))+seg('drive',t.drives,o=>o==='none'?'external hex':DRIVEN[o].replace(' (cross)','').replace(' (Allen)','').replace(' (star)',''))+seg('size',t.sizes,o=>o[0]==='M'?o:'No.'+o)+
  `<div><label>Length: <b>${f.len} mm</b></label><input type="range" id="fbLen" min="${t.len[0]}" max="${t.len[1]}" step="${t.len[2]}" value="${f.len}" style="width:100%"></div>`+seg('mat',t.mat,o=>MATN[o][0].replace('steel, ','').replace('high tensile ','HT ').replace(', zinc plated',''));
  fbLen.oninput=()=>{f.len=+fbLen.value;fbCtrl.querySelector('label b').textContent=f.len+' mm';out();};out();};
 const out=()=>{fbSvg.innerHTML=fastenerSVG(f);fbName.textContent=fastenerName(f);const metric=f.size[0]==='M';fbSub.textContent=metric?`${f.size}: ISO metric thread, ${f.size.slice(1)} mm nominal diameter.`:`No. ${f.size} gauge ≈ ${GAUGES[f.size]} mm shank diameter.`;fbHoles.innerHTML=fastenerHoles(f);fbWhy.innerHTML=fastenerWhy(f);};
 fbCtrl.onclick=e=>{const b=e.target.closest('button[data-v]');if(!b||b.disabled)return;const k=b.parentElement.dataset.k;f[k]=b.dataset.v;if(k==='type')f.len=FT[f.type].len[3];ctrl();};
 fbCopy.onclick=()=>copyText(fastenerName(f));fbRand.onclick=()=>{Object.assign(f,randFastener());ctrl();};ctrl();}
function randFastener(){const type=rnd(Object.keys(FT)),t=FT[type];let head=rnd(t.heads),drive=rnd(t.drives);if(head==='socket')drive=rnd(['hex','torx']);const [a,b,s]=t.len;const len=a+s*Math.floor(Math.random()*((b-a)/s+1));return{type,head,drive,size:rnd(t.sizes),len,mat:rnd(t.mat)};}
function initSpotScrew(){let score=0,tot=0,ans='';
 const next=()=>{const f=randFastener();ans=fastenerName(f);nsSvg.innerHTML=fastenerSVG(f);const opts=new Set([ans]);let guard=0;
  while(opts.size<4&&guard++<60){const g={...f};const which=rnd(['head','drive','type','len']);const t=FT[g.type];
   if(which==='head'){g.head=rnd(['csk','round','pan','rcsk','socket']);}else if(which==='drive'){g.drive=rnd(['pozi','phillips','slot','hex','torx']);}else if(which==='type'){g.type=rnd(['wood','self','mach','chip']);if(!FT[g.type].sizes.includes(g.size))g.size=FT[g.type].sizes[1];}else{g.len=Math.max(6,g.len+rnd([-20,-10,10,20]));}
   if(g.type==='bolt'||g.type==='coach'){g.head='hex';g.drive='none';}if(g.head==='hex'&&!['bolt','coach'].includes(g.type))g.head='pan';if(g.drive==='none'&&g.head!=='hex')g.drive='pozi';
   try{opts.add(fastenerName(g));}catch(e){}}
  nsOpts.innerHTML=shuffle([...opts]).map(o=>`<button class="qopt" data-o="${esc(o)}">${esc(o)}</button>`).join('');nsRes.textContent='';};
 nsOpts.onclick=e=>{const b=e.target.closest('.qopt');if(!b||nsOpts.dataset.done==='1')return;nsOpts.dataset.done='1';tot++;const ok=b.dataset.o===ans;if(ok)score++;
  nsOpts.querySelectorAll('.qopt').forEach(x=>{if(x.dataset.o===ans)x.classList.add('right');else if(x===b)x.classList.add('wrong');});nsRes.className='res '+(ok?'ok':'no');nsRes.textContent=ok?'✓ Correct!':'✗ The correct answer is highlighted.';nsScore.textContent=`${score} / ${tot}`;};
 nsNext.onclick=()=>{nsOpts.dataset.done='0';next();};nsOpts.dataset.done='0';next();}

/* ================= VERNIER ================= */
function initVernier(){let v=23.4,mode='test',revealed=false;
 const newV=()=>{v=Math.round((2+Math.random()*75)*10)/10;revealed=false;vnIn.value='';vnRes.innerHTML='';draw();};
 const draw=()=>{const k=19;const start=Math.max(0,Math.floor(v)-8);const X=mm=>22+(mm-start)*k;let s='';
  s+=`<rect x="0" y="20" width="640" height="56" fill="#dfe5ec" stroke="#6f7c8c"/>`;
  for(let mm=start;mm<=start+32;mm++){const x=X(mm);const h=mm%10===0?26:mm%5===0?18:11;s+=`<line x1="${x}" y1="76" x2="${x}" y2="${76-h}" stroke="#0f1b2d" stroke-width="${mm%10===0?1.6:1}"/>`;if(mm%10===0)s+=`<text x="${x}" y="${42}" text-anchor="middle" font-size="14" font-weight="700" fill="#0f1b2d">${mm/10}</text>`;}
  s+=`<text x="630" y="14" text-anchor="end" font-size="11" fill="#3b4a60">main scale (numbers = cm, marks = mm)</text>`;
  const x0=X(v);s+=`<rect x="${x0-14}" y="76" width="${9*k+28}" height="56" fill="#c3ccd8" stroke="#6f7c8c"/>`;
  const al=Math.round((v-Math.floor(v))*10);
  for(let i=0;i<=10;i++){const x=x0+i*0.9*k;const hl=revealed&&i===al;s+=`<line x1="${x}" y1="76" x2="${x}" y2="${76+(i%5===0?22:14)}" stroke="${hl?'#d23a3a':'#0f1b2d'}" stroke-width="${hl?2.6:1.1}"/>`;if(i%5===0||revealed)s+=`<text x="${x}" y="${112}" text-anchor="middle" font-size="${i%5===0?13:10}" font-weight="700" fill="${hl?'#d23a3a':'#0f1b2d'}">${i}</text>`;}
  s+=`<text x="${x0+9*k+12}" y="${128}" text-anchor="end" font-size="9.5" fill="#3b4a60">vernier: 10 div = 9 mm</text>`;
  if(revealed){const a=Math.floor(v);s+=`<line x1="${X(a)}" y1="50" x2="${X(a)}" y2="76" stroke="#1747d1" stroke-width="3"/><line x1="${x0}" y1="60" x2="${x0}" y2="100" stroke="#1747d1" stroke-width="2" stroke-dasharray="3 2"/><text x="${X(a)}" y="152" font-size="12" fill="#1747d1" text-anchor="middle" font-weight="700">${a} mm</text>`;}
  vnSvg.innerHTML=s;if(mode==='explore')vnRes.innerHTML=`<p class="res ok" style="font-size:1.1rem">Reading = ${Math.floor(v)} + (${al} × 0.1) = <b>${v.toFixed(1)} mm</b></p>`;};
 vnChk.onclick=()=>{const g=parseFloat(vnIn.value);if(isNaN(g)){vnRes.innerHTML='<p class="res no">Type a reading first.</p>';return;}const ok=Math.abs(g-v)<0.051;revealed=true;draw();const a=Math.floor(v),b=Math.round((v-a)*10);
  vnRes.innerHTML=`<p class="res ${ok?'ok':'no'}">${ok?'✓ Correct!':'✗ Not quite – answer '+v.toFixed(1)+' mm'}</p><p>Main scale before the vernier zero = <b>${a} mm</b>. Vernier line <b>${b}</b> lines up exactly (red) → ${b} × 0.1 = ${(b/10).toFixed(1)} mm. Total = <b>${v.toFixed(1)} mm</b>.</p>`;};
 vnNew.onclick=newV;vnR.oninput=()=>{v=+vnR.value;revealed=true;draw();};
 vnMode.onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;vnMode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));vnTest.style.display=mode==='test'?'':'none';vnExp.style.display=mode==='explore'?'':'none';if(mode==='explore'){v=+vnR.value;revealed=true;draw();}else newV();};
 newV();}

/* ================= HOLE TYPES ================= */
function initHoles(){const T=[['Pilot hole','A small hole drilled into the piece that the screw thread will grip – about the core diameter of the screw. It guides the screw in straight and stops the wood splitting (essential in hardwoods and near edges).'],
 ['Clearance hole','Drilled through the TOP piece, slightly larger than the screw shank, so the screw passes freely. The head then pulls the top piece tightly down onto the bottom piece.'],
 ['Countersunk hole','A cone-shaped (90°) recess cut with a countersink (rose) bit at the top of the clearance hole so a countersunk screw head sits flush with – or just below – the surface.'],
 ['Counterbored hole','A flat-bottomed, larger-diameter recess (Forstner bit or counterbore cutter) so a cap/socket head or nut sits below the surface. The recess can be filled with a wooden plug to hide the screw.'],
 ['Tapped hole','A hole drilled at the tapping size, then threaded internally with taps (taper → second → plug) so a machine screw or bolt can be screwed directly into it – common in metal and thick plastic.']];
 const hatch=`<defs><pattern id="hw" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ead2a8"/><line x1="0" y1="0" x2="0" y2="8" stroke="#b98a4e" stroke-width="1.5"/></pattern><pattern id="hm" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e2e7ee"/><line x1="0" y1="0" x2="0" y2="8" stroke="#8a97a8" stroke-width="1.5"/></pattern></defs>`;
 const draw=i=>{const Hl='#1747d1';let s=hatch;const top=40,mid=80,bot=150,cx=130;const tapped=i===4;
  s+=`<rect x="20" y="${top}" width="220" height="${mid-top}" fill="url(#${tapped?'hm':'hw'})" stroke="#2b3644"/><rect x="20" y="${mid}" width="220" height="${bot-mid}" fill="url(#${tapped?'hm':'hw'})" stroke="#2b3644"/>`;
  const W=(x1,y1,x2,y2,on)=>`<rect x="${x1}" y="${y1}" width="${x2-x1}" height="${y2-y1}" fill="${on?'#cfe0ff':'#fff'}" stroke="${on?Hl:'#2b3644'}" stroke-width="${on?2.5:1}"/>`;
  if(i===4){s+=W(cx-9,top,cx+9,bot-20,true);for(let y=top+4;y<bot-22;y+=7)s+=`<line x1="${cx-12}" y1="${y}" x2="${cx-9}" y2="${y+3}" stroke="${Hl}" stroke-width="1.5"/><line x1="${cx+12}" y1="${y}" x2="${cx+9}" y2="${y+3}" stroke="${Hl}" stroke-width="1.5"/>`;s+=`<text x="${cx+30}" y="${top-10}" font-size="12" fill="${Hl}" font-weight="700">internal thread (tapped)</text>`;}
  else{s+=W(cx-10,top,cx+10,mid,i===1);s+=W(cx-5,mid,cx+5,bot-25,i===0);
   if(i===2)s+=`<path d="M${cx-24} ${top} L${cx-10} ${top+14} L${cx+10} ${top+14} L${cx+24} ${top} Z" fill="#cfe0ff" stroke="${Hl}" stroke-width="2.5"/>`;
   if(i===3)s+=`<rect x="${cx-22}" y="${top}" width="44" height="16" fill="#cfe0ff" stroke="${Hl}" stroke-width="2.5"/>`;
   s+=`<text x="${cx+30}" y="${i===0?mid+30:top+20}" font-size="12" fill="${Hl}" font-weight="700">${['pilot hole','clearance hole','countersink','counterbore'][i]}</text>`;}
  s+=`<text x="24" y="${top-8}" font-size="11" fill="#3b4a60">top piece</text><text x="24" y="${bot+16}" font-size="11" fill="#3b4a60">${tapped?'metal part':'bottom piece'}</text>`;
  hlSvg.innerHTML=s;hlTxt.innerHTML=`<h4 style="margin-top:0">${T[i][0]}</h4><p>${T[i][1]}</p>`;};
 hlSeg.onclick=e=>{const b=e.target.closest('button');if(!b)return;hlSeg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));draw(+b.dataset.h);};draw(0);}

function initProcessStepper(){let cur=PROCESSES[0],step=0,timer=null;
 prList.innerHTML=PROCESSES.map((p,i)=>`<button class="chip ${i?'':'on'}" data-id="${p.id}">${p.name}</button>`).join('');

function buildQuestionPool(){const pool=QUIZ.map(q=>({topic:q[0],q:q[1],o:q[2],a:q[3],e:q[4]}));
 try{(Auth.S.questions||[]).filter(q=>q.target!=='challenge'&&q.o&&q.o.length>=2).forEach(q=>pool.push({topic:q.topic||"Teacher's picks",q:q.q,o:q.o,a:Math.min(q.answer,q.o.length-1),e:q.explain||''}));}catch(e){}
 const usable=MATERIALS.filter(m=>m.uses);
 usable.forEach(m=>{const others=shuffle(usable.filter(x=>x.cat!==m.cat)).slice(0,3);if(others.length<3)return;const o=shuffle([m,...others]);
  pool.push({topic:'Materials',q:`Which material is typically used for: ${m.uses.split(',').slice(0,3).join(',')}?`,o:o.map(x=>x.name),a:o.indexOf(m),e:`${m.name}: ${m.props[0]}.`,auto:true});
  const cats=shuffle(Object.keys(MATCATS).filter(c=>c!==m.cat)).slice(0,3);const co=shuffle([m.cat,...cats]);pool.push({topic:'Materials',q:`${m.name} is classified as a…`,o:co.map(c=>MATCATS[c].label),a:co.indexOf(m.cat),e:`${m.name} – ${MATCATS[m.cat].label.toLowerCase()}.`,auto:true});});
 TOOLS.forEach(t=>{const others=shuffle(TOOLS.filter(x=>x.id!==t.id)).slice(0,3);const o=shuffle([t,...others]);const first=t.use.split('. ')[0].replace(/\.$/,'');
  pool.push({topic:'Tools',q:`Which tool/equipment: "${first}"?`,o:o.map(x=>x.name),a:o.indexOf(t),e:t.use,auto:true});});
 return pool;}
function initQuiz(){const pool=buildQuestionPool();const topics=['All',...new Set(pool.map(p=>p.topic))];let topic='All',mode='quiz';let qs=[],qi=0,score=0,answered=false;let fc=[],fi=0;
 const drawTopics=()=>{const list=mode==='quiz'?topics:['Key terms','Materials','Tools'];if(!list.includes(topic))topic=list[0];qzTopics.innerHTML=list.map(t=>`<button class="chip ${t===topic?'on':''}" data-t="${t}">${t}</button>`).join('');};
 const startQuiz=()=>{const f=pool.filter(p=>topic==='All'||p.topic===topic);const hand=shuffle(f.filter(p=>!p.auto)),auto=shuffle(f.filter(p=>p.auto));qs=shuffle([...hand.slice(0,7),...auto.slice(0,Math.max(3,10-Math.min(7,hand.length)))]).slice(0,10);qi=0;score=0;showQ();};
 const showQ=()=>{if(qi>=qs.length){const best=LS.get('best_'+topic,0);if(score>best)LS.set('best_'+topic,score);Game.event('quiz',{score,total:qs.length,topic});qzBox.innerHTML=`<h2 style="margin-top:0">${score} / ${qs.length}</h2><div class="bar"><i style="width:${score/qs.length*100}%"></i></div><p>${score>=9?'Outstanding – exam ready! 🏆':score>=7?'Great work – review the ones you missed.':score>=5?'Good start – revisit the topic notes.':'Keep going – read the notes then try again.'}</p><p class="small muted">Best for "${topic}": ${Math.max(best,score)} / 10</p><button class="btn" id="qzAgain">New quiz</button>`;qzAgain.onclick=startQuiz;return;}
  const q=qs[qi];answered=false;qzBox.innerHTML=`<div class="flex" style="justify-content:space-between;align-items:center"><span class="pill">${q.topic}</span><span class="small muted">Question ${qi+1} of ${qs.length} · Score ${score}</span></div><div class="bar" style="margin:8px 0 12px"><i style="width:${qi/qs.length*100}%"></i></div><h3 style="margin-top:0">${esc(q.q)}</h3>${q.o.map((o,i)=>`<button class="qopt" data-i="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}<div id="qzExp"></div>`;};
 qzBox.addEventListener('click',e=>{if(mode!=='quiz')return;const b=e.target.closest('.qopt');if(b&&!answered){answered=true;const q=qs[qi];const i=+b.dataset.i;const ok=i===q.a;if(ok)score++;
   qzBox.querySelectorAll('.qopt').forEach((x,j)=>{if(j===q.a)x.classList.add('right');else if(j===i)x.classList.add('wrong');});
   qzExp.innerHTML=`<div class="${ok?'key':'warn'}" style="margin-top:10px"><p><b>${ok?'Correct!':'Not quite.'}</b> ${esc(q.e)}</p></div><button class="btn" id="qzNext">${qi+1<qs.length?'Next question ▶':'See results'}</button>`;}
  if(e.target.id==='qzNext'){qi++;showQ();}});
 const startFlash=()=>{fc=topic==='Key terms'?GLOSS.map(g=>({f:g[0],b:g[1]})):topic==='Materials'?MATERIALS.map(m=>({f:m.name,b:`<b>${MATCATS[m.cat].label}</b><br>${m.props.join(' · ')}<br><i>Uses: ${m.uses}</i>`})):TOOLS.map(t=>({f:t.name,b:t.use}));fc=shuffle(fc);fi=0;showF();};
 const showF=()=>{const c=fc[fi];qzBox.innerHTML=`<div class="flex" style="justify-content:space-between"><span class="pill">${topic}</span><span class="small muted">Card ${fi+1} of ${fc.length} · tap card to flip</span></div><div class="flash" id="fcCard"><div class="in"><div class="f">${esc(c.f)}</div><div class="b"><div>${c.b}</div></div></div></div><div class="flex" style="justify-content:center"><button class="btn ghost" id="fcPrev">◀ Prev</button><button class="btn ghost" id="fcShuf">🔀 Shuffle</button><button class="btn" id="fcNext">Next ▶</button></div>`;
  fcCard.onclick=()=>fcCard.classList.toggle('flip');fcPrev.onclick=()=>{fi=(fi-1+fc.length)%fc.length;showF();};fcNext.onclick=()=>{fi=(fi+1)%fc.length;showF();};fcShuf.onclick=()=>{fc=shuffle(fc);fi=0;showF();};};

/* ---------- extra info for every tool: how to use, safety, exam tip ---------- */
const TOOLINFO={
rule:{how:['Place the zero end exactly on the edge of the work (or butt it against a stop).','Read the measurement with your eye directly above the mark to avoid parallax error.','Mark with a pencil (wood), scriber (metal) or spirit marker (plastic).'],safety:'Edges can be sharp – carry it flat; never use it as a scraper or lever.',tip:'A steel rule is accurate to about 0.5 mm. For greater accuracy name a vernier caliper or micrometer.'},
tape:{how:['Hook the end over the edge of the work – the sliding hook moves to allow for its own thickness.','Pull out the blade and lock it with the button.','Read the measurement, then let the blade retract slowly.'],safety:'Never let the blade whip back – the edges can cut fingers.',tip:'Use for long lengths and sheet material; a steel rule is better for small, accurate measurements.'},
pencil:{how:['Hold the stock of a try square firmly against the face edge.','Draw the knife along the blade to cut the surface fibres.','The knife line gives an accurate, crisp edge to start a saw cut or chisel.'],safety:'Always cut away from your body and keep the hand holding the work behind the blade.',tip:'A marking knife is more accurate than a pencil across the grain because it severs fibres and stops splintering.'},
scriber:{how:['Coat bright metal with marking blue (layout fluid) so lines show.','Hold the scriber like a pencil, tilted so the point runs against the rule/square.','Draw once, firmly – don\'t go over the line repeatedly.'],safety:'The point is very sharp – keep the cap on or store point-down in a holder.',tip:'Scribers are for metal and plastic; on wood use a pencil or marking knife.'},
marker:{how:['Leave the protective film on acrylic and draw on it, or draw directly on the plastic.','Use a template or rule for accurate lines.','Remove marks afterwards with methylated spirit.'],safety:'Solvent-based markers: use in a ventilated room and replace the cap.',tip:'Scratches from a scriber are permanent on plastic, so a spirit/chinagraph marker is used instead.'},
trysquare:{how:['Hold the stock firmly against the face side or face edge (datum).','Slide the blade to the mark and draw/knife along it to mark 90°.','To check squareness, hold up to the light – no light should show under the blade.'],safety:'Don\'t drop it – a knock can put the blade out of square.',tip:'Always measure and square from the face side/face edge, marked with face marks.'},
bevel:{how:['Loosen the locking nut and set the blade to the angle (using a protractor or drawing).','Tighten the nut.','Hold the stock against the datum edge and mark the angle – repeatable for many parts.'],safety:'Check the nut is tight so the angle doesn\'t slip while marking.',tip:'Use a sliding bevel for any angle (e.g. dovetails); a mitre square is fixed at 45°.'},
mitre:{how:['Hold the stock against the edge of the work.','Mark along the 45° blade with a pencil or knife.','Cut with a tenon saw in a mitre box for accuracy.'],safety:'Keep fingers clear of the saw when using a mitre box.',tip:'Mitre joints (picture frames) need both pieces cut at exactly 45° so they make 90° together.'},
centresq:{how:['Rest the V of the centre square on the end of a round bar.','Draw a line along the blade (it passes through the centre).','Turn the bar about 90° and draw a second line – they cross at the centre.'],safety:'Clamp short bars so they don\'t roll.',tip:'Finding the centre is needed before centre punching and drilling, or before mounting work between lathe centres.'},
punch:{how:['Put the punch point exactly on the cross of the marked lines.','Hold it upright and strike once, firmly, with a ball-pein hammer.','Check the position; the dimple stops the drill bit wandering.'],safety:'Hold the punch near its top with fingers clear; wear eye protection – chips can fly.',tip:'Centre punch (90° point) is for drilling; dot punch (60°) is for making marked lines permanent.'},
dividers:{how:['Set the distance between the points against a steel rule.','Put one point in a dot-punched centre.','Rotate the dividers, leaning slightly forward, to scribe the circle or arc.'],safety:'Points are sharp – store with points protected.',tip:'Dividers also step off equal spacings, e.g. for hole positions around a circle.'},
oddleg:{how:['Set the distance on a rule.','Hold the curved leg (foot) against the straight datum edge.','Draw along the edge so the straight leg scribes a parallel line.'],safety:'Keep fingers away from the scribing point.',tip:'Odd-leg calipers are the "marking gauge" for metal; on wood use a marking gauge.'},
calipers:{how:['Open the legs until they just touch the work (outside: across a diameter; inside: inside a hole).','Remove carefully without changing the setting.','Measure the distance between the points with a steel rule.'],safety:'Never measure work while it is rotating on the lathe.',tip:'Calipers TRANSFER a size – they have no scale themselves.'},
gauge:{how:['Set the pin distance from the stock with a rule and tighten the thumbscrew.','Hold the stock tight against the face side/edge.','Push the gauge away from you, tilted so the pin trails, to scratch a parallel line.'],safety:'The pin is sharp – keep it pointed away from you.',tip:'Marking gauge = with the grain (pin). Cutting gauge = across the grain (blade). Mortise gauge = two pins for mortise & tenons.'},
template:{how:['Make the template accurately once (card, MDF or acrylic).','Hold it firmly on the material.','Draw round it to mark the shape – repeat for every part.'],safety:'Use clamps or double-sided tape on small templates to keep fingers clear when marking.',tip:'Templates save time and give consistency in batch production.'},
scribblock:{how:['Stand the work and the scribing block on the surface plate (datum).','Set the scriber point height against a rule held upright on the plate.','Slide the base along the plate so the point scribes a line at that exact height.'],safety:'Keep the scriber point turned down when not in use.',tip:'The surface plate is a perfectly flat datum surface – all heights are measured from it.'},
vernier:{how:['Close the jaws and check it reads zero.','Close the jaws gently on the work (outside, inside or depth).','Read the main scale before the vernier zero, then find the vernier line that lines up exactly and add.'],safety:'The jaw tips are sharp – don\'t use them as a scriber.',tip:'A typical vernier reads to 0.02 mm. Practise with the vernier simulator lower down this page.'},
micrometer:{how:['Clean the anvil and spindle faces and check it reads zero when closed.','Place the work between the anvil and spindle.','Turn the ratchet until it clicks; read the sleeve (mm and ½ mm) plus the thimble (hundredths).'],safety:'Never over-tighten – always use the ratchet.',tip:'Micrometers read to 0.01 mm – more accurate than a vernier, but for small ranges (e.g. 0–25 mm).'},
digital:{how:['Close the jaws and press ZERO.','Close the jaws on the work.','Read the display directly – switch mm/inch if needed.'],safety:'Keep it dry – it is electronic.',tip:'Advantage: quick and easy to read, can zero at any point. Disadvantage: needs a battery.'},
tenon:{how:['Mark the line with a knife and try square; hold the wood in a vice or on a bench hook.','Start the cut on the waste side with short backward strokes, guided by your thumb.','Lower the saw angle and use the full length of the blade with light pressure.'],safety:'Keep the guiding thumb above the teeth; clamp the work.',tip:'The brass/steel back keeps the thin blade stiff, so it cuts straight – ideal for joints.'},
panel:{how:['Support the board on trestles with the line overhanging.','Start the cut at about 45° on the waste side.','Use long, steady strokes; support the offcut at the end so it doesn\'t split.'],safety:'Keep the free hand well away from the line; support long boards.',tip:'Cross-cut teeth cut across the grain; rip teeth cut along the grain.'},
coping:{how:['Fit the blade with teeth pointing back towards the handle (cuts on the pull).','Hold the work low in a vice, or on a V-board for thin sheet.','Saw with gentle strokes, turning the frame to follow curves. For internal shapes, drill a hole and thread the blade through.'],safety:'Thin blades break – wear eye protection and keep tension correct.',tip:'Coping saw = curves in wood and plastic. Hacksaw = straight cuts in metal.'},
hacksaw:{how:['Fit the blade with the teeth pointing FORWARD and tension it.','Hold the work low in an engineer\'s vice.','Use the full blade length, pressure on the forward stroke, about one stroke per second.'],safety:'Take the final strokes gently so the offcut doesn\'t drop on your feet.',tip:'At least 3 teeth should be in contact – fine-tooth blades (32 TPI) for thin sheet and tube.'},
snips:{how:['Mark the line on the sheet.','Open the snips fully and cut with the full length of the blades.','Use straight snips for straight lines and curved snips for curves; file the burr off afterwards.'],safety:'Cut edges are razor sharp – wear gloves and deburr immediately.',tip:'Snips are used for thin sheet metal only (about 1 mm or less).'},
guillotine:{how:['Lift the lever and slide the sheet under the guard against the stop or line.','Hold the sheet flat behind the guard.','Pull the lever down in one smooth movement.'],safety:'Fingers must stay behind the guard; only one person operates it.',tip:'A guillotine gives fast, straight cuts with no waste kerf – good for batch production.'},
scrollsaw:{how:['Fit the blade with teeth pointing DOWN and tension it.','Lower the hold-down foot onto the work.','Feed the work gently into the blade, turning it to follow the line.'],safety:'Keep fingers away from the blade; switch off before removing scraps.',tip:'For internal cut-outs, drill a hole, unclip the blade and thread it through.'},
bandsaw:{how:['Adjust the upper blade guard to just above the work.','Switch on and let the blade reach full speed.','Feed the work steadily, using a push stick near the blade.'],safety:'Guard just above the work; never reach behind or across the blade.',tip:'A band saw cuts curves and thick material; it can also re-saw boards thinner.'},
jigsaw:{how:['Clamp the sheet with the line overhanging the bench.','Rest the shoe flat on the work and switch on before the blade touches.','Guide the saw along the line without forcing it.'],safety:'Check there is nothing under the cutting line; unplug to change blades.',tip:'Portable power tools are used for large sheets that can\'t be taken to a machine.'},
file:{how:['Hold the work low in a vice with soft jaws.','Cross-file: push forward diagonally with pressure on the forward stroke only.','Finish by draw-filing (file held across the work, pushed along it) for a smooth surface.'],safety:'Always use a file with a handle – the tang can stab your hand.',tip:'Clean clogged teeth (pinning) with a file card. Name the shape AND cut, e.g. "flat second-cut file".'},
rasp:{how:['Hold the wood securely in a vice.','Use the rasp for rapid shaping of curves.','Follow with a file and abrasive paper to remove the rough marks.'],safety:'Keep hands behind the cutting edge.',tip:'A Surform has a perforated blade so shavings pass through and it doesn\'t clog.'},
plane:{how:['Set the blade (cutting iron) so it projects very slightly and evenly.','Hold the work in a vice; press on the front knob at the start, evenly in the middle, on the handle at the end.','Plane WITH the grain to avoid tear-out.'],safety:'Rest the plane on its side so the blade isn\'t damaged; keep fingers away from the sole.',tip:'Planes produce the face side and face edge (datums) of timber.'},
chisel:{how:['Clamp the work securely.','Keep both hands behind the cutting edge; push by hand for paring or tap with a mallet.','Remove waste in thin layers, working towards the marked line.'],safety:'Always cut away from yourself; never use a hammer on a wooden handle – use a mallet.',tip:'Bevel-edged chisels get into corners (dovetails); mortise chisels are thick for levering out waste.'},
gouge:{how:['Clamp the work.','Push the gouge with the bevel rubbing to control the depth.','Work from high to low, across the grain where possible.'],safety:'Both hands behind the edge; keep tools sharp – blunt tools slip.',tip:'In-cannel gouges cut concave shapes; out-cannel gouges hollow out bowls and carvings.'},
abrasives:{how:['Start with a coarse grit and work through finer grades (e.g. 80 → 120 → 240).','Wrap paper round a cork block to keep surfaces flat.','On wood, sand WITH the grain; on plastic use wet & dry, used wet.'],safety:'Wear a dust mask when sanding MDF and hardwoods.',tip:'Lower grit number = coarser. Name the right abrasive: glasspaper (wood), emery cloth (metal), wet & dry (plastic/metal).'},
sanders:{how:['Adjust the table so the gap to the disc is small.','Switch on and let it reach full speed.','Hold the work on the table and press gently on the DOWNWARD-moving side of the disc.'],safety:'Use dust extraction and goggles; never use the upward side – the work will be thrown up.',tip:'Disc and belt sanders shape and smooth quickly; a linisher (belt) is used for metal.'},
buffer:{how:['Apply polishing compound to the spinning mop.','Hold the work firmly below the centre of the mop.','Move it across the mop until the edge or surface is glossy.'],safety:'Work below centre so the work is pulled down, not thrown; no gloves, tie back hair.',tip:'Buffing is the last stage of finishing acrylic edges: file → wet & dry → polish.'},
pillar:{how:['Centre punch the hole position; clamp the work in a machine vice.','Fit the bit, tighten the chuck and REMOVE THE CHUCK KEY.','Set the speed (slower for big bits and metal), lower the guard, then feed down steadily with the handle.'],safety:'Guard down, hair tied back, goggles on, work clamped – never hold work by hand.',tip:'Use the depth stop for blind holes; drill a small pilot hole first for large holes in metal.'},
bits:{how:['Choose the bit for the material and hole: twist drill (general), flat bit / Forstner (large holes in wood), hole saw (very large), countersink.','Fit it centrally in the chuck and tighten in all three holes.','Use the correct speed and cutting fluid for metal.'],safety:'Bits get very hot – let them cool before touching.',tip:'A Forstner bit makes clean, flat-bottomed holes – e.g. the 35 mm hole for a concealed hinge.'},
cordless:{how:['Fit the bit or screwdriver bit and tighten the keyless chuck.','Set the torque clutch (low for screws) and direction.','Squeeze the trigger gently to start, keep the drill square to the work.'],safety:'Clamp small work; remove the battery when changing bits.',tip:'The torque clutch slips at a set force, so screws aren\'t over-tightened or heads stripped.'},
lathe:{how:['Mount the bar in the chuck (3-jaw for round, 4-jaw for square/irregular) and REMOVE THE CHUCK KEY.','Set the tool at centre height in the tool post.','Set the speed, switch on and feed the tool along (parallel turning) or across (facing).'],safety:'Guards closed, goggles/visor, no loose clothing, chuck key removed, never measure while turning.',tip:'Name operations: facing, parallel turning, taper turning, drilling, knurling, parting off, chamfering.'},
woodlathe:{how:['Mount the blank between centres (spindle) or on a faceplate (bowls).','Bring the tool rest close to the work and spin by hand to check clearance.','Turn on at low speed; rest the tool on the rest before it touches the work.'],safety:'Wear a full visor; keep the tool rest close; remove the tool rest before sanding.',tip:'Gouges for shaping, skew chisel for smooth finishes, parting tool for cutting in.'},
tapdie:{how:['Drill the tapping-size hole (e.g. M6 → 5.0 mm).','Start with the taper tap, keeping it upright; add cutting compound.','Turn ½ a turn forward and ¼ back to break the swarf; follow with second and plug taps.'],safety:'Taps are brittle and snap easily – never force them.',tip:'Tap = internal thread. Die = external thread (in a die stock).'},
strip:{how:['Mark the bend line on the acrylic.','Lay it on the strip heater with the line over the element; turn it over regularly.','When soft, bend it over a jig/former and hold until cool.'],safety:'The element and hot plastic can burn – don\'t touch; overheating gives off fumes.',tip:'Too hot = bubbles; not hot enough = cracking or stress whitening.'},
vacformer:{how:['Place the mould on the platen and lower it.','Clamp the thermoplastic sheet (HIPS) and heat until it sags.','Raise the platen, switch on the vacuum, let it cool, then release and trim.'],safety:'Heater and sheet are hot; let the moulding cool before touching.',tip:'Moulds need a draft angle, rounded corners, no undercuts and vent holes.'},
laser:{how:['Draw the design in 2D CAD (cut lines and engrave areas set by colour).','Set material, power and speed; focus the laser on the sheet.','Close the lid, switch on the extraction and run the job – stay with the machine.'],safety:'Never leave it running unattended (fire risk); never cut PVC (toxic chlorine gas).',tip:'Vector = cutting lines; raster = engraving areas.'},
router:{how:['Create a 3D CAD model and generate the toolpaths (CAM).','Clamp the workpiece to the bed and set the zero point.','Close the guard and run the program, watching for problems.'],safety:'Enclosure closed, dust extraction on, emergency stop within reach.',tip:'CNC = Computer Numerical Control: accurate, repeatable parts that run without a skilled operator.'},
printer3d:{how:['Export the CAD model as an STL file and slice it (layer height, infill, supports).','Level the bed and load filament (PLA or ABS).','Print – the nozzle builds the object layer by layer, then remove supports.'],safety:'Nozzle (~200 °C) and bed are hot; use ventilation for ABS fumes.',tip:'3D printing is ADDITIVE manufacture – little waste, good for complex prototypes, but slow.'},
benchvice:{how:['Turn the handle to open the jaws wider than the work.','Place the work low in the jaws (to stop vibration when sawing).','Tighten firmly – the wooden jaw linings protect the work.'],safety:'Don\'t overtighten or hammer the handle; keep fingers clear of closing jaws.',tip:'Many woodwork vices have a quick-release lever to open and close the jaws quickly.'},
engvice:{how:['Fit soft jaw covers (fibre/aluminium) to protect finished surfaces.','Clamp the work low, close to the jaws.','Tighten by hand only.'],safety:'Never use a hammer on the handle or stand on it.',tip:'The vice body is cast iron – strong in compression and absorbs vibration.'},
machvice:{how:['Place the work in the jaws on parallel packing so the drill doesn\'t hit the vice.','Tighten the screw.','Bolt or hold the vice to the drill table so it can\'t spin.'],safety:'A drill bit can grab the work and spin it – always use a machine vice for small parts.',tip:'Using a machine vice is a classic exam safety point for the pillar drill.'},
gclamp:{how:['Open the screw wider than the parts.','Place scrap wood pads under the jaws to protect the work.','Tighten by hand until secure.'],safety:'Check the clamp is secure before machining or sawing.',tip:'G-clamps hold work to the bench and hold glued parts while the adhesive sets.'},
sash:{how:['Dry-assemble the frame first.','Apply glue, position the sash clamps (with scrap pads) and tighten evenly.','Check it is square by measuring the diagonals – they should be equal.'],safety:'Long bars can tip – support the frame on the bench.',tip:'Sash clamps are used for frame and carcase construction and gluing up wide boards.'},
benchhook:{how:['Hook the bench hook over the front of the bench.','Hold the wood firmly against the top stop.','Saw with a tenon saw – the hook stops the wood moving.'],safety:'Keep your hand on the wood away from the saw line.',tip:'A bench hook is a simple holding device for cross-cutting small pieces.'},
handvice:{how:['Grip the small or thin part in the jaws.','Hold the handles firmly while drilling, bending or filing.','Mole grips can be locked onto the work.'],safety:'Keeps fingers away from the drill bit when drilling small parts.',tip:'Use pliers or a hand vice instead of fingers for small work – a common safety answer.'}
};

function loadThree(){if(window.THREE)return Promise.resolve();if(loadThree.p)return loadThree.p;
 const tryLoad=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{s.remove();rej();};document.head.appendChild(s);});
 loadThree.p=tryLoad('three.min.js').catch(()=>tryLoad('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js')).catch(e=>{loadThree.p=null;throw e;});return loadThree.p;}

let KIT_CACHE=null;
function makeKit(){const T=THREE;if(KIT_CACHE){KIT_CACHE.labels=[];return KIT_CACHE;}const K={labels:[]};
 let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
 const cv=(w,h,draw)=>{const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);return c;};
 const tx=(c,srgb=true)=>{const t=new T.CanvasTexture(c);if(srgb)t.encoding=T.sRGBEncoding;t.anisotropy=8;t.wrapS=t.wrapT=T.RepeatWrapping;return t;};
 K.tex=(w,h,draw)=>{const t=tx(cv(w,h,draw));t.wrapS=t.wrapT=T.ClampToEdgeWrapping;return t;};
 // --- procedural textures ---
 const woodCanvas=(base,light,dark,knots)=>cv(512,512,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,base);g.addColorStop(.25,light);g.addColorStop(.5,base);g.addColorStop(.75,light);g.addColorStop(1,base);x.fillStyle=g;x.fillRect(0,0,w,h);
   for(let i=0;i<90;i++){const y0=rnd()*h,a=0.04+rnd()*0.2,k=1+Math.floor(rnd()*3),amp=1+rnd()*5,ph=rnd()*6;x.strokeStyle=`rgba(${dark},${a})`;x.lineWidth=0.5+rnd()*3;x.beginPath();for(let X=0;X<=w;X+=4){const y=y0+Math.sin(X/w*Math.PI*2*k+ph)*amp;X?x.lineTo(X,y):x.moveTo(X,y);}x.stroke();}
   for(let i=0;i<500;i++){x.fillStyle=`rgba(${dark},${rnd()*0.12})`;x.fillRect(rnd()*w,rnd()*h,2+rnd()*10,1);}
   if(knots)for(let i=0;i<2;i++){const cx=60+rnd()*390,cy=60+rnd()*390;for(let r=18;r>2;r-=3){x.strokeStyle=`rgba(${dark},.35)`;x.lineWidth=2;x.beginPath();x.ellipse(cx,cy,r*1.8,r*0.7,0,0,7);x.stroke();}}});
 const brushed=cv(256,256,(x,w,h)=>{x.fillStyle='#8a8a8a';x.fillRect(0,0,w,h);for(let i=0;i<1400;i++){const v=100+rnd()*110|0;x.fillStyle=`rgba(${v},${v},${v},0.35)`;x.fillRect(0,rnd()*h,w,0.6+rnd()*1.2);}});
 const hammer=cv(256,256,(x,w,h)=>{x.fillStyle='#808080';x.fillRect(0,0,w,h);for(let i=0;i<900;i++){const r=1+rnd()*5,v=90+rnd()*90|0;const g=x.createRadialGradient(0,0,0,0,0,r);x.save();x.translate(rnd()*w,rnd()*h);g.addColorStop(0,`rgba(${v},${v},${v},.8)`);g.addColorStop(1,'rgba(128,128,128,0)');x.fillStyle=g;x.fillRect(-r,-r,2*r,2*r);x.restore();}});
 const grit=cv(256,256,(x,w,h)=>{x.fillStyle='#777';x.fillRect(0,0,w,h);for(let i=0;i<6000;i++){const v=rnd()*255|0;x.fillStyle=`rgb(${v},${v},${v})`;x.fillRect(rnd()*w,rnd()*h,1.5,1.5);}});
 const knurlC=cv(64,64,(x,w,h)=>{x.fillStyle='#9aa3ae';x.fillRect(0,0,w,h);x.strokeStyle='#3d444d';x.lineWidth=2.2;for(let i=-w;i<w*2;i+=8){x.beginPath();x.moveTo(i,0);x.lineTo(i+h,h);x.stroke();x.beginPath();x.moveTo(i,h);x.lineTo(i+h,0);x.stroke();}});
 const tBr=tx(brushed,false),tHam=tx(hammer,false),tGrit=tx(grit,false);const tKn=tx(knurlC);tKn.repeat.set(5,3);const tKnB=tx(knurlC,false);tKnB.repeat.set(5,3);
 const std=(o)=>new T.MeshStandardMaterial(o);const phy=(o)=>new T.MeshPhysicalMaterial(o);
 const woodMat=(base,light,dark,knots,vert)=>{const c=woodCanvas(base,light,dark,knots);const m=std({map:tx(c),bumpMap:tx(c,false),bumpScale:0.015,roughness:0.62,metalness:0});m.userData={box:16,vert};return m;};
 const handleMat=(base,light,dark)=>{const c=woodCanvas(base,light,dark,false);const t=tx(c);t.center.set(.5,.5);t.rotation=Math.PI/2;t.repeat.set(1,0.6);return std({map:t,roughness:0.45,metalness:0});};
 const paint=(c,ham=true)=>{const m=std({color:c,metalness:0.15,roughness:0.5,bumpMap:ham?tHam:null,bumpScale:0.012});m.userData={box:5};return m;};
 const plastic=(c,cc=0.6)=>phy({color:c,roughness:0.38,metalness:0,clearcoat:cc,clearcoatRoughness:0.25});
 K.m={
  steel:std({color:'#d3d9e0',metalness:1,roughness:0.3,roughnessMap:tBr}),dsteel:std({color:'#77818e',metalness:0.95,roughness:0.42,roughnessMap:tBr}),chrome:std({color:'#eef1f4',metalness:1,roughness:0.12}),
  blackox:std({color:'#33373d',metalness:0.7,roughness:0.42}),black:std({color:'#24272c',metalness:0.1,roughness:0.72}),
  wood:woodMat('#b57a44','#c9925b','70,36,12',false),dwood:woodMat('#86532a','#996236','42,20,6',false),lwood:woodMat('#d2a771','#e0bb86','105,68,32',true),ply:woodMat('#cfa873','#ddbb88','100,62,26',false),

 const sel=$('Sel');
 const body=()=>{const I=infoFn(curId);const box=$('Info');
  if(tab==='ov')box.innerHTML=I.html;
  if(tab==='how')box.innerHTML=I.how&&I.how.length?`<ol class="v3steps">${I.how.map(s=>`<li>${s}</li>`).join('')}</ol>`:'<p class="muted">No steps for this item.</p>';
  if(tab==='safe')box.innerHTML=I.safety?`<div class="warn" style="margin:4px 0"><p>${I.safety}</p></div>`:'<p class="muted">General workshop rules apply.</p>';
  if(tab==='tip')box.innerHTML=I.tip?`<div class="tip" style="margin:4px 0"><p>${I.tip}</p></div>`:'<p class="muted">No tip.</p>';
  if(tab==='parts')box.innerHTML=parts.length?`<p class="muted" style="margin-top:0">Tap a part to highlight it on the model.</p><div class="v3parts">${parts.map((p,i)=>`<button data-p="${i}"><b>${i+1}</b>${p}</button>`).join('')}</div>`:'<p class="muted">Parts are labelled on the model.</p>';};
 const show=id=>{const d=defs[id];if(!d)return;curId=id;sel.value=id;const I=infoFn(id);$('Name').textContent=I.name;$('Cat').textContent=I.cat||'';$('Act').innerHTML=`<span>▶</span> ${d.act}`;if(V){V.load(d,I.name);pb.textContent='▶ Use it';}body();};
 const api={show,cur:current};
 loadThree().then(()=>{if(!document.body.contains(host))return;V=make3DViewer(host,{onT:t=>{tIn.value=Math.round(t*1000);pct.textContent=Math.round(t*100)+'%';},onLabels:l=>{parts=l;if(tab==='parts')body();}});CLEANUP.push(()=>V.dispose());show(api.cur||current);}).catch(()=>{host.innerHTML='<div class="warn" style="margin:20px"><p>3D needs WebGL to run. Try reloading the page or another browser.</p></div>';});
 sel.onchange=()=>{api.cur=sel.value;show(sel.value);};
 tIn.oninput=()=>{pct.textContent=Math.round(tIn.value/10)+'%';if(V){V.setT(tIn.value/1000);pb.textContent='▶ Use it';}};
 pb.onclick=()=>{if(!V)return;pb.textContent=V.play()?'⏸ Pause':'▶ Use it';};
 $('View').onclick=e=>{const b=e.target.closest('button');if(!b||!V)return;document.querySelectorAll(`#${prefix}View button`).forEach(x=>x.classList.toggle('on',x===b));V.view(b.dataset.v);};
 $('Spin').onclick=e=>{if(V)e.target.textContent=V.spin()?'■ Stop':'⟳ Spin';};
 $('Tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;$('Tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));body();};
 $('Info').onclick=e=>{const b=e.target.closest('[data-p]');if(b&&V)V.flash(+b.dataset.p);};
 show(current);return api;}
