name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Business Studies app
        working-directory: subjects/business
        env:
          VITE_APPS_SCRIPT_URL: ${{ secrets.VITE_APPS_SCRIPT_URL }}
        run: |
          npm install
          npm run build

      - name: Assemble static site
        run: |
          rm -rf _site
          mkdir -p _site
          for item in *; do
            case "$item" in
              _site) ;;
              *) cp -r "$item" _site/ ;;
            esac
          done
          rm -rf _site/subjects/business/node_modules _site/subjects/business/src _site/subjects/business/dist _site/subjects/business/.env.local _site/subjects/business/scripts
          cp -r subjects/business/dist/* _site/subjects/business/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
